spec_version: 1
name: fixer
description: >-
  Applies the triager's edits for one page or group of pages: rewrites the
  affected claims, R01 known issues, compatibility claims, nav slots, and the
  upgrade notes; in release mode runs the release-bump skill. Writes only under
  content/ and the run directory.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

skills: [authoring-prime, docs-write, docs-query, release-bump, humanizer]

# Network stays on for `uv run` resolving snippet dependencies.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 60
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: true
          risky_action: DENY
    # content/ for the docs, .omni-docs-doc/run/ for release.md. The ledger is
    # the orchestrator's (through `docsnip upstream verdict`), and
    # compatibility.json is regenerated by `docsnip compat --fix`. The workflow
    # checks the same allowlist on the final diff, shell writes included.
    writes_under_content:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type != "tool_call"
            || !(event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"])
            ? {"result": "ALLOW"}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)content/[^/]+/compatibility[.]json$")
            ? {"result": "DENY", "reason": "compatibility.json is generated; run `uv run docsnip compat --fix`."}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)(content/|[.]omni-docs-doc/run/)")
            ? {"result": "ALLOW"}
            : {"result": "DENY", "reason": "fixer may only write under content/ or .omni-docs-doc/run/."}
