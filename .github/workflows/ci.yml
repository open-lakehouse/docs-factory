name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every script, nightly: the docs pin their releases, but images such as
  # amazon/aws-cli:latest and the Maven/PyPI mirrors can still move under them.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  python-tests:
    # docsnip's own tests, on every Python the workspace supports. The tutorial
    # scripts pin their own Python and run in the scripts-* lanes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest tools/docsnip/tests -v

  plan:
    # Which tutorial scripts this run executes, per lane, packed into shards by
    # recorded duration (`docsnip plan`). A pull request runs the scripts its
    # changes reach; main, the nightly run, and manual runs execute them all.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      default: ${{ steps.plan.outputs.default }}
      spark: ${{ steps.plan.outputs.spark }}
      jvm: ${{ steps.plan.outputs.jvm }}
      rust: ${{ steps.plan.outputs.rust }}
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; HEAD^1 is the base.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | tee "$RUNNER_TEMP/changed.txt"
            uv run docsnip plan --changed-from "$RUNNER_TEMP/changed.txt" --github-output "$GITHUB_OUTPUT"
          else
            uv run docsnip plan --github-output "$GITHUB_OUTPUT"
          fi

  scripts-default:
    # Scripts that need neither Java nor Docker. Scripts on draft pages run as
    # non-strict xfails (content/conftest.py), so only `status: ready` gates.
    name: scripts-default (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.default != '[]'
    runs-on: ubuntu-latest
    # Backstop: content/conftest.py already kills a script after 10 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.default) }}
    env:
      DOCS_FACTORY_SELECT: ${{ toJSON(matrix.scripts) }}
      DOCS_FACTORY_DURATIONS_OUT: durations.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      - run: uv run pytest content -v -rxXs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: durations-${{ matrix.id }}
          path: durations.json
          if-no-files-found: ignore

  scripts-spark:
    # Scripts with `lane = "spark"` (PySpark, and the spark-sql shell the Delta
    # pages start). Needs Java; Spark resolves Delta Spark from Maven Central.
    name: scripts-spark (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.spark != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.spark) }}
    env:
      DOCS_FACTORY_SELECT: ${{ toJSON(matrix.scripts) }}
      DOCS_FACTORY_DURATIONS_OUT: durations.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # Keep the large pyspark wheel, which pruning would evict.
          prune-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Spark 4 keeps the jars it resolves for --packages here.
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('content/delta/release.yml') }}
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      - run: uv run pytest content -m "needs_spark and not needs_uc_server" -v -rxXs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: durations-${{ matrix.id }}
          path: durations.json
          if-no-files-found: ignore

  scripts-jvm:
    # Scala scripts run by scala-cli and Java scripts run by JBang. Both resolve
    # Spark and Delta Spark from Maven Central through Coursier or Maven.
    name: scripts-jvm (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.jvm != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jvm) }}
    env:
      DOCS_FACTORY_SELECT: ${{ toJSON(matrix.scripts) }}
      DOCS_FACTORY_DURATIONS_OUT: durations.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # v1.18.0
        with:
          scala-cli-version: "1.18.0"
          # The JVM comes from setup-java. `apps` stays at its default: emptying
          # it skips installing scala-cli too.
          jvm: ""
      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
        with:
          version: "0.132.1"
          setup-java: "false"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Coursier's cache (scala-cli) and Maven's local repository (JBang).
          path: |
            ~/.cache/coursier
            ~/.m2/repository
          key: jvm-deps-${{ hashFiles('content/delta/release.yml') }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      - run: uv run pytest content -m needs_jvm -v -rxXs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: durations-${{ matrix.id }}
          path: durations.json
          if-no-files-found: ignore

  scripts-rust:
    # Rust scripts, each an example of the snippets crate (content/_rust). The
    # crate's dependencies build once; each script then only links and runs.
    name: scripts-rust (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.rust != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rust) }}
    env:
      DOCS_FACTORY_SELECT: ${{ toJSON(matrix.scripts) }}
      DOCS_FACTORY_DURATIONS_OUT: durations.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # rustup ships on the runner (see rust.yml).
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: snippets
      - run: cargo build --locked --package docs-factory-snippets --examples
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      - run: uv run pytest content -m needs_rust -v -rxXs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: durations-${{ matrix.id }}
          path: durations.json
          if-no-files-found: ignore

  scripts-services:
    # Scripts that declare a compose: the harness starts the Unity Catalog stack
    # each one names (via testcontainers). Docker is on ubuntu-latest runners.
    name: scripts-services (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      DOCS_FACTORY_SELECT: ${{ toJSON(matrix.scripts) }}
      DOCS_FACTORY_DURATIONS_OUT: durations.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages --group test-services
      - run: uv run --group test-services pytest content -m "needs_docker or needs_uc_server" -v -rxXs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: durations-${{ matrix.id }}
          path: durations.json
          if-no-files-found: ignore

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/bun-setup
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      # Export the LikeC4 model fresh so references:/model: id validation runs
      # against the real estate, not a possibly-stale committed dist/model.json
      # (a missing model silently skips id validation — a false pass).
      - name: Export architecture model
        run: cd architecture && bun install --frozen-lockfile && bun run model
      - name: Validate frontmatter and snippets
        run: uv run docsnip check
      # content-core is the shared parsing authority (render plugin + version
      # manifest + site libs). Its drift tests assert the fence/slug/identity/
      # normalize/vocab contract stays identical across every consumer. Some of
      # these tests exercise the emitter across the site↔emit boundary (the .md
      # twin target, emitOne), so emit's deps must be installed too.
      - name: content-core drift tests
        run: |
          cd emit && bun install --frozen-lockfile && cd ..
          cd site && bun install --frozen-lockfile && bun test src/content-core
      - name: Validate nav.yml manifests
        run: cd site && node scripts/check-nav.mjs
      # The docs-site emitter's sync/diff, nav projection, and page rendering.
      - name: docs-site emitter tests
        run: cd emit && bun test docs

  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: Install site deps
        run: cd site && bun install --frozen-lockfile
      - name: Typecheck site
        run: cd site && bun run typecheck
      - name: Build site (content + review surface)
        run: cd site && bun run build

  review-api:
    # Proto → Connect RPC contract + the Neon Function backend. Lints the
    # protos, verifies committed generated code is in sync, and typechecks the
    # server (the same Hono+Connect app the Neon Function runs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Lint protos
        run: cd proto && buf lint
      - name: Verify generated code is up to date
        run: |
          cd proto && buf generate
          gen="../site/src/gen ../server/src/gen ../tools/review-feedback/src/gen"
          if ! git diff --quiet -- $gen; then
            echo "::error::Generated code is stale. Run 'just buf-gen' and commit the result."
            git diff --stat -- $gen
            exit 1
          fi
      - name: Typecheck server
        run: cd server && bun install --frozen-lockfile && bun run typecheck
      - name: Build content version manifest
        run: |
          cd site && bun install --frozen-lockfile
          node scripts/build-version-manifest.mjs
      # Imports content-core from site/, so it runs after the site install above.
      - name: Typecheck + test review-feedback (agent CLI/MCP)
        run: |
          cd tools/review-feedback && bun install --frozen-lockfile
          bun run typecheck && bun test

  ready-approvals:
    # Advisory (docs/decisions/ADR-0002): `status: ready` merged to main is the
    # release, and an approval in the review app is what should precede it. Warns
    # on pages this PR moves to ready without one; never fails. Inert until the
    # DOCS_REVIEW_API_URL + DOCS_REVIEW_TOKEN (a `feedback:read` token) repo
    # secrets exist, and on fork PRs, which get no secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/bun-setup
      - name: Warn on ready without approval
        env:
          DOCS_REVIEW_API_URL: ${{ secrets.DOCS_REVIEW_API_URL }}
          DOCS_REVIEW_TOKEN: ${{ secrets.DOCS_REVIEW_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          cd site && bun install --frozen-lockfile && cd ../tools/review-feedback
          bun install --frozen-lockfile
          bun run cli check-ready --base "origin/$BASE_REF"

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: Validate LikeC4 architecture model
        run: |
          cd architecture && bun install --frozen-lockfile && bun run check

  lint-js:
    # Biome lint + format check across the TS/JS projects. Each project's
    # biome.json extends the root // config; `biome ci` is the read-only,
    # non-writing gate (lint + formatting). The pinned @biomejs/biome devDep
    # makes `bunx biome` resolve the identical version locally, in pre-commit,
    # and here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: Biome check (site)
        run: cd site && bun install --frozen-lockfile && bunx biome ci
      - name: Biome check (server)
        run: cd server && bun install --frozen-lockfile && bunx biome ci
      - name: Biome check (emit)
        run: cd emit && bun install --frozen-lockfile && bunx biome ci
      - name: Biome check (review-feedback)
        run: cd tools/review-feedback && bun install --frozen-lockfile && bunx biome ci
