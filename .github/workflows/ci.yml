name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages --python ${{ matrix.python-version }}
      - name: Run docsnip tests + service-free tutorial scripts
        # Default lane: docsnip drift/vocab tests plus the colocated tutorial
        # scripts under content/ (run to completion via `uv run`). The pytest
        # addopts marker filter excludes the service-backed tutorials (those run
        # in tutorials-services).
        run: uv run --python ${{ matrix.python-version }} pytest -v

  tutorials-services:
    # Service-backed tutorial tests: start the Unity Catalog server each script
    # declares (via testcontainers) and run the opt-in lane. Docker is available
    # on ubuntu-latest runners.
    runs-on: ubuntu-latest
    # blog drafts etc may depend on unreleased local artefacts.
    # TODO: check content status and fail job if ready and tests are failing,
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages --group test-services
      - name: Run service-backed tutorial tests
        run: uv run --group test-services pytest -m "needs_docker or needs_uc_server" -v

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/bun-setup
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages
      # Export the LikeC4 model fresh so references:/model: id validation runs
      # against the real estate, not a possibly-stale committed dist/model.json
      # (a missing model silently skips id validation — a false pass).
      - name: Export architecture model
        run: cd architecture && bun install --frozen-lockfile && bun run model
      - name: Validate frontmatter and snippets
        run: uv run docsnip check
      # content-core is the shared parsing authority (render plugin + version
      # manifest + site libs). Its drift tests assert the fence/slug/identity/
      # normalize/vocab contract stays identical across every consumer. Some of
      # these tests exercise the emitter across the site↔emit boundary (the .md
      # twin target, emitOne), so emit's deps must be installed too.
      - name: content-core drift tests
        run: |
          cd emit && bun install --frozen-lockfile && cd ..
          cd site && bun install --frozen-lockfile && bun test src/content-core

  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: Install site deps
        run: cd site && bun install --frozen-lockfile
      - name: Typecheck site
        run: cd site && bun run typecheck
      - name: Build site (content + review surface)
        run: cd site && bun run build

  review-api:
    # Proto → Connect RPC contract + the Neon Function backend. Lints the
    # protos, verifies committed generated code is in sync, and typechecks the
    # server (the same Hono+Connect app the Neon Function runs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Lint protos
        run: cd proto && buf lint
      - name: Verify generated code is up to date
        run: |
          cd proto && buf generate
          if ! git diff --quiet -- ../site/src/gen ../server/src/gen; then
            echo "::error::Generated code is stale. Run 'just buf-gen' and commit the result."
            git diff --stat -- ../site/src/gen ../server/src/gen
            exit 1
          fi
      - name: Typecheck server
        run: cd server && bun install --frozen-lockfile && bun run typecheck
      - name: Build content version manifest
        run: |
          cd site && bun install --frozen-lockfile
          node scripts/build-version-manifest.mjs

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: Validate LikeC4 architecture model
        run: |
          cd architecture && bun install --frozen-lockfile && bun run check

  lint-js:
    # Biome lint + format check across the TS/JS projects. Each project's
    # biome.json extends the root // config; `biome ci` is the read-only,
    # non-writing gate (lint + formatting). The pinned @biomejs/biome devDep
    # makes `bunx biome` resolve the identical version locally, in pre-commit,
    # and here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: Biome check (site)
        run: cd site && bun install --frozen-lockfile && bunx biome ci
      - name: Biome check (server)
        run: cd server && bun install --frozen-lockfile && bunx biome ci
      - name: Biome check (emit)
        run: cd emit && bun install --frozen-lockfile && bunx biome ci
