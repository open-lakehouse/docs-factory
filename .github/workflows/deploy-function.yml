# Deploy the review backend (server/) to the PRODUCTION Neon branch's Function.
# (Per-PR preview Function deploys live in preview-deploy.yml.)
#
# INERT UNTIL PROVISIONED. The push trigger is live, but the job's `if:` guard
# runs it only on main AND only when the repo variable REVIEW_DEPLOY_ENABLED is
# 'true' — so until provisioning sets that variable and the secrets/vars under
# `env`, every push is a no-op. Mirrors register-versions.yml. See the manual
# steps in docs/deploy/runbook.md.
#
# What it does: applies migrations to the prod branch (direct URL), then bundles
# server/ and deploys it as the prod Neon Function via the Neon CLI. The Function
# entrypoint is server/src/handler.ts (`export default { fetch }`). DATABASE_URL
# is injected by Neon at runtime; the other env is set on the Function at deploy.

name: Deploy review Function

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Neon Function slug to deploy to"
        required: true
        default: "review"
  push:
    branches: [main]

concurrency:
  group: deploy-function
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Extra guard: even if the push trigger is later uncommented, only run on
    # main and only when explicitly enabled via a repo variable. Until
    # REVIEW_DEPLOY_ENABLED is set to 'true', this job is a no-op.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && vars.REVIEW_DEPLOY_ENABLED == 'true')
    # Prod secrets/vars (DATABASE_URL, prod NEON_API_KEY, prod REVIEW_ALLOWED_ORIGIN)
    # live in the `production` environment, branch-restricted to main with optional
    # required reviewers — a stronger gate than the `if:` ref check. See runbook §3.
    environment: production
    env:
      # Set as repo secrets/vars when provisioning (see docs/deploy/runbook.md):
      #   NEON_API_KEY            secret — authenticates the Neon CLI
      #   DATABASE_URL            secret — prod branch DIRECT (unpooled) URL, for
      #                                    migrations run here before the deploy
      #   REVIEW_BUILD_SECRET     secret — shared secret RegisterVersion checks
      #   NEON_PROJECT_ID         var    — Neon project id
      #   REVIEW_ALLOWED_ORIGIN   var    — comma-separated CORS allowlist (Vercel origin)
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install server deps
        run: cd server && bun install --frozen-lockfile
      - name: Guard required secrets
        run: |
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error::NEON_API_KEY secret is not set — provision the Neon project first (docs/deploy/runbook.md)."
            exit 1
          fi
      # Migrations must be applied to the prod branch BEFORE the Function serves
      # new schema. Run against the DIRECT (unpooled) URL — the pooler doesn't
      # support every DDL path and migrate.mjs holds a single connection.
      - name: Migrate the prod branch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret (prod branch direct URL) is not set — see docs/deploy/runbook.md."
            exit 1
          fi
          cd server && node scripts/migrate.mjs
      # NOTE: exact Neon CLI invocation is finalized at provisioning (the CLI is
      # in beta). Deploy the single Function from server/, passing the non-injected
      # env; DATABASE_URL is injected by Neon, not passed here. All ${{ }}
      # expansions are passed via env, never interpolated into the shell body, so
      # untrusted input can't inject commands (zizmor).
      - name: Deploy Neon Function
        env:
          SLUG: ${{ inputs.slug || 'review' }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          ALLOWED_ORIGIN: ${{ vars.REVIEW_ALLOWED_ORIGIN }}
          REVIEW_BUILD_SECRET: ${{ secrets.REVIEW_BUILD_SECRET }}
        run: |
          set -o pipefail  # surface a neonctl failure, not jq's exit status
          # Deploy fire-and-forget with --wait=false: the default (--wait=true)
          # BLOCKS polling for a terminal state (10-min timeout) and hung CI. The
          # deploy still runs server-side; we poll `functions get` for the
          # invocation_url on our own short budget instead. See preview-deploy.yml
          # and docs/deploy/runbook.md §4 for the rationale.
          bunx neonctl functions deploy "$SLUG" \
            --project-id "$NEON_PROJECT_ID" \
            --src server/src/handler.ts --wait=false \
            --env AUTH_MODE=neon \
            --env NODE_ENV=production \
            --env ALLOWED_ORIGIN="$ALLOWED_ORIGIN" \
            --env BUILD_SECRET="$REVIEW_BUILD_SECRET"

          INVOCATION_URL=""
          for _ in $(seq 1 30); do
            INVOCATION_URL=$(bunx neonctl functions get "$SLUG" \
              --project-id "$NEON_PROJECT_ID" --output json \
              | jq -r '.invocation_url // .invocationUrl // .url // empty')
            [ -n "$INVOCATION_URL" ] && break
            sleep 5
          done
          if [ -z "$INVOCATION_URL" ]; then
            echo "::error::no invocation_url from 'neonctl functions get $SLUG' after polling — the deploy may have failed; check the Neon console (docs/deploy/runbook.md §4)."
            exit 1
          fi
          # The prod host is stable across deploys (default branch id + slug). Set
          # it ONCE as Vercel Production env NEON_FUNCTION_HOST — it is not wired
          # automatically here. Surface it so the first deploy can copy it over.
          echo "::notice::prod Function host — set Vercel Production env NEON_FUNCTION_HOST=${INVOCATION_URL#https://}"
