# Deploy the review backend (server/) to the PRODUCTION Neon branch's Function.
# (Per-PR preview Function deploys live in preview-deploy.yml.)
#
# What it does: applies migrations to the prod branch (direct URL), then bundles
# server/ and deploys it as the prod Neon Function via the Neon CLI. The Function
# entrypoint is server/src/handler.ts (`export default { fetch }`). DATABASE_URL
# is injected by Neon at runtime; the other env is set on the Function at deploy.

name: Deploy review Function

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Neon Function slug to deploy to"
        required: true
        default: "review"
  push:
    branches: [main]

concurrency:
  group: deploy-function
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Runs on every push to main (and on manual dispatch). Prod secrets/vars
    # (DATABASE_URL, prod NEON_API_KEY, prod REVIEW_ALLOWED_ORIGIN) live in the
    # `production` environment, branch-restricted to main with optional required
    # reviewers — that restriction is the real gate on who/what can deploy prod.
    # See runbook §3.
    environment: production
    env:
      # Set as repo secrets/vars when provisioning (see docs/deploy/runbook.md):
      #   NEON_API_KEY            secret — authenticates the Neon CLI
      #   DATABASE_URL            secret — prod branch DIRECT (unpooled) URL, for
      #                                    migrations run here before the deploy
      #   REVIEW_BUILD_SECRET     secret — shared secret RegisterVersion checks
      #   NEON_PROJECT_ID         var    — Neon project id
      #   REVIEW_ALLOWED_ORIGIN   var    — comma-separated CORS allowlist (Vercel origin)
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install server deps
        run: cd server && bun install --frozen-lockfile
      - name: Guard required secrets
        run: |
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error::NEON_API_KEY secret is not set — provision the Neon project first (docs/deploy/runbook.md)."
            exit 1
          fi
      # Migrations must be applied to the prod branch BEFORE the Function serves
      # new schema. Run against the DIRECT (unpooled) URL — the pooler doesn't
      # support every DDL path and migrate.mjs holds a single connection.
      - name: Migrate the prod branch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret (prod branch direct URL) is not set — see docs/deploy/runbook.md."
            exit 1
          fi
          cd server && node scripts/migrate.mjs
      # Deploy the single Function from server/, passing the non-injected env;
      # DATABASE_URL is injected by Neon, not passed here. The detached-deploy +
      # poll dance (a beta-neonctl workaround) lives in scripts/deploy-neon-function.sh,
      # shared with preview-deploy.yml. All ${{ }} expansions are passed via env,
      # never interpolated into the shell body, so untrusted input can't inject
      # commands (zizmor).
      - name: Deploy Neon Function
        env:
          # Function slug: one source of truth (vars.REVIEW_FUNCTION_SLUG), with a
          # manual-dispatch override and a 'review' default so an unset var still works.
          SLUG: ${{ inputs.slug || vars.REVIEW_FUNCTION_SLUG || 'review' }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          ALLOWED_ORIGIN: ${{ vars.REVIEW_ALLOWED_ORIGIN }}
          REVIEW_BUILD_SECRET: ${{ secrets.REVIEW_BUILD_SECRET }}
          # Neon Auth base URL (same value as the client's VITE_NEON_AUTH_URL) —
          # the JWT issuer/audience + JWKS base the Function verifies bearers against.
          NEON_AUTH_URL: ${{ vars.REVIEW_NEON_AUTH_URL }}
        run: |
          if [ -z "${NEON_AUTH_URL:-}" ]; then
            echo "::error::REVIEW_NEON_AUTH_URL var is not set — the Function can't verify Neon Auth JWTs without it (docs/deploy/runbook.md)."
            exit 1
          fi
          HOST=$(scripts/deploy-neon-function.sh "$SLUG" "$NEON_PROJECT_ID" \
            --env AUTH_MODE=neon \
            --env NODE_ENV=production \
            --env ALLOWED_ORIGIN="$ALLOWED_ORIGIN" \
            --env BUILD_SECRET="$REVIEW_BUILD_SECRET" \
            --env NEON_AUTH_URL="$NEON_AUTH_URL")
          # The prod host is stable across deploys (default branch id + slug). Set
          # it ONCE as Vercel Production env NEON_FUNCTION_HOST — it is not wired
          # automatically here. Surface it so the first deploy can copy it over.
          echo "::notice::prod Function host — set Vercel Production env NEON_FUNCTION_HOST=${HOST}"
