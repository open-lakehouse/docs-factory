name: examples-ci

on:
  push:
    paths:
      - "examples/**"
      - "pyproject.toml"
      - "ty.toml"
      - ".github/workflows/examples-ci.yml"
  pull_request:
    paths:
      - "examples/**"
      - "pyproject.toml"
      - "ty.toml"
      - ".github/workflows/examples-ci.yml"

jobs:
  lint-and-test:
    name: Lint (ty) + Test (pytest)
    runs-on: ubuntu-latest

    services:
      garage:
        image: dxflrs/garage:v1.0.1
        ports:
          - 3900:3900
          - 3902:3902
        env:
          GARAGE_LOG_LEVEL: info

    env:
      AWS_ENDPOINT_URL: http://localhost:3900
      AWS_REGION: us-east-1
      DELTA_TABLE_S3_PATH: s3://test-delta/sample-table
      AWS_ACCESS_KEY_ID: ${{ env.GARAGE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ env.GARAGE_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.10"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Type-check with ty
        run: uv run ty check examples/

      - name: Initialize Garage for S3 tests
        run: |
          echo "Waiting for Garage to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3900/health > /dev/null 2>&1; then
              echo "Garage is ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Garage did not become ready within 60s" >&2
              exit 1
            fi
            sleep 1
          done

          NODE_ID=$(garage -a http://localhost:3902 status --format json | python3 -c "import sys,json; print(json.load(sys.stdin)['nodes'][0]['id'])")
          echo "Node ID: $NODE_ID"

          garage -a http://localhost:3902 layout assign -z dc1 -c 1G "$NODE_ID"
          garage -a http://localhost:3902 layout apply --version 1

          garage -a http://localhost:3902 bucket create test-delta

          KEY_OUTPUT=$(garage -a http://localhost:3902 key create ci-key --output-format json)
          ACCESS_KEY=$(echo "$KEY_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['accessKeyId'])")
          SECRET_KEY=$(echo "$KEY_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['secretAccessKey'])")

          garage -a http://localhost:3902 bucket allow --read --write --owner test-delta --key ci-key

          echo "GARAGE_ACCESS_KEY_ID=$ACCESS_KEY" >> "$GITHUB_ENV"
          echo "GARAGE_SECRET_ACCESS_KEY=$SECRET_KEY" >> "$GITHUB_ENV"

      - name: Run local tests (non-S3)
        run: uv run pytest examples/ -m "not s3"

      - name: Run S3 integration tests
        run: uv run pytest examples/ -m s3
