# Per-PR preview environment: the review Function deployed to the Neon DB branch
# the Neon↔Vercel integration provisions for the preview, + a Vercel preview
# build whose same-origin /api rewrite points at that branch's Function.
#
# DISABLED BY DEFAULT. The Neon project, Function tooling, and Vercel project are
# provisioned manually (see docs/deploy/runbook.md). Until the repo variable
# PREVIEW_DEPLOY_ENABLED is set to 'true' AND the secrets below exist, every job
# no-ops — mirroring deploy-function.yml / register-versions.yml.
#
# Branch ownership: the Neon↔Vercel integration owns the per-preview DB branch.
# On a push to a PR, Vercel provisions a Neon branch `preview/<head_ref>` and
# injects its connection strings into the Vercel *preview* env (scoped to that
# git branch) BEFORE this workflow's deploy steps run. We therefore do NOT create
# a branch ourselves — we pull that env, migrate against it, and deploy the
# Function to the same branch. Teardown is the integration's too (it removes the
# branch when the preview is removed), so there is no close/cleanup job here.
#
# Flow (opened/synchronize/reopened):
#   1. `vercel env pull --git-branch=<head_ref>` → the branch's connection
#      strings (DATABASE_URL_UNPOOLED for migrations). This is also our
#      synchronization point: it succeeds only once the branch is provisioned.
#   2. run migrations against the branch's DIRECT (unpooled) URL.
#   3. deploy the review Function to `preview/<head_ref>` (fire-and-forget,
#      --wait=false), then poll `functions get` for its invocation_url.
#   4. build the SPA with a vercel.json whose /api resolves to that Function host,
#      and deploy the Vercel preview (prebuilt). VITE_NEON_AUTH_URL is injected by
#      the integration into the preview env and picked up by the same pull — the
#      site talks to the auth origin directly, so there's no /auth rewrite.
#
# Secrets:  NEON_API_KEY, REVIEW_BUILD_SECRET, VERCEL_TOKEN
# Vars:     NEON_PROJECT_ID,
#           VERCEL_ORG_ID, VERCEL_PROJECT_ID, PREVIEW_DEPLOY_ENABLED

name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # One in-flight preview deploy per PR; a new push supersedes the previous.
  group: preview-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    # Only run when explicitly enabled at provisioning.
    if: vars.PREVIEW_DEPLOY_ENABLED == 'true'
    # Preview-scoped secrets/vars live in the `preview` environment (a preview
    # NEON_API_KEY). The Function's CORS origin is derived per-deploy from Vercel's
    # VERCEL_BRANCH_URL, not a static var. See runbook §3.
    environment: preview
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      # The integration names the preview branch after the PR's source branch.
      BRANCH_NAME: preview/${{ github.head_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Guard required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "::error::NEON_API_KEY / NEON_PROJECT_ID not set — provision Neon first (docs/deploy/runbook.md)."
            exit 1
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN not set — provision the Vercel project first (docs/deploy/runbook.md)."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Pull this preview's env for THIS git branch. The Neon↔Vercel integration
      # provisions the `preview/<head_ref>` Neon branch and injects its connection
      # strings (incl. DATABASE_URL_UNPOOLED) into the Vercel preview env scoped to
      # this git branch. This pull is our synchronization point: it also fetches
      # VITE_NEON_AUTH_URL for the later `vercel build`. Written to
      # .vercel/.env.preview.local.
      - name: Pull preview env (Neon branch connection + auth)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # github.head_ref is the PR source branch; the integration names its
          # Neon branch preview/<that>.
          GIT_BRANCH: ${{ github.head_ref }}
        run: |
          bunx vercel pull --yes --environment=preview \
            --git-branch="$GIT_BRANCH" --token="$VERCEL_TOKEN"
          bunx vercel env pull .vercel/.env.preview.local --yes \
            --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_TOKEN"
          if ! grep -q '^DATABASE_URL_UNPOOLED=' .vercel/.env.preview.local; then
            echo "::error::the Neon↔Vercel integration did not inject DATABASE_URL_UNPOOLED for this preview branch — confirm the integration is installed with branch creation ON (docs/deploy/runbook.md §1.5)."
            exit 1
          fi

      # Direct (unpooled) URL for migrations — the pooler doesn't support every
      # DDL path and migrate.mjs holds a single connection. The URL comes from the
      # integration-injected env pulled above.
      - name: Migrate the branch
        run: |
          set -a; . .vercel/.env.preview.local; set +a
          export DATABASE_URL="$DATABASE_URL_UNPOOLED"
          cd server && bun install --frozen-lockfile
          node scripts/migrate.mjs

      # Deploy the review Function to THIS branch (branch-scoped). DATABASE_URL is
      # injected by Neon per branch, so it is NOT passed here. The exact Neon
      # Functions CLI is finalized at provisioning (beta) — see runbook.
      - name: Deploy review Function to the branch
        env:
          REVIEW_BUILD_SECRET: ${{ secrets.REVIEW_BUILD_SECRET }}
        run: |
          # CORS allowlist for THIS preview: the browser reaches /api same-origin
          # (so CORS is inert on the happy path), but we still lock the raw Function
          # URL to this preview's origin as defense-in-depth. VERCEL_BRANCH_URL is
          # the stable per-branch preview host Vercel injects into the preview env;
          # it's in the file we pulled. If it's somehow absent we warn and leave
          # ALLOWED_ORIGIN empty (server falls back to permissive echo) rather than
          # guess a slugified/truncated host and lock out the real origin.
          set -a; . .vercel/.env.preview.local; set +a
          ORIGIN_HOST="${VERCEL_BRANCH_URL:-}"
          if [ -n "$ORIGIN_HOST" ]; then
            ALLOWED_ORIGIN="https://${ORIGIN_HOST#https://}"
          else
            echo "::warning::VERCEL_BRANCH_URL not in pulled env; ALLOWED_ORIGIN left unset (permissive CORS on the raw Function URL)."
            ALLOWED_ORIGIN=""
          fi
          echo "ALLOWED_ORIGIN=$ALLOWED_ORIGIN"

          # We MUST deploy explicitly on every push: neon.ts's preview.functions
          # is applied only by an explicit `neon deploy` — not on branch creation,
          # not on code changes — so new server/ code only ships if we deploy here.
          #
          # The beta neonctl (2.38.x) BLOCKS after triggering the deploy: it polls
          # "waiting for the deployment to start" and, even when the deployment has
          # already COMPLETED within seconds, hangs the full 10-min timeout and then
          # exits 1 with a false "Timed out" — verified against a deployment whose
          # get shows status=completed at the trigger second. --wait only governs
          # the *build* wait, not this start-poll, so it can't fix it. So we do NOT
          # depend on the deploy command's exit: run it detached, then drive off
          # `functions get`, which returns the completed deployment immediately.
          #
          # The Function host is NOT derivable from the git branch name — Neon forms
          # it as <branch_id>-<slug>.compute.<cell>.<region>.aws.neon.tech — so we
          # read invocation_url from `get`.
          setsid bunx neonctl functions deploy review \
            --project-id "$NEON_PROJECT_ID" --branch "$BRANCH_NAME" \
            --src server/src/handler.ts --wait=false \
            --env AUTH_MODE=neon --env NODE_ENV=production \
            --env ALLOWED_ORIGIN="$ALLOWED_ORIGIN" \
            --env BUILD_SECRET="$REVIEW_BUILD_SECRET" \
            >deploy.log 2>&1 &

          # Poll `get` until the deployment reaches a terminal state. 60 × 5s =
          # 300s budget (the build itself is ~seconds; this is generous headroom).
          INVOCATION_URL=""
          STATUS=""
          for _ in $(seq 1 60); do
            GET_JSON=$(bunx neonctl functions get review \
              --project-id "$NEON_PROJECT_ID" --branch "$BRANCH_NAME" --output json 2>/dev/null || echo '{}')
            STATUS=$(jq -r '.current_deployment.status // empty' <<<"$GET_JSON")
            if [ "$STATUS" = "completed" ]; then
              INVOCATION_URL=$(jq -r '.invocation_url // empty' <<<"$GET_JSON")
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "::error::the review Function deployment reported status=failed — see the Neon console (docs/deploy/runbook.md §4)."
              cat deploy.log || true
              exit 1
            fi
            sleep 5
          done
          if [ -z "$INVOCATION_URL" ]; then
            echo "::error::review Function did not reach status=completed after polling (last status: '${STATUS:-none}'); check the Neon console (docs/deploy/runbook.md §4)."
            cat deploy.log || true
            exit 1
          fi
          # gen-vercel-config.mjs strips the scheme too, but keep GITHUB_ENV clean.
          echo "NEON_FUNCTION_HOST=${INVOCATION_URL#https://}" >> "$GITHUB_ENV"

      # Generate vercel.json from the template with this branch's proxy targets,
      # build the SPA, and deploy the prebuilt output as a Vercel preview. Vercel
      # reads vercel.json BEFORE the build, so it must be generated pre-build and
      # deployed via the prebuilt path (see gen-vercel-config.mjs).
      # Generate vercel.json from the template with this branch's proxy target,
      # then build + deploy the prebuilt SPA. The preview env was already pulled
      # (git-branch-scoped) in an earlier step, so we don't re-pull here.
      - name: Build + deploy Vercel preview
        env:
          NEON_FUNCTION_HOST: ${{ env.NEON_FUNCTION_HOST }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          # Install deps + generate vercel.json in site/ (the generator resolves
          # its own paths, so CWD doesn't matter for it). But run the Vercel CLI
          # from the REPO ROOT: the Vercel project's Root Directory is set to
          # `site`, so the CLI scopes to site/ itself — running it from inside
          # site/ would double it to `site/site` and fail ("path … /site/site
          # does not exist").
          (cd site && bun install --frozen-lockfile)
          node site/scripts/gen-vercel-config.mjs
          bunx vercel build --token="$VERCEL_TOKEN"
          bunx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
