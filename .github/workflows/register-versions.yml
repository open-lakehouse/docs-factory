# MANUAL content-version registration for the review backend.
#
# The automatic post-merge registration runs as the `register` job INSIDE
# deploy-function.yml (needs: deploy), so it is guaranteed to run only AFTER the
# prod deploy has migrated the schema and swapped the Function — no cross-workflow
# race. This workflow is the manual/ad-hoc escape hatch (re-register without a
# redeploy); it is workflow_dispatch-only and shares the same steps.
#
# Why registration is post-deploy: the version manifest embeds `git rev-parse
# HEAD`. On a PR branch that is the branch tip, but `main` squash-merges, so the
# merged commit has a different sha the PR-time manifest never sees. Registering
# after merge stamps every content_version with the real, stable main sha — the
# git provenance the app correlates comments to. The manifest is intentionally
# NOT committed (generated at build time from blogs/ and content/; see
# `just version-manifest`).

name: Register content versions

on:
  workflow_dispatch: {}

concurrency:
  group: register-versions
  cancel-in-progress: false

permissions:
  contents: read
  # Mint a GitHub Actions OIDC token so register-versions.mjs can authenticate to
  # the review Function (repo + environment pinned server-side; no tracked secret).
  id-token: write

jobs:
  register:
    runs-on: ubuntu-latest
    # Targets prod (REVIEW_API_URL) → the `production` environment, whose main-only
    # branch restriction is the real gate. Running in this environment also stamps
    # the OIDC token's `environment: production` claim the Function pins on. See
    # runbook §3.
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      # Guard the API URL BEFORE the build, so a missing config fails fast rather
      # than after building the manifest (mirrors deploy-function.yml).
      - name: Guard required config
        env:
          API_URL: ${{ secrets.REVIEW_API_URL }}
        run: |
          if [ -z "${API_URL:-}" ]; then
            echo "::error::REVIEW_API_URL secret is not set — provision prod first (docs/deploy/runbook.md)."
            exit 1
          fi
      - name: Build version manifest (stamps the real main sha)
        run: |
          cd site && bun install --frozen-lockfile
          node scripts/build-version-manifest.mjs
      - name: Register versions with the review API
        env:
          API_URL: ${{ secrets.REVIEW_API_URL }}
        run: |
          cd server && bun install --frozen-lockfile
          bun run scripts/register-versions.mjs
