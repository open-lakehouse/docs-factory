name: Rust

on:
  push:
    branches: [main]
    paths:
      - "seed/rust/**"
      - "Cargo.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "seed/rust/**"
      - "Cargo.toml"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # rustup ships on the runner; dtolnay/rust-toolchain's `stable` branch is
      # rewritten, so SHA pins to it keep turning into zizmor impostor commits.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
