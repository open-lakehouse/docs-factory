name: Spark (optional)

# Heavy JVM job — kept off the default PR path. Runs on manual dispatch, when a PR
# carries the `ci:spark` label, or when Spark example files change.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "examples/spark/**"
      - ".github/workflows/spark.yml"

concurrency:
  group: spark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spark:
    # Only run on label or manual dispatch, not on every push to the paths above.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:spark')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - uses: ./.github/actions/pypi-public
      - run: uv sync --all-packages --extra spark
      - name: Run Spark examples
        run: uv run python examples/spark/read_delta_table.py
