# Rust workspace for docs-factory.
#
# Holds the Rust seed helper. (The former examples/rust crate — a stub for a
# future Unity Catalog Rust client — was removed with the examples/ tree; the
# Rust + TypeScript example/client machinery will be rebuilt deliberately later.
# See docs/design/build-pipeline.md.) This workspace is intentionally separate
# from the uv (Python) workspace — the two toolchains do not share dependencies.
[workspace]
resolver = "2"
members = [
    "seed/rust",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/docs-factory"
