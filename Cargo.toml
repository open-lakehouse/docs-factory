# Rust workspace for docs-factory.
#
# Holds the Rust seed helper and the snippets crate (content/_rust), which builds
# every Rust tutorial script as an example so their dependencies compile once.
# This workspace is intentionally separate from the uv (Python) workspace: the
# two toolchains do not share dependencies.
[workspace]
resolver = "2"
members = [
    "seed/rust",
    "content/_rust",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/docs-factory"
