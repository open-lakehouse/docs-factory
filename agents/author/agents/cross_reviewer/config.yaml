spec_version: 1
name: cross_reviewer
description: >-
  Review phase, second model: an independent non-Claude read of a blog's
  sources, audience fit, and argument, or a docs page's facts and reader
  altitude, against its rubric and the plan. Read-only.

# A different vendor than the writer is the point: it catches what a
# same-family reviewer shares blind spots on. The codex harness (not
# openai-agents) has no fallback that silently routes an unpinned model
# through Databricks.
executor:
  type: omnigent
  config:
    harness: codex

instructions: prompt.md

skills: none

# On codex this passes through to OpenAI's native web search; no provider key.
tools:
  builtins:
    - web_search

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    read_only:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call"
            && event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"]
            ? {"result": "DENY", "reason": "cross_reviewer is read-only; report the finding instead."}
            : {"result": "ALLOW"}
