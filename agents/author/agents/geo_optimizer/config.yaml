spec_version: 1
name: geo_optimizer
description: >-
  GEO phase: applies citability edits to blogs/<slug>/index.md aimed at the
  plan's reader questions and the answer-probe gaps, bounded by the author's
  voice, and writes blogs/<slug>/geo.md.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

# Only the bundled geo skill (skills/geo); bundled skills load regardless of
# this filter.
skills: none

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

tools:
  builtins:
    # For checking a source before quoting it; the probe already did the
    # answer-engine search.
    - web_fetch

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    writes_under_blogs:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type != "tool_call"
            || !(event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"])
            ? {"result": "ALLOW"}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)blogs/")
            ? {"result": "ALLOW"}
            : {"result": "DENY", "reason": "geo_optimizer may only write under blogs/."}
