spec_version: 1
name: reviser
description: >-
  Revise phase: works the open review-app threads on one blog post or docs
  page through the review-feedback MCP, edits it, opens a PR, and replies on
  each thread.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

skills: [authoring-prime, review-feedback, docs-write, docs-query, humanizer]

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

tools:
  # Same launcher as .mcp.json; the token comes from the CLI's own
  # XDG config, not the environment.
  review-feedback:
    type: mcp
    command: bash
    args: [tools/review-feedback/scripts/mcp.sh]
    # Requests are read so a page that answers one can say so; completing it
    # needs a requests:write token and happens only after the PR exists.
    tools:
      - list_feedback
      - get_thread
      - reply_to_thread
      - review_status
      - list_content_requests
      - complete_content_request

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    # blogs/ and content/ for the content, architecture/model/views/ for its
    # LikeC4 diagrams. compatibility.json is regenerated by `docsnip compat
    # --fix` through the shell, never written by hand.
    writes_under_content:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type != "tool_call"
            || !(event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"])
            ? {"result": "ALLOW"}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)content/[^/]+/compatibility[.]json$")
            ? {"result": "DENY", "reason": "compatibility.json is generated; run `uv run docsnip compat --fix`."}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)(blogs|content|architecture/model/views)/")
            ? {"result": "ALLOW"}
            : {"result": "DENY", "reason": "reviser may only write under blogs/, content/, or architecture/model/views/."}
