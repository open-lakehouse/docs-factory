spec_version: 1
name: writer
description: >-
  Write phase: grows a blog outline into a full draft, or writes a docs page
  from its placement plan, with colocated, tested snippets; also runs the
  revise pass on review findings.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

skills: [authoring-prime, blog-post, docs-write, docs-query, humanizer]

# Network stays on for `uv run` resolving snippet dependencies; there is no
# search tool, because sources come from the plan.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    # blogs/ and content/ for the content, architecture/model/views/ for its
    # LikeC4 diagrams. compatibility.json is regenerated by `docsnip compat
    # --fix` through the shell, never written by hand.
    writes_under_content:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type != "tool_call"
            || !(event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"])
            ? {"result": "ALLOW"}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)content/[^/]+/compatibility[.]json$")
            ? {"result": "DENY", "reason": "compatibility.json is generated; run `uv run docsnip compat --fix`."}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)(blogs|content|architecture/model/views)/")
            ? {"result": "ALLOW"}
            : {"result": "DENY", "reason": "writer may only write under blogs/, content/, or architecture/model/views/."}
