spec_version: 1
name: author
description: >-
  Writes blog posts and docs pages. A blog starts from an author's dump
  (thoughts, a rough structure, references) and becomes a review-ready draft
  in blogs/<slug>/index.md. A docs page starts from a page, a planned nav
  slot, a content request, or a model element, and becomes a tested page
  under content/. Runs plan, write, review, GEO (blogs only), and revise
  phases through scoped sub-agents and stops at human gates.

# No model is pinned: claude-sdk resolves the configured provider's default
# Claude model. A pinned brain also pins the family its workers route within,
# which would strand the codex-harness sub-agents.
executor:
  type: omnigent
  config:
    harness: claude-sdk
    smart_routing_harness: auto

instructions: prompt.md

# Phase skills belong to the sub-agents that run them; the orchestrator only
# sequences.
skills: none

async: true
cancellable: true

# cwd must be the repo root: host skills are discovered from ancestor
# .claude/skills dirs of the cwd, and every repo path in the prompts is
# root-relative.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

tools:
  agents:
    - planner
    - writer
    - reviewer
    - cross_reviewer
    - answer_probe
    - geo_optimizer
    - reviser

guardrails:
  # An ASK on push should outlive the author stepping away.
  ask_timeout: 86400
  policies:
    # The orchestrator commits and opens the PR; pushes and `gh pr create`
    # ASK, so the author sees the outward step.
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    spawn_bounds:
      type: function
      function:
        path: omnigent.inner.nessie.policies.spawn_bounds
        arguments:
          max_dispatches_per_turn: 3
          dispatch_tools: [sys_session_send]
    # Prose is the sub-agents' job: the orchestrator may read and run git,
    # never write files.
    no_prose_writes:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call"
            && event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"]
            ? {"result": "DENY", "reason": "author only orchestrates; dispatch a sub-agent to edit files."}
            : {"result": "ALLOW"}
