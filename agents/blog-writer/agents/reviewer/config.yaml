spec_version: 1
name: reviewer
description: >-
  Review phase: runs the blog-review skill (six scored facets) over a draft,
  or a facet (b) voice-only check on a GEO diff. Read-only.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

skills: [blog-review, humanizer]

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    # Findings are the deliverable; the writer applies them.
    read_only:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call"
            && event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"]
            ? {"result": "DENY", "reason": "reviewer is read-only; report the finding instead."}
            : {"result": "ALLOW"}
