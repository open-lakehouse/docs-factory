spec_version: 1
name: reviser
description: >-
  Revise phase: works a post's open review-app threads through the
  review-feedback MCP, edits the post, opens a PR, and replies on each
  thread.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

skills: [review-feedback, humanizer]

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

tools:
  # Same launcher as .mcp.json; the token comes from the CLI's own
  # XDG config, not the environment.
  review-feedback:
    type: mcp
    command: bash
    args: [tools/review-feedback/scripts/mcp.sh]
    # Content requests become docs nav slots, which aren't a blog's concern.
    tools: [list_feedback, get_thread, reply_to_thread, review_status]

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    writes_under_blogs:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type != "tool_call"
            || !(event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"])
            ? {"result": "ALLOW"}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)(blogs|architecture/model/views)/")
            ? {"result": "ALLOW"}
            : {"result": "DENY", "reason": "reviser may only write under blogs/ or architecture/model/views/."}
