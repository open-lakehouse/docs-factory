spec_version: 1
name: writer
description: >-
  Write phase: grows the outline in blogs/<slug>/index.md into a full draft
  with colocated, verified snippets; also runs the revise pass on review
  findings.

executor:
  type: omnigent
  config:
    harness: claude-sdk

instructions: prompt.md

skills: [blog-post, humanizer]

# Network stays on for `uv run` resolving snippet dependencies; there is no
# search tool, because sources come from the plan.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    # blogs/ for the post, architecture/model/views/ for its LikeC4 diagrams.
    writes_under_blogs:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type != "tool_call"
            || !(event.data.name in ["sys_os_write", "sys_os_edit", "Write", "Edit", "MultiEdit", "NotebookEdit"])
            ? {"result": "ALLOW"}
            : (has(event.data.arguments.path) ? event.data.arguments.path
               : has(event.data.arguments.file_path) ? event.data.arguments.file_path
               : "").matches("(^|/)(blogs|architecture/model/views)/")
            ? {"result": "ALLOW"}
            : {"result": "DENY", "reason": "writer may only write under blogs/ or architecture/model/views/."}
