# Databricks Asset Bundle for docs-factory-app.
#
# `databricks bundle deploy` uploads the source + binary to the workspace and
# registers an app. The bundle name doubles as the asset prefix in the workspace,
# so keep it stable across deploys.
bundle:
  name: docs_factory_app

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.databricks_host}

  prod:
    mode: production
    workspace:
      host: ${var.databricks_host}

variables:
  databricks_host:
    description: "Workspace URL"

resources:
  apps:
    docs_factory_app:
      name: docs-factory-app
      description: "docs-factory-app (scaffolded by trestle)"
      source_code_path: ./