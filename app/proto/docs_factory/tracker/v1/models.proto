// Domain model for the DevRel release tracker.
//
// Proto is the source of truth: the `google.api.resource` /
// `google.api.field_behavior` annotations drive trestle's codegen — the
// `ObjectLabel`/`Resource` enums, `RESOURCE_DESCRIPTORS`, REST routes, and the
// typed clients. See the `trestle-codegen` skill in the trestle repo.
//
// Release tracking is a graph. Resources are OLI-store nodes; relationships are
// modeled as runtime associations (see crates/common/src/models/association.rs),
// not embedded fields — e.g. a release DependsOn another release, References an
// artifact, and a task is ChildOf its parent task.
syntax = "proto3";

package docs_factory.tracker.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

// A top-level open-source or internal project (e.g. Unity Catalog, Spark).
// Releases, repositories, and websites hang off a project via associations.
message Project {
  option (google.api.resource) = {
    type: "docs-factory.io/Project"
    pattern: "projects/{project}"
    plural: "projects"
    singular: "project"
  };

  // Server-assigned. Format: `projects/{uuid}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-facing name, e.g. "Unity Catalog".
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Short description of the project.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp created_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A code repository associated with a project or release.
message Repository {
  option (google.api.resource) = {
    type: "docs-factory.io/Repository"
    pattern: "repositories/{repository}"
    plural: "repositories"
    singular: "repository"
  };

  // Server-assigned. Format: `repositories/{uuid}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-facing name, e.g. "delta-io/delta".
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Clone/browse URL, e.g. "https://github.com/delta-io/delta".
  string url = 3 [(google.api.field_behavior) = REQUIRED];

  // Host, e.g. "github.com".
  string host = 4 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp created_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A related website or docs site (e.g. delta.io, unitycatalog.io).
message Website {
  option (google.api.resource) = {
    type: "docs-factory.io/Website"
    pattern: "websites/{website}"
    plural: "websites"
    singular: "website"
  };

  // Server-assigned. Format: `websites/{uuid}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-facing name, e.g. "Delta Lake".
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Site URL, e.g. "https://delta.io".
  string url = 3 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.Timestamp created_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A tracked release. The core resource.
//
// Timing supports vague early targets that sharpen over time: a date *window*
// (`target_earliest`..`target_latest`) plus a graded `confidence`. A very-early
// target ("end of July → Q3") is a wide window at low confidence; as planning
// firms up the window narrows and confidence rises. `actual_date` is stamped
// when the release ships.
message Release {
  option (google.api.resource) = {
    type: "docs-factory.io/Release"
    pattern: "releases/{release}"
    plural: "releases"
    singular: "release"
  };

  // Server-assigned. Format: `releases/{uuid}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-facing name, e.g. "Unity Catalog 1.0".
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Version string, e.g. "4.0.0". May be unknown for early-stage releases.
  string version = 3 [(google.api.field_behavior) = OPTIONAL];

  // Earliest the release is expected. Optional when only a quarter is known.
  google.protobuf.Timestamp target_earliest = 4 [(google.api.field_behavior) = OPTIONAL];

  // Latest the release is expected. With `target_earliest`, forms the window.
  google.protobuf.Timestamp target_latest = 5 [(google.api.field_behavior) = OPTIONAL];

  // Graded certainty of the target window.
  ReleaseConfidence confidence = 6 [(google.api.field_behavior) = OPTIONAL];

  // Lifecycle state. Server-owned; set/transitioned by the handler.
  ReleaseStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the release actually shipped. Set by the handler on ship.
  google.protobuf.Timestamp actual_date = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp created_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Graded certainty of a release target; sharpens as a target approaches.
enum ReleaseConfidence {
  RELEASE_CONFIDENCE_UNSPECIFIED = 0;
  SPECULATIVE = 1; // "sometime in Q3" — wide window, low certainty
  ESTIMATED = 2;   // planning underway, narrowing window
  SCHEDULED = 3;   // committed date/window
  CONFIRMED = 4;   // locked, imminent
}

// Release lifecycle, owned by the server.
enum ReleaseStatus {
  RELEASE_STATUS_UNSPECIFIED = 0;
  PLANNED = 1;
  IN_PROGRESS = 2;
  SHIPPED = 3;
  CANCELLED = 4;
}

// A linked artifact (blog post, slides, sheet, RFC, ...). First-class so one
// artifact can be referenced by many releases/projects via associations.
//
// `type` is a flat, queryable label; `kind` carries the typed per-type metadata
// (a buffa oneof generates `artifact::Kind { BlogPost(..), Slides(..), .. }`).
// Keep both: the enum is cheap to filter on, the oneof is the typed contract.
message Artifact {
  option (google.api.resource) = {
    type: "docs-factory.io/Artifact"
    pattern: "artifacts/{artifact}"
    plural: "artifacts"
    singular: "artifact"
  };

  // Server-assigned. Format: `artifacts/{uuid}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-facing title.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Flat, queryable kind label.
  ArtifactType type = 3 [(google.api.field_behavior) = OPTIONAL];

  // Canonical/primary URL for the artifact.
  string url = 4 [(google.api.field_behavior) = OPTIONAL];

  // Typed per-kind metadata. Field numbers 10+ reserved for the oneof so adding
  // variants stays additive.
  oneof kind {
    BlogPostMeta blog_post = 10;
    PresentationMeta presentation = 11;
    SheetMeta sheet = 12;
    RfcMeta rfc = 13;
  }

  google.protobuf.Timestamp created_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Flat artifact-kind label. Proto enum = the API contract; generated to a Rust
// enum. Additive: append new variants without breaking the wire format.
enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  BLOG_POST = 1;
  PRESENTATION = 2;
  SLIDES = 3;
  SHEET = 4;
  DOC = 5;
  RFC = 6;
  RELEASE_NOTES = 7;
  VIDEO = 8;
  OTHER = 99;
}

// Per-kind metadata payloads for Artifact.kind.
message BlogPostMeta {
  string canonical_site = 1;
  string author = 2;
}

message PresentationMeta {
  string deck_url = 1;
  int32 slide_count = 2;
}

message SheetMeta {
  string spreadsheet_id = 1;
  string tab = 2;
}

message RfcMeta {
  string doc_url = 1;
  string status = 2;
}

// A unit of work. Hierarchically nestable via associations (a task is ChildOf
// its parent task → arbitrary-depth subtasks). Carries a typed reference to an
// external work system. A "checklist" is just a task with subtasks.
message Task {
  option (google.api.resource) = {
    type: "docs-factory.io/Task"
    pattern: "tasks/{task}"
    plural: "tasks"
    singular: "task"
  };

  // Server-assigned. Format: `tasks/{uuid}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-facing title.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // Whether the task is complete.
  bool done = 3 [(google.api.field_behavior) = OPTIONAL];

  // Flat, queryable external-system label.
  ExternalSystem ref_system = 4 [(google.api.field_behavior) = OPTIONAL];

  // Link to the external work item, e.g. a GitHub issue URL.
  string ref_url = 5 [(google.api.field_behavior) = OPTIONAL];

  // Cached status from the external system, e.g. "OPEN"/"CLOSED". Not synced yet.
  string ref_status = 6 [(google.api.field_behavior) = OPTIONAL];

  // Typed per-system reference metadata. Field numbers 10+ reserved for the
  // oneof so adding systems stays additive.
  oneof ref {
    GithubIssueRef github_issue = 10;
    JiraTicketRef jira_ticket = 11;
  }

  google.protobuf.Timestamp created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Flat external-system label.
enum ExternalSystem {
  EXTERNAL_SYSTEM_UNSPECIFIED = 0;
  GITHUB_ISSUE = 1;
  GITHUB_PR = 2;
  JIRA = 3;
  LINEAR = 4;
  OTHER_SYSTEM = 99;
}

// Per-system reference payloads for Task.ref.
message GithubIssueRef {
  string repo = 1; // e.g. "delta-io/delta"
  int32 number = 2;
}

message JiraTicketRef {
  string project = 1; // e.g. "UC"
  string key = 2;     // e.g. "UC-1234"
}
