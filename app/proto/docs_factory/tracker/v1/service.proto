// RPC surface for the DevRel release tracker.
//
// `google.api.http` annotations declare the REST mapping trestle's codegen turns
// into Axum routes + typed clients. Routes are FLAT (Unity Catalog style): every
// resource has its own top-level collection (`/v1/releases`, `/v1/projects`, …).
// Relationships live in the graph and are managed through AssociationService.
syntax = "proto3";

package docs_factory.tracker.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "docs_factory/tracker/v1/models.proto";

// ---------------------------------------------------------------------------
// Projects
// ---------------------------------------------------------------------------
service ProjectService {
  option (google.api.default_host) = "localhost:8080";

  rpc CreateProject(CreateProjectRequest) returns (Project) {
    option (google.api.http) = {
      post: "/v1/projects"
      body: "project"
    };
  }
  rpc GetProject(GetProjectRequest) returns (Project) {
    option (google.api.http) = {get: "/v1/{name=projects/*}"};
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/v1/projects"};
  }
  rpc UpdateProject(UpdateProjectRequest) returns (Project) {
    option (google.api.http) = {
      patch: "/v1/{project.name=projects/*}"
      body: "project"
    };
  }
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (google.api.http) = {delete: "/v1/{name=projects/*}"};
  }
}

message CreateProjectRequest {
  Project project = 1 [(google.api.field_behavior) = REQUIRED];
}
message GetProjectRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
message ListProjectsRequest {
  optional int32 max_results = 1 [(google.api.field_behavior) = OPTIONAL];
  optional string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}
message ListProjectsResponse {
  repeated Project projects = 1;
  optional string next_page_token = 2;
}
message UpdateProjectRequest {
  Project project = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteProjectRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteProjectResponse {}

