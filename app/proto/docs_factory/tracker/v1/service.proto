// ---------------------------------------------------------------------------
// Associations — the graph edges that make this a tracker, not a list.
// ---------------------------------------------------------------------------
//
// `from`/`to` are resource names (e.g. "releases/{uuid}"). `label` is an
// AssociationLabel value (e.g. "depends_on", "references", "child_of"). The
// handler resolves names to object ids and maintains the inverse edge.
service AssociationService {
  option (google.api.default_host) = "localhost:8080";

  rpc AddAssociation(AddAssociationRequest) returns (AddAssociationResponse) {
    option (google.api.http) = {
      post: "/v1/associations"
      body: "*"
    };
  }
  rpc RemoveAssociation(RemoveAssociationRequest) returns (RemoveAssociationResponse) {
    option (google.api.http) = {
      post: "/v1/associations:remove"
      body: "*"
    };
  }
  rpc ListAssociations(ListAssociationsRequest) returns (ListAssociationsResponse) {
    option (google.api.http) = {get: "/v1/associations"};
  }
}

// A directed edge between two resources.
message Association {
  string from = 1;
  string label = 2;
  string to = 3;
}

message AddAssociationRequest {
  string from = 1 [(google.api.field_behavior) = REQUIRED];
  string to = 2 [(google.api.field_behavior) = REQUIRED];
  string label = 3 [(google.api.field_behavior) = REQUIRED];
}
message AddAssociationResponse {}

message RemoveAssociationRequest {
  string from = 1 [(google.api.field_behavior) = REQUIRED];
  string to = 2 [(google.api.field_behavior) = REQUIRED];
  string label = 3 [(google.api.field_behavior) = REQUIRED];
}
message RemoveAssociationResponse {}

message ListAssociationsRequest {
  // Source resource name, e.g. "releases/{uuid}".
  string from = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional edge-label filter, e.g. "depends_on".
  optional string label = 2 [(google.api.field_behavior) = OPTIONAL];
  optional int32 max_results = 3 [(google.api.field_behavior) = OPTIONAL];
  optional string page_token = 4 [(google.api.field_behavior) = OPTIONAL];
}
message ListAssociationsResponse {
  repeated Association associations = 1;
  optional string next_page_token = 2;
}
