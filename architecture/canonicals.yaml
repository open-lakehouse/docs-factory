# Canonical registry for the LAYERED model.
#
# Maps logical capabilities, concerns, and asset kinds to their design doc, and each
# concrete deployment service to the repo that provides it. The maintenance skill
# and human readers use this to navigate model <-> prose <-> source. Keep in sync
# with `metadata.canonicalDoc` on logical elements and `metadata.sourceRepo` on
# deployment nodes. Ref-free: repo pointers are names, never SHAs/tags.

model: architecture/model            # the LikeC4 source of truth (layered)
export: architecture/dist/model.json # generated JSON projection (agents/site)
estate: architecture/estate.yml      # ref-free repo facts (purpose, deps, patterns)

# --- Logical layer: abstract capabilities ---------------------------------
capabilities:
  lakehouse:
    element: lakehouse
    doc: design/reference-architecture.md
  catalog:
    element: lakehouse.catalog
    doc: design/catalog-plane.md
  queryEngine:
    element: lakehouse.queryEngine
    doc: design/reference-architecture.md
  orchestration:
    element: lakehouse.orchestration
    doc: design/reference-architecture.md
    note: Schedules jobs/pipelines that run on the query engine.
  tableFormat:
    element: lakehouse.tableFormat
    doc: design/reference-architecture.md
    note: Delta & Iceberg are peer specifications of this (see ADR-0004).
  fileFormat:
    element: lakehouse.fileFormat
    doc: design/reference-architecture.md
    note: Parquet/ORC/Avro are peer specifications; sits beneath tableFormat.
  objectStorage:
    element: lakehouse.objectStorage
    doc: design/reference-architecture.md
    note: The S3 API specifies it; buckets are deployment datastores (ADR-0004).
  modelTracking:
    element: lakehouse.modelTracking
    doc: design/reference-architecture.md
    note: Renamed from mlLifecycle (ADR-0004); realized by MLflow.
  sharing:
    element: lakehouse.sharing
    doc: design/reference-architecture.md
    note: Specified by Open Sharing (Delta Sharing protocol); agent skills require it (ADR-0005).

# --- Logical layer: cross-cutting concerns (ADR-0007) ---------------------
# What each one appliesTo is in model/logical/concerns.likec4.
concerns:
  governance:
    element: lakehouse.governance
    doc: design/governance.md
  authentication:
    element: lakehouse.governance.authentication
    doc: design/governance.md
  authorization:
    element: lakehouse.governance.authorization
    doc: design/governance.md
  fineGrainedAccess:
    element: lakehouse.governance.fineGrainedAccess
    doc: design/governance.md
    note: Row filters + column masks; needs a trusted engine to enforce (ADR-0007).
  lineage:
    element: lakehouse.lineage
    doc: design/lineage-plane.md
  observability:
    element: lakehouse.observability
    doc: design/reference-architecture.md

# --- Logical layer: governed asset kinds (securables) ---------------------
# The subject axis (ADR-0005). "securable" is UC's term; `asset` is neutral.
asset_kinds:
  schema:     { element: lakehouse.namespace,             doc: design/asset-kinds.md }
  table:      { element: lakehouse.table,              doc: design/asset-kinds.md }
  volume:     { element: lakehouse.volume,             doc: design/asset-kinds.md }
  function:   { element: lakehouse.registeredFunction, doc: design/asset-kinds.md }
  model:      { element: lakehouse.mlModel,            doc: design/asset-kinds.md }
  agentSkill: { element: lakehouse.agentSkill,         doc: design/asset-kinds.md, note: "governed by catalog; dependsOn the sharing capability (Open Sharing) for distribution — built today." }
  view:       { element: lakehouse.sqlView,            doc: design/asset-kinds.md, note: "`view` is a LikeC4 keyword." }
  metricView: { element: lakehouse.metricView,         doc: design/asset-kinds.md }
  credential: { element: lakehouse.credential,         doc: design/asset-kinds.md }
  externalLocation: { element: lakehouse.externalLocation, doc: design/asset-kinds.md }

# --- Concrete layer: deployment services -> source repos ------------------
# (What each realizes is in model/deployment/deployments.likec4 via instanceOf.
# The zero-trust points they play are prose in design/governance.md.)
services:
  trestle:
    source_repo: open-lakehouse/trestle
    doc: design/generator.md
    role: The generator; its stack-topology crate generates the Envoy gateway + Compose deployment.
  mangrove:
    source_repo: open-lakehouse/mangrove   # project: unitycatalog-rs
    doc: design/catalog-plane.md
    realizes: [catalog]
  headwaters:
    source_repo: open-lakehouse/headwaters
    doc: design/lineage-plane.md
    realizes: [lineage]
  hydrofoil:
    source_repo: open-lakehouse/hydrofoil
    doc: design/integration-hub.md
    realizes: [queryEngine]   # embeds breakwater (decide/enforce) as a library

# --- Deployment environments ----------------------------------------------
deployments:
  trustedCompute: { doc: design/deployments.md, trust: trusted, note: "the reference deployment; full FGAC in-plan" }

# --- Cross-cutting prose --------------------------------------------------
other:
  patterns:  { doc: design/patterns.md, note: composition / agentic-cli / composable-ui }
  overview:  { doc: design/overview.md, note: layered-model entry point }
