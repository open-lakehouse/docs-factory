# Open Lakehouse estate — facts of record (ref-free).
#
# Structured facts: repos, foundations, dependency edges, cross-estate patterns.
# Glossary: architecture/glossary.md. Open questions: architecture/conflicts.md.
# Narrative framing: blogs/STORYLINE.md. Blog arc: blogs/SERIES.md.
#
# One entry per repo in the `olai` estate, with coarse, slow-moving fields only.
# REF-FREE BY RULE. This file carries names, purposes, dependency edges, and
# orientation paths only — never a commit SHA or release tag. It is a
# lead-generator, never cited directly in a published post. Briefs lift a fact
# from here, then pin it to a SHA/tag and re-verify per blogs/CONVENTIONS.md §6
# at draft time. Pinning refs here would rot instantly across five evolving repos.
#
# Keep it coarse: capture which repos exist, who depends on whom, each repo's
# purpose and story role, and the *pattern* of what it publishes (e.g. "olai-uc-*
# crates") — NOT a maintained roster of every crate/version. Enumerate an
# individual artifact only where its name is load-bearing to the story.
#
# The structural record — every workspace member and each cross-repo edge, from
# the manifests — is the codebase C4 model in architecture/codebase/ (ADR-0010).
# When the two disagree, the codebase model wins; fix this file to match.

initiative: open-lakehouse (olai — "open lakehouse and ai")
org: github.com/open-lakehouse
license: Apache-2.0

# Crate naming (applies to all olai-* / olai-uc-* below). The `olai-*` prefix is a
# DEFENSIVE PUBLISH-TIME SHELL, not the code's identity: via Cargo `package =`
# aliases the call sites use the aspirational, eventual-official identifiers (e.g.
# `unitycatalog-common` -> `use unitycatalog_common::…`) while the crate is published
# as `olai-uc-common`. This avoids polluting official/community namespaces before
# consensus while the codebase already reads as the eventual official crates. Only the
# published *prefix* is provisional. Prose uses role-descriptive names; literal crate
# names (either form) appear only in code blocks. (Resolved 2026-07-13; see
# conflicts.md and glossary.md.)

# The external OSS the estate assembles on. The through-line is "assemble these +
# build the gaps"; these are the foundations, the olai repos are the gaps we fill.
foundations:
  - datafusion       # query engine (Apache DataFusion) — the shared compute core
  - delta            # Delta Lake table format (via delta-rs / delta-kernel-rs; some forks)
  - cedar            # AWS Cedar policy language — the FGAC decision engine
  - openlineage      # lineage event standard (Marquez is the reference server we're inspired by)
  - unity-catalog    # Unity Catalog API surface — mangrove builds/integrates with it (not reimplements)

# Cross-estate architectural patterns — opinionated seams that recur across repos.
# The estate is organized by repo below, but its *identity* is these shared
# patterns: each repo is an APPLICATION of them, and hydrofoil is where several
# get composed into one experience. Repos reference these by key in
# `applies_patterns`. Frame them as established-and-converging (real today, still
# settling), not as a finished standard.
patterns:

  composition:
    intent: >-
      Compose independently-built pieces into one consolidated whole rather than
      building monoliths. The recurring shape of the estate: services, DataFusion
      integrations, and UIs are each assembled, not fused.
    seam: >-
      Narrow, object-safe port traits behind `Arc<dyn Trait>` boundaries so a
      piece can be swapped or reused (Trestle's runtime and tooling crates are
      built this way, each port with adapters and a fake), plus a Provides*
      compile-time DI pattern that wires a server's ports (mangrove's server and
      store crates).
    applied_by: [trestle, mangrove, headwaters, hydrofoil]
    status: established; the estate's core design stance
    notes: >-
      Hydrofoil is the exemplar — it composes services and multiple DataFusion
      integrations into a single consolidated session.

  agentic-cli:
    intent: >-
      Ship CLIs in two registers: the classical one that mirrors the API endpoints,
      AND an AGENT-OPTIMIZED one that formats output for agent digestion and reframes
      the surface as actionable, task-shaped verbs — so the lakehouse is genuinely
      usable BY AI, not just about it. This is where "open lakehouse AND AI" is real
      effort, not a slogan.
    seam: >-
      A multi-mode render (table / json / agent), an interpreted `agent` envelope
      that prunes noise and appends `_next` follow-up hints, a `schema` capabilities
      primer, task-shaped "question-verbs" (return the answer, not an endpoint dump),
      structured JSON errors + stable exit codes. Follows Anthropic / agent-tooling
      best practices for tool design.
    applied_by: [headwaters]           # hw is the lead, built-out application
    aspiring: [mangrove, hydrofoil]    # uc/uc-server + others still mostly classical
    status: emerging — hw (headwaters) is the strongest application today (ADR-0014,
      docs/agent-cli-design.md); other CLIs still mostly endpoint-mirroring
    notes: >-
      Downstream: pairs naturally with an agent harness (e.g. Databricks Omnigent) —
      see the parked blog idea in blogs/IDEAS.md. Ties to headwaters' agent-facing
      question-verbs already in the ideas backlog.

  composable-ui:
    intent: >-
      Build reusable, ideally HEADLESS UI apps/components with pluggable seams for
      functionality, then wrap a thin per-service app around them — the UI analogue
      of service composition. The aim is that the same components compose into ONE
      consolidated experience (in hydrofoil), just as services compose into a session.
    seam: >-
      shadcn (agentic-optimized) components distributed by copy; headless
      presentational components + versioned data-fetching logic behind a design-token
      contract, so one component set serves several apps unchanged. The contract is
      written as a `design.md` per the official convention
      (github.com/google-labs-code/design.md) — a machine-readable file that fixes
      semantic token names/meanings (not a concrete look), teaching agents how to use
      the components and informing the design decisions when apps are built from them.
    applied_by: [mangrove, headwaters, hydrofoil]
    status: established & converging — followed in headwaters + mangrove today;
      hydrofoil's consolidated experience is the direction of travel
    notes: >-
      See mangrove node/ui-kit/DESIGN.md and hydrofoil node/ui/DESIGN.md (both follow
      the design.md convention), headwaters node/lineage-ui, and hydrofoil
      docs/portable-uc-components.md. This is the estate's opinionated UI stance, the
      counterpart to the composition pattern above; the design.md files are a small
      extra agentic proof point (a contract agents can read), not a headline.

# Dependency spine (from manifests; detail in architecture/codebase/):
#   trestle -> {mangrove, distributary, headwaters (olai-http only), hydrofoil, luminescent}
#   mangrove -> {distributary, hydrofoil};  breakwater -> hydrofoil
#   luminescent-lakehouse deploys headwaters, mangrove, and distributary.
#   tributary stands alone.
repos:

  trestle:
    purpose: >-
      Proto -> Rust codegen framework plus runtime libraries; `trestle new`
      scaffolds a full data-platform service tree from annotated protobuf.
    public: true
    depends_on: []          # the root of the spine; depends on no sibling
    publishes:
      # olai-* framework crates in three stages, + the CLI. Load-bearing names
      # called out; the roster is in architecture/codebase/repos/trestle.likec4.
      - olai-codegen         # BUILD TIME: proto -> axum handlers, clients, bindings, registry
      - olai-store / olai-http / olai-http-wasm / olai-auth   # RUNTIME: store, transport, auth
      - olai-credential-vending / olai-vended-store / olai-storage-credentials   # RUNTIME: vended storage credentials
      - olai-stack-topology / olai-stack-runtime / olai-stack-state   # TOOLING: plan, run, and record environments
      - olai-trestle (CLI)   # the `trestle` binary: new, generate, env, ws, up
      - "@open-lakehouse/* UI packages"   # env-editor, host, ui-kit, stack-wasm, trestle-diagram (GitHub release tarballs)
    key_paths:               # orientation only — where to look, not pinned refs
      - docs/architecture.md
      - crates/olai-codegen/docs/codegen-design.md
      - crates/stack-topology/src/catalog/   # the module catalog and roles
      - crates/trestle/templates/            # `trestle new` scaffolds
    applies_patterns: [composition]   # ports-and-adapters throughout its runtime and tooling crates
    story_role: >-
      The generator. Everything downstream is built with it; it is how we build
      services fast enough to explore the estate — and where the estate's
      opinionated composition patterns are established.

  mangrove:                  # project name: unitycatalog-rs; Docker image: mangrove
    purpose: >-
      A pluggable framework for BUILDING Unity Catalog APIs and INTEGRATING with
      UC — NOT a competing reimplementation of Unity Catalog OSS. It uses generic
      resource APIs + Trestle codegen to stand up UC surfaces fast and explore
      functionality ahead of the official Java UC OSS; it can PROXY to an upstream
      OSS Java UC for supported securables while managing others itself; and it
      can AUGMENT surfaces UC doesn't cover yet. Scope also spans Delta Sharing /
      Open Sharing servers and the Delta API (the Delta API also feeds Lakekeeper).
    public: true
    depends_on: [trestle]
    publishes:
      - olai-uc-* crates      # common / client / handlers / delta-api / datafusion / object-store / storage-access / postgres / sqlite / sharing / files-proto / server / cli
      - files-api, storage-proxy (bins)   # volume files over ConnectRPC; same-origin storage proxy
      - unitycatalog-client (PyPI), "@open-lakehouse/unity-catalog-node", "@open-lakehouse/unity-catalog-client" (npm)
      - uc (CLI)              # command-line client for a running server
      - uc-server (bin)       # the deployable UC service
      - mangrove (Docker image)
    key_paths:
      - crates/delta-api/         # the UC Delta v1 REST API (also -> Lakekeeper)
      - crates/datafusion/        # UC-backed DataFusion catalog provider — a piece we want to MATURE
      - wasm/query-wasm/          # in-browser query engine (separate wasm workspace)
      - node/ARCHITECTURE.md      # the UI packages
      - trestle.yaml              # `trestle generate` config for the committed models + client
    trade_off: >-
      Moves faster but makes FEWER guarantees than UC OSS — this is deliberate and
      must be stated wherever mangrove is positioned. The DataFusion integration
      (and similar) are the parts we do intend to harden.
    maturing: >-
      Explicitly want to MATURE the DataFusion ecosystem-integration / client piece
      against UC for the Rust ecosystem — a first-class, keep-it goal distinct from
      the move-fast exploratory surface.
    applies_patterns: [composition, composable-ui]
    story_role: >-
      The catalog / governance plane — the exploratory, proxy-capable UC surface
      that lets the estate move ahead of, and integrate with, upstream UC; also a
      home of the composable-UI pattern (its reusable UC components).

  headwaters:
    purpose: >-
      OpenLineage for the Rust data ecosystem: ingests OpenLineage events into a
      Postgres-backed lineage store and serves a Marquez-compatible read API (a
      Rust-native take inspired by, not a drop-in for, Marquez). Emitting lineage
      from DataFusion plans is the upstream datafusion-contrib/datafusion-openlineage
      crate, not part of this repo.
    public: true
    depends_on: [trestle]   # olai-http only (optional client feature); its proto is buf-generated, not trestle
    publishes:
      - headwaters-client / headwaters-proto   # read-API client + generated proto types (crates.io)
      - hw (CLI)                 # inspect a lineage estate (humans + agents); git-only
      - headwaters (bin)         # the ingest/read service; git-only
      - headwaters (Docker image)
    key_paths:
      - docs/adr/                         # the lineage design decisions (0001-0016)
      - docs/agent-cli-design.md
      - docs/marquez-compatibility.md
    applies_patterns: [composition, composable-ui, agentic-cli]   # hw is the agentic-CLI lead
    story_role: >-
      The lineage plane — where the estate answers "where did this data come from,
      and where does it flow", including agent-facing question-verbs; also applies
      the composable-UI pattern (its headless lineage components) and is the LEAD
      application of the agentic-CLI pattern (the `hw` tool).

  breakwater:
    purpose: >-
      Fine-grained access control for the stack: Cedar policy enforcement wired
      into DataFusion, split into an engine-neutral decide/enforce core and a
      Cedar adapter. Answers "can this principal do this here?" and, when allowed,
      governs what they see (row filters + column masks).
    public: true
    depends_on: []          # no crate dep on a sibling; extracted OUT of hydrofoil
    extracted_from: hydrofoil
    publishes:
      - olai-datafusion-policy        # engine-neutral policy core (decide/enforce split)
      - olai-datafusion-policy-cedar  # Cedar adapter implementing the core
      - olai-cedar-oci                # Cedar policy provider over OCI-distributed bundles
      # libraries only — no binaries, no Docker image
    key_paths:
      - crates/datafusion-policy/
      - crates/datafusion-policy-cedar/examples/fact_gathering_walkthrough.rs
      - docs/pluggable-policy-architecture.md
      # note: breakwater's ADRs live in the hydrofoil repo (docs/adr/), not here
    story_role: >-
      The policy / access-control plane — the "plug in, don't fork" enforcement
      that rides on DataFusion without forking the engine.

  hydrofoil:
    canonical_framing: >-
      The INTEGRATION HUB — the consumer that composes all four siblings back
      together. (Resolved 2026-07-13.) The README's "Open Lakehouse Lab" label and
      the named "Open Lakehouse" desktop app are the hub's DEMONSTRABLE FACE, not the
      headline; never present as a shipped/stable product (see pre_release_note, §6).
    purpose: >-
      A catalog-native query engine (Flight SQL + HTTP/ConnectRPC) that reads open
      table formats through UC with policy and lineage wired in, plus a Tauri desktop
      app and React UIs. The integration hub that composes the siblings back together.
    public: true
    depends_on: [trestle, mangrove, breakwater]   # mangrove + breakwater by git; trestle's olai-stack-topology (desktop) by crates.io; lineage via upstream datafusion-openlineage
    publishes:
      # unpublished application layer — consumes the published olai-* libs
      - hydrofoil (bin + GHCR image)   # the query engine service
      - portal (bin + GHCR image)      # Tags + Files ConnectRPC services
      - desktop-host / open-lakehouse-desktop   # Tauri v2 desktop app ("Open Lakehouse")
      - "@open-lakehouse/ui, /node"    # React web UI + JS workspace (unpublished)
    key_paths:
      - crates/hydrofoil/                    # the query engine
      - crates/portal/                       # platform services (Tags + Files)
      - docs/policy-enforcement-design.md
      - docs/portable-uc-components.md
      - docs/open-lineage-design.md
      - docs/adr/                            # incl. the policy ADRs breakwater refers back to
    pre_release_note: >-
      Depends on personal forks (roeap/delta-rs, a delta-kernel fork) and
      unpublished app crates. Never present as shipped/stable — see
      blogs/CONVENTIONS.md §6 pre-release honesty.
    applies_patterns: [composition, composable-ui]
    story_role: >-
      The consumer that ties it all together — where the generator, the three
      planes, and the OSS foundations become one running lakehouse, and where both
      patterns culminate: services + DataFusion integrations composed into one
      session, and the siblings' composable UI components composed into one
      consolidated experience.

  distributary:
    purpose: >-
      OpenSharing / Delta Sharing in Rust: protocol models, a client, the protocol
      surface, an engine over pluggable ports (delta_kernel-backed Delta), a
      provider domain with Postgres and SQLite stores, and a composable sharing
      server that maps shares onto a catalog.
    public: true
    depends_on: [trestle, mangrove]   # trestle codegen + credential crates; mangrove's olai-uc-* (sharing state, handlers, client)
    publishes:
      - opensharing-* crates   # common / api / client / admin-api / engine / provider / postgres / sqlite
      - sharing-server (bin)   # published as opensharing-server
    key_paths:
      - ARCHITECTURE.md
      - trestle.yaml           # `trestle generate` config for models, handler traits, client
    applies_patterns: [composition]
    story_role: >-
      The sharing plane: the protocol over ports, mapped onto any catalog. A second
      service generated with trestle, alongside mangrove.

  luminescent-lakehouse:
    purpose: >-
      Deploys open-lakehouse services to Neon as Neon Functions (the services live
      in their own repos), plus a desktop shell for local trestle environments and
      the Neon Auth web pages.
    public: true
    depends_on: [trestle, headwaters, mangrove, distributary]   # services by git; trestle stack crates by crates.io, UI packages by release tarball
    publishes: []              # deployments and apps only; nothing published
    key_paths:
      - neon.ts                # which functions deploy
      - docs/deployment.md
      - docs/desktop.md
    story_role: >-
      The hosted face: the same services the estate builds, running serverless on
      Neon branches.

  tributary:
    purpose: >-
      Simulation and geospatial processing framework (DataFusion/Arrow) with Python
      bindings; generates realistic event data for demo domains (ghost kitchen,
      logistics).
    public: true
    depends_on: []
    publishes:
      - sim-* crates           # core / events / geo / kitchen / logistics / telemetry / artifacts / validate
      - caspers (CLI), caspers (Python)
    key_paths:
      - docs/ARCHITECTURE.md
    story_role: >-
      The data source for demos: simulated domains whose events land in the lakehouse.
