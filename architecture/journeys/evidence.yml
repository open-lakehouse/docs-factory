# Evidence: cells no script here proves. `outcome: fails` or `missing` renders an
# unlinked ✗; `outcome: works` (the engine's own docs or source say so, with
# `why` and a `source`) renders as `docs` on tables that set `documented: true`.
# A `source` names its page as `<project>:<bucket>/<slug>[#anchor]`, or is a URL.

# Unity Catalog.
- interfaces: [pandas]
  journeys: [table.list]
  outcome: missing
  why: "`deltalake` resolves `uc://` names but has no call that lists a schema's tables."
  source: unitycatalog:how-to/python-dataframes#list-tables
- interfaces: [polars, daft, pandas]
  journeys: [managed.path-write, managed.alter-schema, managed.set-properties]
  outcome: fails
  why: "Max catalog version is required when loading a catalog-managed table"
  source: unitycatalog:reference/features-and-limitations#clients-and-engines
  verified: {polars: 1.44.2, daft: 0.7.25, pandas: 2.3.3}
- interfaces: [cli]
  journeys: [credentials.vend-path, credentials.vend-table, credentials.vend-volume, credentials.vend-model-version]
  outcome: missing
  why: "The `uc` CLI has no command for temporary credentials; the pages call the REST API."
  source: unitycatalog:how-to/configure-aws-storage#check-that-the-server-vends-credentials
- interfaces: [spark-4.2]
  journeys: [metricview.replace]
  outcome: fails
  why: "`CREATE OR REPLACE VIEW … WITH METRICS` fails with `Replacing a view is not supported yet`. Drop the view and create it again."
  source: unitycatalog:how-to/metric-views#change-a-definition
  verified: {spark-4.2: 4.2.0}
- interfaces: [spark-4.2]
  journeys: [metricview.rename]
  outcome: fails
  why: "`ALTER VIEW … RENAME TO` fails with `Renaming a view is not supported yet`."
  source: unitycatalog:how-to/metric-views#change-a-definition
  verified: {spark-4.2: 4.2.0}
- interfaces: [python-sdk]
  journeys: [metricview.query]
  outcome: missing
  why: The SDK stores and returns the definition; computing measures needs an engine.
  source: unitycatalog:how-to/metric-views#register-a-definition-through-the-rest-api
- interfaces: [python-sdk]
  journeys: [metricview.replace, metricview.rename]
  outcome: missing
  why: The UC REST API has no table update; delete the metric view and create it again.
  source: unitycatalog:reference/features-and-limitations#namespace-and-assets
- interfaces: [python-sdk]
  journeys: [view.query]
  outcome: missing
  why: The SDK stores and returns the definition; running it needs an engine.
  source: unitycatalog:how-to/sql-views#register-a-view-through-the-rest-api
- interfaces: [python-sdk]
  journeys: [view.replace, view.rename]
  outcome: missing
  why: The UC REST API has no table update; delete the view and create it again.
  source: unitycatalog:reference/features-and-limitations#namespace-and-assets
- interfaces: [cli, python-sdk]
  journeys: [managed.alter-schema, managed.set-properties]
  outcome: missing
  why: The UC REST API has no table update.
  source: unitycatalog:reference/features-and-limitations#namespace-and-assets
- interfaces: [duckdb]
  journeys: [managed.create-as-select]
  outcome: fails
  why: "`CREATE TABLE … AS SELECT` fails with `Not implemented Error`."
  source: unitycatalog:reference/features-and-limitations#clients-and-engines
  verified: {duckdb: 2.0.0}
# The server side of Iceberg REST, as of `IcebergRestCatalogService.java` at
# the release tag. Each is a fact about the server, so it blocks the journeys
# that cover these operations for every client that reaches Iceberg REST, in
# each project whose `providers` binds the server.
- implementation: unityCatalogServer
  obligations: [icebergRestSpec:registerTable]
  outcome: missing
  why: The server has no `registerTable` endpoint.
  source: unitycatalog:reference/features-and-limitations#not-in-unity-catalog-oss
- implementation: unityCatalogServer
  obligations: [icebergRestSpec:commitTransaction]
  outcome: missing
  why: The server has no `commitTransaction` endpoint.
  source: unitycatalog:reference/features-and-limitations#not-in-unity-catalog-oss
- implementation: unityCatalogServer
  obligations: [icebergRestSpec:createView, icebergRestSpec:loadView, icebergRestSpec:listViews]
  outcome: missing
  why: "`loadView` always answers 404 so clients fall back to tables, and no other view endpoint exists."
  source: unitycatalog:reference/features-and-limitations#not-in-unity-catalog-oss
- implementation: unityCatalogServer
  obligations: [icebergRestSpec:planTableScan, icebergRestSpec:fetchScanTasks]
  outcome: missing
  why: The server has no scan-planning endpoints (`planTableScan`, `fetchScanTasks`).
  source: unitycatalog:reference/features-and-limitations#not-in-unity-catalog-oss
- implementation: unityCatalogServer
  obligations: [icebergRestSpec:signRequest]
  outcome: missing
  why: The server has no `signRequest` endpoint; it vends credentials instead.
  source: unitycatalog:reference/features-and-limitations#not-in-unity-catalog-oss
# A limit of one operation the server does serve, so it stays a cell per client.
- interfaces: [spark, duckdb, pyiceberg, polars, daft]
  journeys: [iceberg.rename-namespace]
  outcome: fails
  why: "Renaming a table into another namespace is not supported"
  source: unitycatalog:reference/features-and-limitations#not-in-unity-catalog-oss
- interfaces: [spark, duckdb, pyiceberg]
  journeys: [iceberg.read-uniform]
  outcome: fails
  why: A managed UniForm table can't be created and an external one isn't served through Iceberg REST.
  source: unitycatalog:reference/features-and-limitations#clients-and-engines
  verified: {spark: 4.1.0}

