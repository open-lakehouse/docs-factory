# Journeys on registered models and their versions, through the Unity Catalog API.
# See architecture/journeys/README.md.

model.register:
  title: Register a model version
  summary: Create a registered model and add a version whose files the catalog stores.
  asset: lakehouse.mlModel
  path: uc-api
model.view:
  title: View models and versions
  summary: "List a schema's registered models and a model's versions, or get one by name."
  asset: lakehouse.mlModel
  path: uc-api
model.load:
  title: Load a model version
  summary: Load a registered model version by its number and use it.
  asset: lakehouse.mlModel
  path: uc-api
model.update:
  title: Update a model or version
  summary: "Change a registered model's or a model version's comment."
  asset: lakehouse.mlModel
  path: uc-api
model.rename:
  title: Rename a registered model
  summary: "Change a registered model's name."
  asset: lakehouse.mlModel
  path: uc-api
model.delete-version:
  title: Delete a model version
  summary: Remove one version from a registered model.
  asset: lakehouse.mlModel
  path: uc-api
model.delete:
  title: Delete a registered model
  summary: Remove a registered model from the catalog.
  asset: lakehouse.mlModel
  path: uc-api
model.alias:
  title: Use a model alias
  summary: Set an alias on a model version, or load a version by its alias.
  asset: lakehouse.mlModel
  path: uc-api
