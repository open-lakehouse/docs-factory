# Author registry — source of truth for blog bylines.
#
# A post's front matter carries `author: <Full Name>` (see CONVENTIONS.md §3).
# That name is portable, plain-Markdown text; it degrades to a byline on GitHub.
# Here we enrich it: the preview harness (and, later, emit targets) looks the
# byline up by `name` and renders a rich, interactive author card — avatar, role,
# and social links. Richness is a property of the renderer, never of the source.
#
# Keyed by a kebab-case id. `avatar` is a filename under blogs/authors/ (omit if
# we have no photo — the card falls back to initials). Add a person here in the
# same change that first bylines them; reuse an existing entry before adding one.

robert-pack:
  name: Robert Pack
  role: Staff Developer Advocate
  org: Databricks
  avatar: robert-pack.jpg
  links:
    linkedin: https://www.linkedin.com/in/robert-pack/
    github: https://github.com/roeap

