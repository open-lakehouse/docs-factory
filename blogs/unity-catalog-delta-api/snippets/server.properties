# server.properties
#
# Loaded by mounting this file to the container's config dir. The post uses a plain
# docker run; compose.yaml is the equivalent Compose form.
#   mkdir -p /tmp/uc-data
#   docker run -d --name uc -p 8080:8080 \
#     -v /tmp/uc-data:/tmp/uc-data \
#     -v "$PWD/server.properties:/home/unitycatalog/etc/conf/server.properties:ro" \
#     unitycatalog/unitycatalog:v0.5.0
server.env=dev
# Disable authorization for local testing (any token, including none, is accepted).
server.authorization=disable
# Enable managed tables so the Delta API can allocate + commit them locally.
server.managed-table.enabled=true
# Managed-table storage root. It is an ABSOLUTE file:// path that is bind-mounted
# 1:1 host<->container (see compose.yaml), so the file:// locations UC vends to a
# client resolve unchanged on the host where Spark / DuckDB actually read them.
storage-root.tables=file:///tmp/uc-data
