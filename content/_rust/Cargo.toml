[package]
name = "docs-factory-snippets"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
deltalake = { version = "=1.1.1", features = ["datafusion"] }
# iceberg-datafusion 0.10.1 builds on DataFusion 53; the deltalake examples
# bring their own DataFusion.
datafusion = "53.1"
iceberg = "=0.10.1"
iceberg-catalog-rest = "=0.10.1"
iceberg-datafusion = "=0.10.1"
iceberg-storage-opendal = "=0.10.1"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "delta-read-a-delta-table"
path = "../delta/how-to/001-read-a-delta-table/snippets/read.rs"

[[example]]
name = "uc-datafusion-iceberg-rust"
path = "../unitycatalog/how-to/029-datafusion-iceberg-rust/snippets/query.rs"
