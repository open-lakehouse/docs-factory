# Delta Lake documentation coverage tracker
#
# Machine-readable backlog: one entry per documentable topic, mapping each Delta
# feature/concept to the Diataxis pages that should cover it and the examples that
# should demonstrate it. See content/coverage/README.md for the workflow and the
# source-of-truth policy.
#
# SOURCE POLICY: the `sources:` block cites the PUBLISHED upstream that defines the
# topic (PROTOCOL.md / docs.delta.io / Databricks docs). The internal research
# report (research/table-formats/*) is NOT authoritative and must not drive this
# backlog; if an example `support` value is taken from it, tag it
# support_source: "research-report (unverified)".
#
# Vocabularies:
#   page/example status : todo | drafting | draft | published | partial | blocked | n/a
#   feature_class        : reader-writer | writer-only | n/a
#   example support      : rw | r | w_partial | none | unknown   (default: unknown)
#   priority             : p0 (core) | p1 (common) | p2 (advanced)

project: delta

