# Which journeys engines and clients can do with Delta tables. A journey
# is what a reader sets out to do, however many calls it takes. Scripts claim
# cells with `[tool.docs-factory] claims.<interface>`; a claim counts once its
# page is `status: ready`, because only those scripts gate CI. `evidence` holds
# the cells no script here proves. `uv run docsnip compat --fix` renders each
# table into the page that embeds it, and `docsnip check` fails when one is
# stale.
# See content/README.md, "Compatibility claims".
spec: deltaSpec

interfaces:
  spark-sql:
    label: Spark SQL
    pin: pyspark
    package: pyspark
    model: deltaSpark
  pyspark:
    label: PySpark
    pin: pyspark
    package: pyspark
    model: deltaSpark
  deltalake:
    label: Python
    pin: deltalake
    package: deltalake
    model: deltaRs
  duckdb:
    label: DuckDB
    package: duckdb
    model: duckdb

journeys:
  create.table: Create a table
  create.ctas: Create from select
  create.partitioned: Create partitioned table
  write.append: Append rows
  write.overwrite: Overwrite rows
  write.replace-where: Replace where
  write.dynamic-partitions: Dynamic partitions
  write.enforce-schema: Enforce schema
  write.idempotent: Idempotent writes
  write.commit-metadata: Commit metadata
  dml.update: Update rows
  dml.delete: Delete rows
  merge.upsert: Merge upsert
  merge.not-matched-by-source: Merge not matched by source
  merge.schema-evolution: Merge schema evolution
  read.scan: Scan table
  read.pushdown: Filter pushdown
  read.version: Read version
  read.timestamp: Read timestamp
  read.past-retention: Read past retention
  history.list: List history
  history.detail: History detail
  history.restore: Restore version
  history.shallow-clone: Shallow clone
  schema.merge-on-write: Merge on write
  schema.overwrite: Overwrite schema
  schema.add-column: Add column
  schema.rename-drop: Rename/drop column
  schema.type-widening: Type widening
  quality.check: Check constraint
  quality.not-null: Not null constraint
  columns.generated: Generated columns
  columns.identity: Identity columns
  columns.default: Default columns
  cdf.read: Read change data
  stream.source-sink: Stream source/sink
  stream.foreach-batch-merge: Stream foreach batch merge
  layout.compact: Compact/optimize
  layout.zorder: Z-order
  layout.clustering: Clustering
  maint.vacuum: Vacuum
  maint.checkpoint: Checkpoint
  maint.purge-dvs: Purge deletion vectors
  maint.manifest: Generate manifest
  maint.repair: Repair table
  migrate.convert-parquet: Convert to Delta
  feature.enable: Enable feature
  feature.drop: Drop feature
  feature.properties: Feature properties
  storage.s3-multi-writer: S3 multi-writer
  storage.azure-gcs: Azure/GCS
  catalog.unity: Unity Catalog

tables:
  create-and-write:
    title: Create and write
    columns: [spark-sql, pyspark, deltalake, duckdb]
    rows:
      - create.table
      - create.ctas
      - create.partitioned
      - write.append
      - write.overwrite
      - write.replace-where
      - write.dynamic-partitions
      - write.enforce-schema
      - write.idempotent
      - write.commit-metadata
    documented: true
  modify-rows:
    title: Modify rows
    columns: [spark-sql, pyspark, deltalake, duckdb]
    rows:
      - dml.update
      - dml.delete
      - merge.upsert
      - merge.not-matched-by-source
      - merge.schema-evolution
    documented: true
  read-and-history:
