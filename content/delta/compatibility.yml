# The Delta Lake docs' projection of the estate-wide journey catalog
# (architecture/journeys/, ADR-0009): the interfaces this project's pages
# show, in tab order, and the tables they embed, rows of journeys. Scripts
# claim cells with `[tool.docs-factory] claims.<interface>`; a claim counts once
# its page is `status: ready`, because only those scripts gate CI. `uv run
# docsnip compat --fix` renders each table into the page that embeds it, and
# `docsnip check` fails when one is stale.
# See content/README.md, "Compatibility claims".
spec: deltaSpec

# This order is the tab order on every Delta page.
interfaces:
  - spark-sql
  - spark-python
  - spark-scala
  - spark-java
  - delta-rs-python
  - delta-rs-rust
  - duckdb-sql
  - duckdb-python

tables:
  create-and-write:
    title: Create and write
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - create.table
      - create.ctas
      - create.partitioned
      - write.append
      - write.overwrite
      - write.replace-where
      - write.dynamic-partitions
      - write.enforce-schema
      - write.idempotent
      - write.commit-metadata
    documented: true
  modify-rows:
    title: Modify rows
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - dml.update
      - dml.delete
      - merge.upsert
      - merge.not-matched-by-source
      - merge.schema-evolution
    documented: true
  read-and-history:
    title: Read and history
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - read.scan
      - read.pushdown
      - read.version
      - read.timestamp
      - read.past-retention
      - history.list
      - history.detail
      - history.restore
      - history.shallow-clone
    documented: true
  schema-and-quality:
    title: Schema and data quality
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - schema.merge-on-write
      - schema.overwrite
      - schema.add-column
      - schema.rename-drop
      - schema.type-widening
      - quality.check
      - quality.not-null
      - columns.generated
      - columns.identity
      - columns.default
    documented: true
  cdf-and-streaming:
    title: Change data and streaming
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - cdf.read
      - stream.source-sink
      - stream.foreach-batch-merge
    documented: true
  layout-and-maintenance:
    title: Layout and maintenance
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - layout.compact
      - layout.zorder
      - layout.clustering
      - maint.vacuum
      - maint.checkpoint
      - maint.purge-dvs
      - maint.manifest
      - maint.repair
      - migrate.convert-parquet
    documented: true
  features-and-protocol:
    title: Table features and protocol
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - feature.enable
      - feature.drop
      - feature.properties
    documented: true
  storage-and-catalogs:
    title: Storage and catalogs
    columns: [spark-sql, spark-python, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - storage.s3-multi-writer
      - storage.azure-gcs
      - catalog.unity
    documented: true
  # One Spark column: SQL and Python share the engine that reads the table.
  features-read:
    title: Read a table with a feature
    columns: [spark-sql, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - column-mapping.read
      - deletion-vectors.read
      - timestamp-ntz.read
      - v2-checkpoint.read
      - managed.read
      - vacuum-protocol-check.read
      - type-widening.read
      - variant.read
      - variant-shredding.read
      - collations.read
    documented: true
  features-write:
    title: Write a table with a feature
    columns: [spark-sql, delta-rs-python, delta-rs-rust, duckdb-sql]
    rows:
      - append-only.write
      - invariants.write
      - check-constraints.write
      - change-data-feed.write
      - generated-columns.write
      - identity-columns.write
      - column-mapping.write
      - column-defaults.write
      - deletion-vectors.write
      - row-tracking.write
      - timestamp-ntz.write
      - domain-metadata.write
      - v2-checkpoint.write
      - managed.append
      - iceberg-compat-v1.write
      - iceberg-compat-v2.write
      - clustering.write
      - vacuum-protocol-check.write
      - in-commit-timestamp.write
      - type-widening.write
      - variant.write
      - variant-shredding.write
      - collations.write
    documented: true
