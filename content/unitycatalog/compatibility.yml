# Which journeys engines and clients can do with Unity Catalog tables. A journey
# is what a reader sets out to do, however many calls it takes. Scripts claim
# cells with `[tool.docs-factory] claims.<interface>`; a claim counts once its
# page is `status: ready`, because only those scripts gate CI. `evidence` holds
# the cells no script here proves. `uv run docsnip compat --fix` renders each
# table into the page that embeds it, and `docsnip check` fails when one is
# stale.
# See content/README.md, "Compatibility claims".
spec: ucSpec

# A journey's family supplies the asset it acts on and what its participants
# must support; a journey can override either. Requirements name the contract a
# participant needs, not an implementation (ADR-0004), so a script's environment
# can supply any catalog that implements it.
families:
  table: &uc-table
    asset: lakehouse.table
    requires: &uc
      client: { consumes: [ucSpec] }
      catalog: { implements: [ucSpec] }
  external: *uc-table
  managed: *uc-table
  iceberg:
    asset: lakehouse.table
    requires:
      client: { consumes: [icebergRestSpec] }
      catalog: { implements: [icebergRestSpec] }
  metricview: { asset: lakehouse.metricView, requires: *uc }
  catalog: { asset: lakehouse.namespace, requires: *uc }
  schema: { asset: lakehouse.namespace, requires: *uc }
  volume: { asset: lakehouse.volume, requires: *uc }
  credential: { asset: lakehouse.credential, requires: *uc }
  location: { asset: lakehouse.externalLocation, requires: *uc }
  function: { asset: lakehouse.registeredFunction, requires: *uc }

interfaces:
  spark:
    label: Spark
    pin: pyspark
    package: pyspark
    model: apacheSpark
  # Metric views need Spark 4.2; the `spark` column is the default 4.1 line.
  spark-4.2:
    label: Spark
    pin: pyspark-4.2
    package: pyspark
    model: apacheSpark
  spark-sql:
    label: Spark · SQL
    pin: pyspark
    package: pyspark
    model: apacheSpark
  spark-python:
    label: Spark · Python
    pin: pyspark
    package: pyspark
    model: apacheSpark
  delta-rs-python:
    label: delta-rs · Python
    pin: deltalake
    package: deltalake
    model: deltaRs
  duckdb:
    label: DuckDB
    package: duckdb
    model: duckdb
  polars:
    label: Polars
    package: polars
    model: polars
  daft:
    label: Daft
    package: daft
    model: daft
  # pandas reaches Unity Catalog tables through delta-rs's Python binding.
  pandas:
    label: pandas
    package: pandas
    via: deltalake
    model: deltaRs
  pyiceberg:
    label: PyIceberg
    package: pyiceberg
    model: pyIceberg
  # The catalog clients. They manage catalog objects; scripts that read or write
  # data through them pair them with a storage library, named in the claim's note.
  cli:
    label: uc CLI
    pin: release
    model: ucCli
  python-sdk:
    label: Python SDK
    pin: unitycatalog-client
    package: unitycatalog-client
    model: unityCatalogPythonSdk
  unitycatalog-ai:
    label: unitycatalog-ai
    pin: unitycatalog-ai
    package: unitycatalog-ai
    model: unityCatalogAI

journeys:
  table.list:
    family: table
    title: List tables
    summary: List the tables in a schema from the engine, by their catalog names.
  external.read:
    family: external
    title: Read an external table
    summary: Read an external table by its catalog name, from files the reader can already reach.
  external.read-vended:
    family: external
    requires:
      client: { consumes: [ucSpec] }
      catalog: { implements: [ucSpec] }
      storage: { implements: [s3Api] }
    title: Read with vended S3 credentials
    summary: Read an external table on S3 with the short-lived credentials the server vends for it.
  external.append:
    family: external
    title: Append to an external table
    summary: Append rows to an external table, named through the catalog.
  managed.create:
    family: managed
    title: Create a managed table
    summary: Create a catalog-managed Delta table, with storage the catalog allocates.
  managed.read:
    family: managed
    title: Read a managed table
    summary: Read a catalog-managed table through the catalog.
  managed.append:
    family: managed
    title: Append to a managed table
    summary: Append rows to a catalog-managed table, with the catalog accepting the commit.
  managed.update:
    family: managed
    title: Update rows in a managed table
    summary: Change rows that match a condition in a catalog-managed table.
  managed.delete:
    family: managed
    title: Delete rows from a managed table
    summary: Remove rows that match a condition from a catalog-managed table.
  managed.drop:
    family: managed
    title: Drop a managed table
    summary: Drop a catalog-managed table and its data.
  managed.time-travel:
    family: managed
    title: Read an earlier version of a managed table
    summary: Query a catalog-managed table as it was at an earlier version.
  managed.path-write:
    family: managed
    title: Write to a managed table by path
    summary: Write to a catalog-managed table's storage location directly, bypassing the catalog.
  managed.alter-schema:
    family: managed
    title: Change a managed table's columns
    summary: Add, comment, drop, or widen columns of a catalog-managed table, with the catalog accepting the commit.
  managed.set-properties:
    family: managed
    title: Set a managed table's properties
    summary: Set and remove table properties on a catalog-managed table, with the catalog accepting the commit.
  managed.rename:
    family: managed
    title: Rename a managed table or column
    summary: Rename a catalog-managed table or one of its columns.
  external.alter-schema:
    family: external
    title: Change an external table's columns
    summary: Change an external table's columns in its Delta log, then bring the catalog's record in step.
  external.set-properties:
    family: external
    title: Set an external table's properties
    summary: Change an external table's properties and comments in its Delta log, then bring the catalog's record in step.
  managed.create-as-select:
    family: managed
    title: Create a managed table from a query
    summary: Create a catalog-managed Delta table from the result of a query, in one commit.
  managed.replace:
    family: managed
    title: Replace a managed table
    summary: Replace a catalog-managed table's definition and rows in one commit, keeping its identity and history.
  managed.overwrite:
    family: managed
    title: Overwrite a managed table
    summary: Replace all rows of a catalog-managed table and keep its schema.
  managed.replace-where:
    family: managed
    title: Replace rows that match a condition
    summary: Replace only the rows of a catalog-managed table that match a predicate.
  managed.overwrite-partitions:
    family: managed
    title: Overwrite partitions of a managed table
    summary: Overwrite only the partitions of a catalog-managed table that the new rows write to.
  external.read-format:
    family: external
    title: Read a Parquet, CSV, or JSON table
    summary: Read a non-Delta external table, using the format and location the catalog records.
  iceberg.schema-create:
    family: iceberg
    asset: lakehouse.namespace
    title: Create a schema through Iceberg REST
    summary: Create a schema as an Iceberg namespace, under the catalog the client names as its warehouse.
  iceberg.create:
    family: iceberg
    title: Create a managed Iceberg table
    summary: Create an Iceberg table through Iceberg REST, with storage the catalog allocates.
  iceberg.append:
    family: iceberg
    title: Append to an Iceberg table
    summary: Append rows to an Iceberg table, with credentials the catalog vends for its storage.
  iceberg.read:
    family: iceberg
    title: Read an Iceberg table
    summary: Read an Iceberg table by its catalog name, with credentials the catalog vends.
  iceberg.update:
    family: iceberg
    title: Update rows in an Iceberg table
    summary: Change rows that match a condition in an Iceberg table, committed through the catalog.
  iceberg.delete:
    family: iceberg
    title: Delete rows from an Iceberg table
    summary: Remove rows that match a condition from an Iceberg table, committed through the catalog.
  iceberg.rename:
    family: iceberg
    title: Rename an Iceberg table
    summary: Give an Iceberg table a new name in its schema.
  iceberg.drop:
    family: iceberg
    title: Drop an Iceberg table
    summary: Drop an Iceberg table, and for a managed one its data.
  iceberg.join-delta:
    family: iceberg
    requires:
      client: { consumes: [icebergRestSpec, ucSpec] }
      catalog: { implements: [icebergRestSpec, ucSpec] }
    title: Join Delta and Iceberg tables
    summary: Query a Delta table and an Iceberg table from the same catalog together in one session.
  iceberg.namespace-list:
    family: iceberg
    asset: lakehouse.namespace
    title: List schemas through Iceberg REST
    summary: List the schemas of the catalog the client names as its warehouse, as Iceberg namespaces.
    feature: { spec: icebergRestSpec, name: listNamespaces }
  iceberg.namespace-properties:
    family: iceberg
    asset: lakehouse.namespace
    title: Set schema properties through Iceberg REST
    summary: Set or remove properties on a schema through Iceberg REST.
    feature: { spec: icebergRestSpec, name: updateProperties }
  iceberg.namespace-drop:
    family: iceberg
    asset: lakehouse.namespace
    title: Drop a schema through Iceberg REST
    summary: Drop an empty schema through Iceberg REST.
    feature: { spec: icebergRestSpec, name: dropNamespace }
  iceberg.list:
    family: iceberg
    title: List Iceberg tables
    summary: List the tables in a schema through Iceberg REST.
    feature: { spec: icebergRestSpec, name: listTables }
  iceberg.overwrite:
    family: iceberg
    title: Overwrite an Iceberg table
    summary: Replace all of an Iceberg table's rows in one commit.
  iceberg.merge:
    family: iceberg
    title: Merge into an Iceberg table
    summary: Upsert rows into an Iceberg table with MERGE, committed through the catalog.
  iceberg.rename-namespace:
    family: iceberg
    title: Move an Iceberg table to another schema
    summary: Rename an Iceberg table into a different schema of the same catalog.
    feature: { spec: icebergRestSpec, name: renameTable }
  iceberg.read-uniform:
    family: iceberg
    title: Read a Delta table as Iceberg
    summary: Read a Delta table with Iceberg metadata (UniForm) through Iceberg REST.
    feature: { spec: icebergRestSpec, name: loadTable }
  iceberg.schema-evolve:
    family: iceberg
    title: Evolve an Iceberg table's schema
    summary: Add, rename, reorder, or drop columns without rewriting data files.
    feature: { spec: icebergSpec, name: schema-evolution, since: v1 }
  iceberg.type-promotion:
    family: iceberg
    title: Widen an Iceberg column type
    summary: Promote a column's type, such as int to long, without rewriting data files.
    feature: { spec: icebergSpec, name: type-promotion, since: v1 }
  iceberg.hidden-partitioning:
    family: iceberg
    title: Partition an Iceberg table by a transform
    summary: Create a table partitioned by a transform such as day or bucket, which queries prune without naming it.
    feature: { spec: icebergSpec, name: hidden-partitioning, since: v1 }
  iceberg.partition-evolve:
    family: iceberg
    title: Change an Iceberg table's partitioning
    summary: Change the partition spec of a table that has data, without rewriting it.
    feature: { spec: icebergSpec, name: partition-evolution, since: v1 }
  iceberg.sort-order:
    family: iceberg
    title: Set an Iceberg table's sort order
    summary: Set the sort order writers apply to new data files.
    feature: { spec: icebergSpec, name: sort-order, since: v1 }
  iceberg.time-travel:
    family: iceberg
    title: Read an earlier Iceberg snapshot
    summary: Query an Iceberg table as of a snapshot id or a timestamp.
    feature: { spec: icebergSpec, name: snapshots, since: v1 }
  iceberg.branch-tag:
    family: iceberg
    title: Branch and tag an Iceberg table
    summary: Create a branch or a tag on an Iceberg table, write to the branch, and read either.
    feature: { spec: icebergSpec, name: branching-tagging, since: v2 }
  iceberg.metadata-tables:
    family: iceberg
    title: Query an Iceberg table's metadata
    summary: Read a table's snapshots, history, files, or manifests as tables.
  iceberg.maintain:
    family: iceberg
    title: Maintain an Iceberg table
    summary: Expire snapshots, compact data files, and remove orphan files.
  iceberg.merge-on-read:
    family: iceberg
    title: Change rows with delete files
    summary: Update or delete rows by writing position delete files, merged at read time.
    feature: { spec: icebergSpec, name: position-deletes, since: v2 }
  iceberg.copy-on-write:
    family: iceberg
    title: Change rows by rewriting files
    summary: Update or delete rows by rewriting the data files that hold them.
  iceberg.equality-deletes:
    family: iceberg
    title: Write equality deletes
    summary: Delete rows by the values of key columns, recorded in equality delete files.
    feature: { spec: icebergSpec, name: equality-deletes, since: v2 }
  iceberg.statistics:
    family: iceberg
    title: Use Iceberg column statistics
    summary: Write and read column statistics or Puffin statistics files that prune scans.
    feature: { spec: icebergSpec, name: statistics, since: v1 }
  iceberg.v3-create:
    family: iceberg
    title: Create a v3 Iceberg table
    summary: Create an Iceberg table with format version 3 through the catalog.
    feature: { spec: icebergSpec, name: format-version-3, since: v3 }
  iceberg.v3-deletion-vectors:
    family: iceberg
    title: Use deletion vectors on Iceberg
    summary: Delete rows in a v3 table with deletion vectors, and read them back.
    feature: { spec: icebergSpec, name: deletion-vectors, since: v3 }
  iceberg.v3-row-lineage:
    family: iceberg
    title: Read Iceberg row lineage
    summary: Read each row's id and last-updated sequence number from a v3 table.
    feature: { spec: icebergSpec, name: row-lineage, since: v3 }
  iceberg.v3-default-values:
    family: iceberg
    title: Use Iceberg column default values
    summary: Add a column with a default, and read it for rows written before the column existed.
    feature: { spec: icebergSpec, name: default-values, since: v3 }
  iceberg.v3-variant:
    family: iceberg
    title: Use Iceberg VARIANT columns
    summary: Write and read semi-structured values in a VARIANT column.
    feature: { spec: icebergSpec, name: variant, since: v3 }
  iceberg.v3-geo:
    family: iceberg
    title: Use Iceberg geometry columns
    summary: Write and read geometry or geography values.
    feature: { spec: icebergSpec, name: geometry, since: v3 }
  iceberg.v3-timestamp-ns:
    family: iceberg
    title: Use nanosecond timestamps
    summary: Write and read timestamps with nanosecond precision.
    feature: { spec: icebergSpec, name: timestamp-ns, since: v3 }
  iceberg.v3-multi-arg-transforms:
    family: iceberg
    title: Partition by a multi-argument transform
    summary: Partition a v3 table by a transform over more than one column.
    feature: { spec: icebergSpec, name: multi-arg-transforms, since: v3 }
  iceberg.vended-credentials:
    family: iceberg
    asset: lakehouse.credential
    title: Refresh vended credentials
    summary: Get new storage credentials for a table from the catalog when the first ones expire.
    feature: { spec: icebergRestSpec, name: loadCredentials }
  iceberg.etag-load:
    family: iceberg
    title: Reload a table only when it changed
    summary: Reload table metadata conditionally, getting `304 Not Modified` when nothing changed.
    feature: { spec: icebergRestSpec, name: loadTable }
  iceberg.metrics:
    family: iceberg
    title: Report scan metrics
    summary: Report scan and commit metrics to the catalog.
    feature: { spec: icebergRestSpec, name: reportMetrics }
  iceberg.auth-token:
    family: iceberg
    title: Authenticate with a token
    summary: Connect to the Iceberg REST API with a bearer token.
  iceberg.register:
    family: iceberg
    title: Register an existing Iceberg table
    summary: Register a table from its metadata file, without copying data.
    feature: { spec: icebergRestSpec, name: registerTable }
  iceberg.transactions:
    family: iceberg
    title: Commit to several tables at once
    summary: Commit changes to more than one table atomically.
    feature: { spec: icebergRestSpec, name: commitTransaction }
  iceberg.views:
    family: iceberg
    title: Create and query Iceberg views
    summary: Create a view through Iceberg REST and query it.
    feature: { spec: icebergRestSpec, name: createView }
  iceberg.scan-planning:
    family: iceberg
    title: Plan scans on the server
    summary: Let the catalog plan a scan and hand back the files to read.
    feature: { spec: icebergRestSpec, name: planTableScan }
  iceberg.remote-signing:
    family: iceberg
    title: Sign storage requests through the catalog
    summary: Have the catalog sign each storage request instead of vending credentials.
    feature: { spec: icebergRestSpec, name: signRequest }
  metricview.create:
    family: metricview
    title: Create a metric view
    summary: Define dimensions and measures in YAML over a table or a query, and store the definition in the catalog.
  metricview.list:
    family: metricview
    title: List metric views
    summary: Find a schema's metric views by name.
  metricview.describe:
    family: metricview
    title: Inspect a metric view
    summary: Read a metric view's dimensions, measures, and stored definition.
  metricview.query:
    family: metricview
    title: Query a metric view
    summary: Compute measures with `measure()`, grouped and filtered by dimensions.
  metricview.replace:
    family: metricview
    title: Change a metric view's definition
    summary: Replace a metric view's definition in place, keeping its name.
  metricview.rename:
    family: metricview
    title: Rename a metric view
    summary: Give a metric view a new name in its schema.
  metricview.drop:
    family: metricview
    title: Drop a metric view
    summary: Remove a metric view; its source tables stay.
  catalog.create:
    family: catalog
    title: Create a catalog
    summary: Create a catalog, the top level of the three-level namespace.
  catalog.list:
    family: catalog
    title: View catalogs
    summary: List catalogs or get one by name, with its properties.
  catalog.update:
    family: catalog
    title: Update a catalog
    summary: Change a catalog's comment, properties, or name.
  catalog.delete:
    family: catalog
    title: Delete a catalog
    summary: Delete a catalog, including everything in it when forced.
  schema.create:
    family: schema
    title: Create a schema
    summary: Create a schema inside a catalog.
  schema.list:
    family: schema
    title: View schemas
    summary: List a catalog's schemas or get one by its full name.
  schema.update:
    family: schema
    title: Update or rename a schema
    summary: Change a schema's comment, properties, or name.
  schema.delete:
    family: schema
    title: Delete a schema
    summary: Delete an empty schema.
  table.register-external:
    family: table
    title: Register an external Delta table
    summary: Register Delta files that already exist in storage as a table, without copying them.
  table.register-format:
    family: table
    title: Register a Parquet, CSV, or JSON table
    summary: Register files in another format as an external table, with its columns declared.
  table.describe:
    family: table
    title: View a table
    summary: Get a table's columns, format, type, and storage location by its full name.
  table.read:
    family: table
    title: Read a table's rows from a client
    summary: Read rows of a registered Delta table without starting an engine.
  table.write-sample:
    family: table
    title: Write sample rows
    summary: Write generated rows into a table to try things out.
  table.drop:
    family: table
    title: Drop a table
    summary: Remove a table from the catalog. Data files of an external table stay in place.
  volume.create-external:
    family: volume
    title: Create an external volume
    summary: Register an existing storage folder as a volume.
  volume.create-managed:
    family: volume
    title: Create a managed volume
    summary: Create a volume whose storage the catalog allocates under a managed storage root.
  volume.view:
    family: volume
    title: View volumes
    summary: List a schema's volumes or get one by its full name, with its storage location.
  volume.list-files:
    family: volume
    title: List a volume's files
    summary: See which files a volume holds.
  volume.update:
    family: volume
    title: Rename or update a volume
    summary: Change a volume's comment or name.
  volume.delete:
    family: volume
    title: Delete a volume
    summary: Remove a volume from the catalog.
  credential.create:
    family: credential
    title: Create a storage credential
    summary: Store the cloud identity the server assumes to reach a bucket.
  location.create:
    family: location
    title: Create an external location
    summary: Pair a storage path with the credential that can access it.
  storage.view:
    family: location
    title: View credentials and external locations
    summary: List or get the storage credentials and external locations the server holds.
  credential.update:
    family: credential
    title: Update a storage credential
    summary: Change a storage credential's role, comment, or name.
  location.update:
    family: location
    title: Update an external location
    summary: Change an external location's URL, credential, or name.
  storage.delete:
    family: location
    title: Delete an external location and its credential
    summary: Remove an external location, then the credential nothing else uses.
  storage.managed-root:
    family: schema
    title: Give a catalog or schema managed storage
    summary: Set the storage root under which the catalog allocates managed tables and volumes.
  credentials.vend-path:
    family: credential
    title: Get credentials for a storage path
    summary: Ask the server for short-lived credentials scoped to a path under an external location.
  credentials.vend-volume:
    family: credential
    title: Get credentials for a volume
    summary: Ask the server for short-lived credentials to read or write one volume's files.
  volume.read-files:
    family: volume
    title: Read a volume's files
    summary: Read files in a volume on object storage with credentials the server vends.
  volume.write-files:
    family: volume
    title: Write files to a volume
    summary: Write files into a managed volume on object storage with vended credentials.
  function.create:
    family: function
    title: Register a Python function
    summary: Register a Python function in a schema, with its signature and source code.
  function.describe:
    family: function
    title: View a function
    summary: Get a function's parameters, return type, and source code by its full name.
  function.execute:
    family: function
    title: Run a function by name
    summary: Run a registered function by name with typed parameters, on the caller's side.
  function.list:
    family: function
    title: List functions
    summary: List the functions in a schema.
  function.delete:
    family: function
    title: Delete a function
    summary: Remove a function from the catalog.

tables:
  table-operations:
    title: Table operations
    columns: [spark, duckdb, polars, daft, pandas]
    rows:
      - table.list
      - external.read
      - external.read-vended
      - external.append
      - managed.create
      - managed.create-as-select
      - managed.read
      - managed.append
      - managed.update
      - managed.delete
      - managed.alter-schema
      - managed.set-properties
      - managed.rename
      - external.alter-schema
      - external.set-properties
      - managed.replace
      - managed.overwrite
      - managed.replace-where
      - managed.overwrite-partitions
      - managed.drop
      - managed.time-travel
      - managed.path-write
      - external.read-format
  # Polars and Daft reach Iceberg REST through PyIceberg's catalog.
  iceberg-rest:
    title: Iceberg tables through Iceberg REST
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.namespace-list
      - iceberg.schema-create
      - iceberg.namespace-properties
      - iceberg.namespace-drop
      - iceberg.list
      - iceberg.create
      - iceberg.append
      - iceberg.overwrite
      - iceberg.read
      - iceberg.update
      - iceberg.delete
      - iceberg.merge
      - iceberg.rename
      - iceberg.rename-namespace
      - iceberg.drop
      - iceberg.join-delta
      - iceberg.read-uniform
  iceberg-evolution:
    title: Evolve and maintain Iceberg tables
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.schema-evolve
      - iceberg.type-promotion
      - iceberg.hidden-partitioning
      - iceberg.partition-evolve
      - iceberg.sort-order
      - iceberg.time-travel
      - iceberg.branch-tag
      - iceberg.metadata-tables
      - iceberg.merge-on-read
      - iceberg.copy-on-write
      - iceberg.equality-deletes
      - iceberg.statistics
      - iceberg.maintain
  iceberg-v3:
    title: Iceberg format version 3
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.v3-create
      - iceberg.v3-deletion-vectors
      - iceberg.v3-row-lineage
      - iceberg.v3-default-values
      - iceberg.v3-variant
      - iceberg.v3-geo
      - iceberg.v3-timestamp-ns
      - iceberg.v3-multi-arg-transforms
  iceberg-catalog:
    title: Iceberg REST catalog capabilities
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.auth-token
      - iceberg.vended-credentials
      - iceberg.etag-load
      - iceberg.metrics
      - iceberg.register
      - iceberg.transactions
      - iceberg.views
      - iceberg.scan-planning
      - iceberg.remote-signing
  catalog-objects:
    title: Catalog objects
    columns: [cli, python-sdk]
    rows:
      - catalog.create
      - catalog.list
      - catalog.update
      - catalog.delete
      - schema.create
      - schema.list
      - schema.update
      - schema.delete
      - table.register-external
      - table.register-format
      - table.list
      - table.describe
      - table.read
      - table.write-sample
      - table.drop
      - volume.create-external
      - volume.create-managed
      - volume.view
      - volume.list-files
      - volume.update
      - volume.delete
  storage-and-access:
    title: Storage and credentials
    columns: [cli, python-sdk]
    rows:
      - credential.create
      - credential.update
      - location.create
      - location.update
      - storage.view
      - storage.delete
      - storage.managed-root
      - credentials.vend-path
      - credentials.vend-volume
      - volume.read-files
      - volume.write-files
  functions:
