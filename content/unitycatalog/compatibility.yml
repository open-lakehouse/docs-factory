# Which journeys engines and clients can do with Unity Catalog tables. A journey
# is what a reader sets out to do, however many calls it takes. Scripts claim
# cells with `[tool.docs-factory] claims.<interface>`; a claim counts once its
# page is `status: ready`, because only those scripts gate CI. `evidence` holds
# the cells no script here proves. `uv run docsnip compat --fix` renders each
# table into the page that embeds it, and `docsnip check` fails when one is
# stale.
# See content/README.md, "Compatibility claims".
spec: ucSpec

interfaces:
  spark:
    label: Spark
    pin: pyspark
    package: pyspark
    model: apacheSpark
  duckdb:
    label: DuckDB
    package: duckdb
    model: duckdb
  polars:
    label: Polars
    package: polars
    model: polars
  daft:
    label: Daft
    package: daft
  pandas:
    label: pandas
    package: pandas
  pyiceberg:
    label: PyIceberg
    package: pyiceberg
  # The catalog clients. They manage catalog objects; scripts that read or write
  # data through them pair them with a storage library, named in the claim's note.
  cli:
    label: uc CLI
    pin: release
  python-sdk:
    label: Python SDK
    pin: unitycatalog-client
    package: unitycatalog-client
  unitycatalog-ai:
    label: unitycatalog-ai
    pin: unitycatalog-ai
    package: unitycatalog-ai

journeys:
  table.list:
    title: List tables
    summary: List the tables in a schema from the engine, by their catalog names.
  external.read:
    title: Read an external table
    summary: Read an external table by its catalog name, from files the reader can already reach.
  external.read-vended:
    title: Read with vended S3 credentials
    summary: Read an external table on S3 with the short-lived credentials the server vends for it.
  external.append:
    title: Append to an external table
    summary: Append rows to an external table, named through the catalog.
  managed.create:
    title: Create a managed table
    summary: Create a catalog-managed Delta table, with storage the catalog allocates.
  managed.read:
    title: Read a managed table
    summary: Read a catalog-managed table through the catalog.
  managed.append:
    title: Append to a managed table
    summary: Append rows to a catalog-managed table, with the catalog accepting the commit.
  managed.update:
    title: Update rows in a managed table
    summary: Change rows that match a condition in a catalog-managed table.
  managed.delete:
    title: Delete rows from a managed table
    summary: Remove rows that match a condition from a catalog-managed table.
  managed.drop:
    title: Drop a managed table
    summary: Drop a catalog-managed table and its data.
  managed.time-travel:
    title: Read an earlier version of a managed table
    summary: Query a catalog-managed table as it was at an earlier version.
  external.read-format:
    title: Read a Parquet, CSV, or JSON table
    summary: Read a non-Delta external table, using the format and location the catalog records.
  iceberg.schema-create:
    title: Create a schema through Iceberg REST
    summary: Create a schema as an Iceberg namespace, under the catalog the client names as its warehouse.
  iceberg.create:
    title: Create a managed Iceberg table
    summary: Create an Iceberg table through Iceberg REST, with storage the catalog allocates.
  iceberg.append:
    title: Append to an Iceberg table
    summary: Append rows to an Iceberg table, with credentials the catalog vends for its storage.
  iceberg.read:
    title: Read an Iceberg table
    summary: Read an Iceberg table by its catalog name, with credentials the catalog vends.
  iceberg.update:
    title: Update rows in an Iceberg table
    summary: Change rows that match a condition in an Iceberg table, committed through the catalog.
  iceberg.delete:
    title: Delete rows from an Iceberg table
    summary: Remove rows that match a condition from an Iceberg table, committed through the catalog.
  iceberg.rename:
    title: Rename an Iceberg table
    summary: Give an Iceberg table a new name in its schema.
  iceberg.drop:
    title: Drop an Iceberg table
    summary: Drop an Iceberg table, and for a managed one its data.
  iceberg.join-delta:
    title: Join Delta and Iceberg tables
    summary: Query a Delta table and an Iceberg table from the same catalog together in one session.
  catalog.create:
    title: Create a catalog
    summary: Create a catalog, the top level of the three-level namespace.
  catalog.list:
    title: View catalogs
    summary: List catalogs or get one by name, with its properties.
  catalog.update:
    title: Update a catalog
    summary: Change a catalog's comment, properties, or name.
  catalog.delete:
    title: Delete a catalog
    summary: Delete a catalog, including everything in it when forced.
  schema.create:
    title: Create a schema
    summary: Create a schema inside a catalog.
  schema.list:
    title: View schemas
    summary: List a catalog's schemas or get one by its full name.
  schema.update:
    title: Update or rename a schema
    summary: Change a schema's comment, properties, or name.
  schema.delete:
    title: Delete a schema
    summary: Delete an empty schema.
  table.register-external:
    title: Register an external Delta table
    summary: Register Delta files that already exist in storage as a table, without copying them.
  table.register-format:
    title: Register a Parquet, CSV, or JSON table
    summary: Register files in another format as an external table, with its columns declared.
  table.describe:
    title: View a table
    summary: Get a table's columns, format, type, and storage location by its full name.
  table.read:
    title: Read a table's rows from a client
    summary: Read rows of a registered Delta table without starting an engine.
  table.write-sample:
    title: Write sample rows
    summary: Write generated rows into a table to try things out.
  table.drop:
    title: Drop a table
    summary: Remove a table from the catalog. Data files of an external table stay in place.
  volume.create-external:
    title: Create an external volume
    summary: Register an existing storage folder as a volume.
  volume.create-managed:
    title: Create a managed volume
    summary: Create a volume whose storage the catalog allocates under a managed storage root.
  volume.view:
    title: View volumes
    summary: List a schema's volumes or get one by its full name, with its storage location.
  volume.list-files:
    title: List a volume's files
    summary: See which files a volume holds.
  volume.update:
    title: Rename or update a volume
    summary: Change a volume's comment or name.
  volume.delete:
    title: Delete a volume
    summary: Remove a volume from the catalog.
  credential.create:
    title: Create a storage credential
    summary: Store the cloud identity the server assumes to reach a bucket.
  location.create:
    title: Create an external location
    summary: Pair a storage path with the credential that can access it.
  storage.view:
    title: View credentials and external locations
    summary: List or get the storage credentials and external locations the server holds.
  credential.update:
    title: Update a storage credential
    summary: Change a storage credential's role, comment, or name.
  location.update:
    title: Update an external location
    summary: Change an external location's URL, credential, or name.
  storage.delete:
    title: Delete an external location and its credential
    summary: Remove an external location, then the credential nothing else uses.
  storage.managed-root:
    title: Give a catalog or schema managed storage
    summary: Set the storage root under which the catalog allocates managed tables and volumes.
  credentials.vend-path:
    title: Get credentials for a storage path
    summary: Ask the server for short-lived credentials scoped to a path under an external location.
  credentials.vend-volume:
    title: Get credentials for a volume
    summary: Ask the server for short-lived credentials to read or write one volume's files.
  volume.read-files:
    title: Read a volume's files
    summary: Read files in a volume on object storage with credentials the server vends.
  volume.write-files:
    title: Write files to a volume
    summary: Write files into a managed volume on object storage with vended credentials.
  function.create:
    title: Register a Python function
    summary: Register a Python function in a schema, with its signature and source code.
  function.describe:
    title: View a function
    summary: Get a function's parameters, return type, and source code by its full name.
  function.execute:
    title: Run a function by name
    summary: Run a registered function by name with typed parameters, on the caller's side.
  function.list:
    title: List functions
    summary: List the functions in a schema.
  function.delete:
    title: Delete a function
    summary: Remove a function from the catalog.

tables:
  table-operations:
    title: Table operations
    columns: [spark, duckdb, polars, daft, pandas]
    rows:
      - table.list
      - external.read
      - external.read-vended
      - external.append
      - managed.create
      - managed.read
      - managed.append
      - managed.update
      - managed.delete
      - managed.drop
      - managed.time-travel
      - external.read-format
  iceberg-rest:
    title: Iceberg tables through Iceberg REST
    columns: [spark, duckdb, pyiceberg]
    rows:
      - iceberg.schema-create
      - iceberg.create
      - iceberg.append
      - iceberg.read
      - iceberg.update
      - iceberg.delete
      - iceberg.rename
      - iceberg.drop
      - iceberg.join-delta
  catalog-objects:
    title: Catalog objects
    columns: [cli, python-sdk]
    rows:
      - catalog.create
      - catalog.list
      - catalog.update
      - catalog.delete
      - schema.create
      - schema.list
      - schema.update
      - schema.delete
      - table.register-external
      - table.register-format
      - table.list
      - table.describe
      - table.read
      - table.write-sample
      - table.drop
      - volume.create-external
      - volume.create-managed
      - volume.view
      - volume.list-files
      - volume.update
      - volume.delete
  storage-and-access:
    title: Storage and credentials
    columns: [cli, python-sdk]
    rows:
      - credential.create
      - credential.update
      - location.create
      - location.update
      - storage.view
      - storage.delete
      - storage.managed-root
      - credentials.vend-path
      - credentials.vend-volume
      - volume.read-files
      - volume.write-files
  functions:
    title: Functions
    columns: [cli, python-sdk, unitycatalog-ai]
    rows:
      - function.create
      - function.describe
      - function.execute
      - function.list
      - function.delete

evidence:
  - interfaces: [pandas]
    journeys: [table.list]
    outcome: missing
    why: "`deltalake` resolves `uc://` names but has no call that lists a schema's tables."
    source: how-to/python-dataframes#list-tables
  - interfaces: [polars, daft, pandas]
    journeys: [managed.read, managed.append]
    outcome: fails
    why: "Max catalog version is required when loading a catalog-managed table"
    source: reference/features-and-limitations#clients-and-engines
    verified: {polars: 1.44.2, daft: 0.7.25, pandas: 2.3.3}
  - interfaces: [cli]
    journeys: [credentials.vend-path]
    outcome: missing
    why: "The `uc` CLI has no command for temporary path credentials; the page calls the REST API."
    source: how-to/configure-aws-storage#check-that-the-server-vends-credentials
