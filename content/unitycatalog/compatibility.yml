# The Unity Catalog docs' projection of the estate-wide journey catalog
# (architecture/journeys/, ADR-0009): the interfaces this project's pages
# show, in tab order, and the tables they embed, rows of journeys. Scripts
# claim cells with `[tool.docs-factory] claims.<interface>`; a claim counts once
# its page is `status: ready`, because only those scripts gate CI. `uv run
# docsnip compat --fix` renders each table into the page that embeds it, and
# `docsnip check` fails when one is stale.
# See content/README.md, "Compatibility claims".
spec: unityCatalogSpec

interfaces:
  - spark
  - spark-4.2
  - spark-sql
  - spark-python
  - delta-rs-python
  - duckdb
  - polars
  - daft
  - pandas
  - pyiceberg
  - cli
  - python-sdk
  - mlflow
  - unitycatalog-ai
  - unitycatalog-langchain

# The implementation that plays each provider role in this project's cells: the
# server the docs' environments run. What it doesn't serve
# (architecture/journeys/evidence.yml) blocks the journeys that need it.
providers:
  catalog: unityCatalogServer

tables:
  table-operations:
    title: Table operations
    columns: [spark, duckdb, polars, daft, pandas]
    rows:
      - table.list
      - external.read
      - external.read-vended
      - external.append
      - managed.create
      - managed.create-as-select
      - managed.read
      - managed.append
      - managed.update
      - managed.delete
      - managed.alter-schema
      - managed.set-properties
      - managed.rename
      - external.alter-schema
      - external.set-properties
      - managed.replace
      - managed.overwrite
      - managed.replace-where
      - managed.overwrite-partitions
      - managed.drop
      - managed.time-travel
      - managed.path-write
      - external.read-format
  # Polars and Daft reach Iceberg REST through PyIceberg's catalog.
  iceberg-rest:
    title: Iceberg tables through Iceberg REST
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.namespace-list
      - iceberg.schema-create
      - iceberg.namespace-properties
      - iceberg.namespace-drop
      - iceberg.list
      - iceberg.create
      - iceberg.append
      - iceberg.overwrite
      - iceberg.read
      - iceberg.update
      - iceberg.delete
      - iceberg.merge
      - iceberg.rename
      - iceberg.rename-namespace
      - iceberg.drop
      - iceberg.join-delta
      - iceberg.read-uniform
  iceberg-evolution:
    title: Evolve and maintain Iceberg tables
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.schema-evolve
      - iceberg.type-promotion
      - iceberg.hidden-partitioning
      - iceberg.partition-evolve
      - iceberg.sort-order
      - iceberg.time-travel
      - iceberg.branch-tag
      - iceberg.metadata-tables
      - iceberg.merge-on-read
      - iceberg.copy-on-write
      - iceberg.equality-deletes
      - iceberg.statistics
      - iceberg.maintain
  iceberg-v3:
    title: Iceberg format version 3
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.v3-create
      - iceberg.v3-deletion-vectors
      - iceberg.v3-row-lineage
      - iceberg.v3-default-values
      - iceberg.v3-variant
      - iceberg.v3-geo
      - iceberg.v3-timestamp-ns
      - iceberg.v3-multi-arg-transforms
  iceberg-catalog:
    title: Iceberg REST catalog capabilities
    columns: [spark, duckdb, pyiceberg, polars, daft]
    rows:
      - iceberg.auth-token
      - iceberg.vended-credentials
      - iceberg.etag-load
      - iceberg.metrics
      - iceberg.register
      - iceberg.transactions
      - iceberg.views
      - iceberg.scan-planning
      - iceberg.remote-signing
  catalog-objects:
    title: Catalog objects
    columns: [cli, python-sdk]
    rows:
      - catalog.create
      - catalog.list
      - catalog.update
      - catalog.delete
      - schema.create
      - schema.list
      - schema.update
      - schema.delete
      - table.register-external
      - table.register-format
      - table.list
      - table.describe
      - table.read
      - table.write-sample
      - table.drop
      - volume.create-external
      - volume.create-managed
      - volume.view
      - volume.list-files
      - volume.update
      - volume.delete
  storage-and-access:
    title: Storage and credentials
    columns: [cli, python-sdk]
    rows:
      - credential.create
      - credential.update
      - location.create
      - location.update
      - storage.view
      - storage.delete
      - storage.managed-root
      - credentials.vend-path
      - credentials.vend-volume
      - volume.read-files
      - volume.write-files
  functions:
    title: Functions
    columns: [cli, python-sdk, unitycatalog-ai]
    rows:
      - function.create
      - function.create-wrapped
      - function.describe
      - function.execute
      - function.list
      - function.get-source
