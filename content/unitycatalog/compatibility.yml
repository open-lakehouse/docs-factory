# What engines and clients can do with Unity Catalog tables. Scripts claim cells
# with `[tool.docs-factory] claims.<interface>`; a claim counts once its page is
# `status: ready`, because only those scripts gate CI. `evidence` holds the
# cells no script here proves. `uv run docsnip compat --fix` renders each table
# into the page that embeds it, and `docsnip check` fails when one is stale.
# See content/README.md, "Compatibility claims".
spec: ucSpec

interfaces:
  spark:
    label: Spark
    pin: pyspark
    package: pyspark
    model: apacheSpark
  duckdb:
    label: DuckDB
    package: duckdb
    model: duckdb
  polars:
    label: Polars
    package: polars
    model: polars
  daft:
    label: Daft
    package: daft
  pandas:
    label: pandas
    package: pandas

operations:
  table.list: List the tables in a schema
  external.read: Read an external Delta table by name
  external.read-vended: Read an external table on S3 with vended credentials
  external.append: Append rows to an external Delta table
  managed.create: Create a catalog-managed Delta table
  managed.read: Read a catalog-managed table
  managed.append: Append rows to a catalog-managed table
  managed.update: Update rows in a catalog-managed table
  managed.delete: Delete rows from a catalog-managed table
  managed.drop: Drop a catalog-managed table

tables:
  table-operations:
    columns: [spark, duckdb, polars, daft, pandas]
    rows:
      - label: List tables
        ops: [table.list]
      - label: Read an external table
        ops: [external.read]
      - label: Read with vended S3 credentials
        ops: [external.read-vended]
      - label: Append to an external table
        ops: [external.append]
      - label: Create a managed table
        ops: [managed.create]
      - label: Read or append to a managed table
        ops: [managed.read, managed.append]
      - label: Update, delete, or drop a managed table
        ops: [managed.update, managed.delete, managed.drop]

evidence:
  - interfaces: [pandas]
    ops: [table.list]
    outcome: missing
    why: "`deltalake` resolves `uc://` names but has no call that lists a schema's tables."
    source: how-to/python-dataframes#list-tables
  - interfaces: [polars, daft, pandas]
    ops: [managed.read, managed.append]
    outcome: fails
    why: "Max catalog version is required when loading a catalog-managed table"
    source: reference/features-and-limitations#clients-and-engines
    verified: {polars: 1.44.2, daft: 0.7.25, pandas: 2.3.3}
