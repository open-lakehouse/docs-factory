evidence:
  - interfaces: [pandas]
    journeys: [table.list]
    outcome: missing
    why: "`deltalake` resolves `uc://` names but has no call that lists a schema's tables."
    source: how-to/python-dataframes#list-tables
  - interfaces: [polars, daft, pandas]
    journeys: [managed.path-write, managed.alter-schema, managed.set-properties]
    outcome: fails
    why: "Max catalog version is required when loading a catalog-managed table"
    source: reference/features-and-limitations#clients-and-engines
    verified: {polars: 1.44.2, daft: 0.7.25, pandas: 2.3.3}
  - interfaces: [cli]
    journeys: [credentials.vend-path]
    outcome: missing
    why: "The `uc` CLI has no command for temporary path credentials; the page calls the REST API."
    source: how-to/configure-aws-storage#check-that-the-server-vends-credentials
  - interfaces: [spark-4.2]
    journeys: [metricview.replace]
    outcome: fails
    why: "`CREATE OR REPLACE VIEW … WITH METRICS` fails with `Replacing a view is not supported yet`. Drop the view and create it again."
    source: how-to/metric-views#change-a-definition
    verified: {spark-4.2: 4.2.0}
  - interfaces: [spark-4.2]
    journeys: [metricview.rename]
    outcome: fails
    why: "`ALTER VIEW … RENAME TO` fails with `Renaming a view is not supported yet`."
    source: how-to/metric-views#change-a-definition
    verified: {spark-4.2: 4.2.0}
  - interfaces: [python-sdk]
    journeys: [metricview.query]
    outcome: missing
    why: The SDK stores and returns the definition; computing measures needs an engine.
    source: how-to/metric-views#register-a-definition-through-the-rest-api
  - interfaces: [python-sdk]
    journeys: [metricview.replace, metricview.rename]
    outcome: missing
    why: The UC REST API has no table update; delete the metric view and create it again.
    source: reference/features-and-limitations#namespace-and-assets
  - interfaces: [cli, python-sdk]
    journeys: [managed.alter-schema, managed.set-properties]
    outcome: missing
    why: The UC REST API has no table update.
    source: reference/features-and-limitations#namespace-and-assets
  - interfaces: [duckdb]
    journeys: [managed.create-as-select]
    outcome: fails
    why: "`CREATE TABLE … AS SELECT` fails with `Not implemented Error`."
    source: reference/features-and-limitations#clients-and-engines
    verified: {duckdb: 1.5.6}
  # The server side of Iceberg REST, as of `IcebergRestCatalogService.java` at
  # the release tag: no client can do these, whatever it supports.
  - interfaces: [spark, duckdb, pyiceberg, polars, daft]
    journeys: [iceberg.register]
    outcome: missing
    why: The server has no `registerTable` endpoint.
    source: reference/features-and-limitations#not-in-unity-catalog-oss
  - interfaces: [spark, duckdb, pyiceberg, polars, daft]
    journeys: [iceberg.transactions]
    outcome: missing
    why: The server has no `commitTransaction` endpoint.
    source: reference/features-and-limitations#not-in-unity-catalog-oss
  - interfaces: [spark, duckdb, pyiceberg, polars, daft]
    journeys: [iceberg.views]
    outcome: missing
    why: "`loadView` always answers 404 so clients fall back to tables, and no other view endpoint exists."
    source: reference/features-and-limitations#not-in-unity-catalog-oss
  - interfaces: [spark, duckdb, pyiceberg, polars, daft]
    journeys: [iceberg.scan-planning]
    outcome: missing
    why: The server has no scan-planning endpoints (`planTableScan`, `fetchScanTasks`).
    source: reference/features-and-limitations#not-in-unity-catalog-oss
  - interfaces: [spark, duckdb, pyiceberg, polars, daft]
    journeys: [iceberg.remote-signing]
    outcome: missing
    why: The server has no `signRequest` endpoint; it vends credentials instead.
    source: reference/features-and-limitations#not-in-unity-catalog-oss
  - interfaces: [spark, duckdb, pyiceberg, polars, daft]
    journeys: [iceberg.rename-namespace]
    outcome: fails
    why: "Renaming a table into another namespace is not supported"
    source: reference/features-and-limitations#not-in-unity-catalog-oss
  - interfaces: [spark, duckdb, pyiceberg]
    journeys: [iceberg.read-uniform]
    outcome: fails
    why: A managed UniForm table can't be created and an external one isn't served through Iceberg REST.
    source: reference/features-and-limitations#clients-and-engines
    verified: {spark: 4.1.0}
