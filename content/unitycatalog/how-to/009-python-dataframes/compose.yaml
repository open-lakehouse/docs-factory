name: uc-docs-python-dataframes

# aws-sim answers the AWS S3 and STS names locally, so the server vends
# credentials exactly as it would on AWS; see envs/aws-sim/README.md.
include:
  - ../../../../envs/aws-sim/compose.yaml

# UC_DOCS_ROOT is bind-mounted at the same path inside the container, so a
# file:// location means the same directory to the server and to your client.
x-docs-root: &docs-root
  type: bind
  source: ${UC_DOCS_ROOT:-/tmp/uc-docs}
  target: ${UC_DOCS_ROOT:-/tmp/uc-docs}

services:
  # On Linux the bind mount keeps host ownership; open it up so both your user
  # and the server's (uid 100) can write there.
  init-storage:
    image: unitycatalog/unitycatalog:v0.6.0
    user: root
    entrypoint: ["chmod", "0777", "${UC_DOCS_ROOT:-/tmp/uc-docs}"]
    volumes:
      - *docs-root

  unitycatalog:
    image: unitycatalog/unitycatalog:v0.6.0
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - type: bind
        source: ./server.properties
        target: /home/unitycatalog/etc/conf/server.properties
        read_only: true
      - aws-sim-certs:/certs:ro
      - *docs-root
    depends_on:
      init-storage:
        condition: service_completed_successfully
      envoy:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://localhost:8080/api/2.1/unity-catalog/catalogs || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
