# The Unity Catalog release these docs describe, and the companion versions
# they pin. Pages state the release only through their environment's title;
# `docsnip check` fails on any pin in content/, envs/, or the site config that
# disagrees with this file, and `just bump-uc <version>` rewrites them all.
# See docs/design/docs-versioning.md.
release: 0.7.0
pins:
  unitycatalog-client: 0.7.0
  # The AI packages version independently; 0.4.0 is the one in the release's
  # source tree.
  unitycatalog-ai: 0.4.0
  # From the same source tree as unitycatalog-ai.
  unitycatalog-langchain: 0.4.0
  # From the same source tree as unitycatalog-ai.
  unitycatalog-openai: 0.4.0
  # unitycatalog-openai 0.4.0 requires `openai>=1.46.1,<=2.24.0`, so it can't
  # share an environment with an openai 3.x SDK. The cap is gone from the
  # source tree at v0.7.0 (#1826) but not from the 0.4.0 wheel.
  openai: 2.24.0
  # Versions independently of the other AI packages: 0.2.0 is the version in
  # the same source tree. Its wheel doesn't cap anthropic (the source tree's
  # pyproject caps it at 0.84.0).
  unitycatalog-anthropic: 0.2.0
  # The Anthropic SDK the Anthropic tools page runs on.
  anthropic: 1.17.0
  # 1.0.9–1.0.13 break `import langchain.agents` under unitycatalog-langchain's
  # `langchain<=1.2.10` cap (ImportError: ExecutionInfo).
  langgraph-prebuilt: 1.0.8
  # MLflow: the tracking server image in envs/uc-mlflow and every client of
  # the model registry. The `ghcr.io/mlflow/mlflow:v…` tag follows this key.
  mlflow: 3.17.0
  # The model the MLflow pages train, log, and register.
  scikit-learn: 1.9.1
  # `ChatMlflow`, the chat model that talks to the MLflow AI Gateway.
  langchain-community: 0.4.1
  # The newest delta-spark the release's Spark connector is tested with.
  delta-spark: 4.3.1
  pyspark: 4.1.0
  # SQL views and metric views need Spark 4.2: their pages pin this line, and the
  # `pyspark==4.2…` and `delta-spark_4.2_…` pins in content follow these keys.
  pyspark-4.2: 4.2.0
  delta-spark-4.2: 4.4.1
  # build.sbt `icebergVersion` at the release tag; the Iceberg REST spec page
  # renders from this ref.
  iceberg: 1.11.0
  # The deltalake (delta-rs) release the external-table examples run on.
  deltalake: 1.6.6
  # The DuckDB release the Unity Catalog pages' DuckDB examples run on.
  duckdb: 1.5.6
