# The Unity Catalog release these docs describe, and the companion versions
# they pin. Pages state the release only through their environment's title;
# `docsnip check` fails on any pin in content/, envs/, or the site config that
# disagrees with this file, and `just bump-uc <version>` rewrites them all.
# See docs/design/docs-versioning.md.
release: 0.7.0
pins:
  unitycatalog-client: 0.7.0
  # The AI packages version independently; 0.4.0 is the one in the release's
  # source tree.
  unitycatalog-ai: 0.4.0
  # The newest delta-spark the release's Spark connector is tested with.
  delta-spark: 4.3.1
  pyspark: 4.1.0
  # Metric views need Spark 4.2: its pages pin this line, and the
  # `pyspark==4.2…` and `delta-spark_4.2_…` pins in content follow these keys.
  pyspark-4.2: 4.2.0
  delta-spark-4.2: 4.4.1
  # build.sbt `icebergVersion` at the release tag; the Iceberg REST spec page
  # renders from this ref.
  iceberg: 1.11.0
  # The DuckDB release the Unity Catalog pages' DuckDB examples run on.
  duckdb: 1.5.6
