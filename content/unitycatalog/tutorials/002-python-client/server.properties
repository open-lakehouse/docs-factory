# Minimal Unity Catalog OSS server config for the python-client tutorial tests.
# Authorization disabled so the tutorial runs unauthenticated.
server.env=test
server.authorization=disable

# Enable MANAGED tables (experimental) and set the managed-table storage root as
# an absolute file:// URL bind-mounted 1:1 host<->container (see the compose
# file). The tutorial creates an EXTERNAL table under this same root.
server.managed-table.enabled=true
storage-root.tables=file:///tmp/uc-test
