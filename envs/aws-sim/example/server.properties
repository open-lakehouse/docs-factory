# Local, single-user server. Authorization is disabled: never use this
# configuration for a shared server.
server.env=dev
server.authorization=disable

# The same per-bucket config you'd write for real AWS: no endpoint keys.
s3.bucketPath.0=s3://uc-docs
s3.region.0=us-east-1
s3.awsRoleArn.0=arn:aws:iam::000000000000:role/uc-storage
s3.accessKey.0=aws-sim-root
s3.secretKey.0=aws-sim-root-secret
