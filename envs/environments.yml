# Reader-facing facts about each compose file under envs/, keyed by its path
# relative to this folder. A script's [tool.docs-factory] compose must name one
# of these. The docs emitter turns an entry into the commands that start a
# page's stack (a tutorial's first step), or a how-to's prerequisite linking
# `guide`; content/conftest.py hands `client-env` to the script it runs, so the
# variables a reader exports are the ones the test uses.
#
#   title       what the reader starts
#   ports       host ports the stack binds; the env bundle's README lists them
#   client-env  variables a client on the host needs to reach the stack
#   guide       <bucket>/<slug>[#anchor] of the section that starts it; default
#               the site's guide (emit/docs/sites/<site>.mjs env.guide)
#
# A generated environment (envs/<name>/env.toml, rendered by Trestle) says
# `generated: <name>` instead of ports and client-env: `docsnip envs --fix`
# derives them, and the files its bundle ships, from its plan.json into
# environments.generated.json.
environments:
  unitycatalog/compose.yaml:
    title: Unity Catalog 0.7.0
    generated: unitycatalog

  uc-aws/compose.yaml:
    title: Unity Catalog 0.7.0 with simulated S3 and PostgreSQL
    guide: how-to/run-local-server#start-the-server-with-simulated-s3
    generated: uc-aws

  uc-mlflow/compose.yaml:
    title: Unity Catalog 0.7.0 with MLflow, simulated S3, and PostgreSQL
    generated: uc-mlflow

  uc-local/compose.yaml:
    title: Unity Catalog 0.7.0 with PostgreSQL and RustFS on one machine
    generated: uc-local

  uc-hybrid/compose.yaml:
    title: Unity Catalog 0.7.0 with hosted PostgreSQL and S3-compatible storage
    generated: uc-hybrid
