# Unity Catalog with simulated S3, generated by Trestle (envs/trestle.toml pins
# the revision). The stand-in for unitycatalog/compose.aws.yaml: UC through the
# gateway on host :8080, S3 on host :9000, metadata in Postgres. Edit this file,
# then `just env-render uc-aws`; never edit the rendered files.
version = 3

[selection]
modules = ["unity-catalog", "rustfs", "postgres"]

[selection.knob_overrides.unity-catalog]
# The bucket the pages read and write.
bucket = "uc-docs"
# Built from image/ (the release image with the docs' local fixes); the tag
# follows content/unitycatalog/release.yml.
image = "uc-docs-unitycatalog:0.7.0"
build = "image"
# `docker exec unitycatalog bin/uc` works from any folder.
container_name = "unitycatalog"
# UC_DOCS_ROOT means the same directory to the server and to the reader.
extra_mounts = "${UC_DOCS_ROOT:-/tmp/uc-docs}:${UC_DOCS_ROOT:-/tmp/uc-docs}"
# Docker creates a missing UC_DOCS_ROOT as root; open it up so both you and the
# server can write there.
writable_mounts = "${UC_DOCS_ROOT:-/tmp/uc-docs}"
# The pages register their storage credential and external location themselves.
storage_bootstrap = "none"
master_role_arn = "arn:aws:iam::123456789012:role/uc-master"

[selection.knob_overrides.envoy]
publish_admin = "false"

[selection.knob_overrides.rustfs]
generic_endpoint_env = "true"

[context]
env_name = "uc-docs"
gateway_host_port = 8080
dedicated_listener_ports = [9000]
local_secrets = "inline"
