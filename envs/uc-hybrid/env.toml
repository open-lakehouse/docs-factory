# The hybrid deployment pattern, generated by Trestle (envs/trestle.toml pins
# the revision): Unity Catalog runs on this machine with no gateway, and its
# state lives in hosted services: metadata in a Neon PostgreSQL project, data
# in an S3-compatible bucket. UC keeps no state of its own, so everyone who
# runs this folder against the same project and bucket shares one catalog.
# README.md walks through creating both. Edit this file, then
# `just env-render uc-hybrid`; never edit the rendered files.
version = 4

[selection]
modules = ["unity-catalog", "hosted-postgres", "aws-s3"]

[selection.gateway]
enabled = false

[selection.knob_overrides.unity-catalog]
# The tag follows content/unitycatalog/release.yml.
image = "unitycatalog/unitycatalog:v0.7.0"

[selection.hosted.hosted-postgres]
vendor = "neon"

[selection.hosted.hosted-postgres.connection]
kind = "postgres"
host = "${PGHOST}"
username = "${PGUSER}"
password = "${PGPASSWORD}"

[selection.hosted.aws-s3]
# Any S3-compatible store (Cloudflare R2, Tigris, a remote MinIO, ...): the
# steps then ask for a key instead of creating an IAM user.
vendor = "generic"

[selection.hosted.aws-s3.connection]
kind = "s3"
endpoint = "${AWS_ENDPOINT_URL}"
access_key_id = "${AWS_ACCESS_KEY_ID}"
secret_access_key = "${AWS_SECRET_ACCESS_KEY}"

[context]
env_name = "uc-hybrid"
