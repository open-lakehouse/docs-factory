# The local deployment pattern, generated by Trestle (envs/trestle.toml pins the
# revision): Unity Catalog, PostgreSQL, and RustFS on one machine, no gateway,
# each service on its own host port, and every byte of state in folders on this
# disk. Edit this file, then `just env-render uc-local`; never edit the rendered
# files.
version = 4

[selection]
modules = ["unity-catalog", "postgres", "rustfs"]

[selection.gateway]
enabled = false

[selection.knob_overrides.unity-catalog]
# The tag follows content/unitycatalog/release.yml.
image = "unitycatalog/unitycatalog:v0.7.0"

[context]
env_name = "uc-local"
local_secrets = "inline"
