# Unity Catalog with MLflow, generated by Trestle (envs/trestle.toml pins the
# revision): UC and MLflow through the gateway on host :8080, S3 on host :9000,
# metadata in Postgres. MLflow's model registry is served from UC, so a model
# version lands in the `unity` catalog's managed storage. Edit this file, then
# `just env-render uc-mlflow`; never edit the rendered files.
version = 4

[selection]
modules = ["unity-catalog", "mlflow", "rustfs", "postgres"]

[selection.knob_overrides.unity-catalog]
bucket = "amzn-s3-demo-bucket"
# Built from image/ (the release image with the docs' local fixes); the tag
# follows content/unitycatalog/release.yml.
image = "uc-docs-unitycatalog:0.7.0"
build = "image"
# `docker exec unitycatalog bin/uc` works from any folder.
container_name = "unitycatalog"
# Registered model versions need a catalog with managed storage.
default_catalog = "unity"

[selection.knob_overrides.mlflow]
# The tag follows the `mlflow` pin in content/unitycatalog/release.yml.
image = "ghcr.io/mlflow/mlflow:v3.17.0-full"

[selection.knob_overrides.postgres]
# A named volume, so `docker compose down -v` gives the next run an empty
# metastore.
data = "volume"

[selection.knob_overrides.envoy]
publish_admin = "false"

[selection.knob_overrides.rustfs]
generic_endpoint_env = "true"

[context]
env_name = "uc-docs"
gateway_host_port = 8080
dedicated_listener_ports = [9000]
local_secrets = "inline"
