# A local, single-user Unity Catalog 0.6.0 server for the unitycatalog docs.
# Start it from this folder with `docker compose up -d --wait`. For pages that
# need S3, use compose.aws.yaml instead; see README.md.
name: uc-docs

# UC_DOCS_ROOT is bind-mounted at the same path inside the container, so a
# file:// location means the same directory to the server and to your client.
x-docs-root: &docs-root
  type: bind
  source: ${UC_DOCS_ROOT:-/tmp/uc-docs}
  target: ${UC_DOCS_ROOT:-/tmp/uc-docs}

services:
  # On Linux the bind mount keeps host ownership; open it up so both your user
  # and the server's (uid 100) can write there.
  init-storage:
    image: unitycatalog/unitycatalog:v0.6.0
    user: root
    entrypoint: ["chmod", "0777", "${UC_DOCS_ROOT:-/tmp/uc-docs}"]
    volumes:
      - *docs-root

  unitycatalog:
    image: unitycatalog/unitycatalog:v0.6.0
    # A fixed name lets `docker exec unitycatalog bin/uc` work from any folder.
    container_name: unitycatalog
    depends_on:
      init-storage:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./server.properties
        target: /home/unitycatalog/etc/conf/server.properties
        read_only: true
      - *docs-root
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://localhost:8080/api/2.1/unity-catalog/catalogs || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
