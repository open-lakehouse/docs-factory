# The default Unity Catalog docs server, generated by Trestle (envs/trestle.toml
# pins the revision): UC through the gateway on host :8080, metadata in the
# server's own H2 file (with the image's sample catalogs), and data on local
# paths under UC_DOCS_ROOT. Edit this file, then `just env-render unitycatalog`;
# never edit the rendered files.
version = 3

[selection]
modules = ["unity-catalog"]

[selection.knob_overrides.unity-catalog]
# No relational or object store: metadata is lost with the container.
embedded_metadata = "true"
# Built from image/ (the release image with the docs' local fixes); the tag
# follows content/unitycatalog/release.yml.
image = "uc-docs-unitycatalog:0.7.0"
build = "image"
# `docker exec unitycatalog bin/uc` works from any folder.
container_name = "unitycatalog"
# UC_DOCS_ROOT means the same directory to the server and to the reader.
extra_mounts = "${UC_DOCS_ROOT:-/tmp/uc-docs}:${UC_DOCS_ROOT:-/tmp/uc-docs}"
# Docker creates a missing UC_DOCS_ROOT as root; open it up so both you and the
# server can write there.
writable_mounts = "${UC_DOCS_ROOT:-/tmp/uc-docs}"

[selection.knob_overrides.envoy]
publish_admin = "false"

[context]
env_name = "uc-docs"
gateway_host_port = 8080
local_secrets = "inline"
