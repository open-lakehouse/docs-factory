# Local, single-user server against aws-sim. Authorization is disabled: never
# use this configuration for a shared server.
server.env=dev
server.authorization=disable

# The local stack isn't on AWS, so it passes the master identity's keys.
aws.masterRoleArn=arn:aws:iam::123456789012:role/uc-master
aws.accessKey=rustfs-root
aws.secretKey=rustfs-root-secret
aws.region=us-east-1
