[project]
name = "docs-factory-examples"
version = "0.1.0"
description = "Tested, copy/paste-runnable Delta Lake examples that the docs include via region markers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docs-factory-seed",
    "deltalake>=1.0",
    "pandas>=2",
    "polars>=1",
    "duckdb>=1",
]

[project.optional-dependencies]
# Spark pulls in a JVM toolchain; kept opt-in so the default `uv sync` stays light.
spark = [
    "pyspark>=3.5",
    "delta-spark>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The example modules are organized by engine directory, not a single package.
# They are imported in tests via the paths below rather than installed as a
# top-level package, so we ship the shared helper package only.
packages = ["src/docs_factory_examples"]
