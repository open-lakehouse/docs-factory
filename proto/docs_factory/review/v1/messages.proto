syntax = "proto3";

// The review & release lifecycle domain for docs-factory content (blog drafts
// and Diátaxis docs). The database is authoritative for everything defined here;
// git frontmatter carries only the orthogonal authoring `status` (`idea` /
// `draft` / `ready`), which is author intent — not review state. Content is
// shown to anonymous viewers only when its frontmatter is `ready` AND its
// review_state is RELEASED; allowlisted reviewers see everything.
package docs_factory.review.v1;

import "google/protobuf/timestamp.proto";

// Which content tree a piece of content lives in.
enum ContentArea {
  CONTENT_AREA_UNSPECIFIED = 0;
  // blogs/<slug>/index.md
  CONTENT_AREA_BLOGS = 1;
  // content/<project>/<bucket>/<slug>.md
  CONTENT_AREA_DOCS = 2;
}

// Stable reference to one piece of content. `project`/`bucket` are set only for
// docs; blogs are keyed by slug alone.
message ContentRef {
  ContentArea area = 1;
  string slug = 2;
  optional string project = 3;
  optional string bucket = 4;
}

// A rendered content version, identified by a content hash of the body. A new
// row is registered on each deploy whose body changed.
message ContentVersion {
  string id = 1;
  ContentRef ref = 2;
  // sha256 of the markdown body (frontmatter excluded).
  string content_hash = 3;
  string git_sha = 4;
  string title = 5;
  // The git frontmatter authoring status, copied for display only.
  string frontmatter_status = 6;
  google.protobuf.Timestamp created_at = 7;
  // Resolved `file=` snippet references in this version, for code re-anchoring.
  repeated SnippetRef snippets = 8;
}

// A heading-anchored section within a content version. `anchor_slug` is the
// rehype-slug id used in the rendered DOM; `fingerprint` is the normalized
// heading text used to re-anchor comments across versions. `text` is the
// normalized plain-text body of the section (heading excluded), stored so the
// server can re-anchor quote comments without re-fetching source.
message Section {
  string anchor_slug = 1;
  string fingerprint = 2;
  string heading_text = 3;
  int32 level = 4;
  int32 ordinal = 5;
  string text = 6;
  int32 char_len = 7;
}

// A W3C-style text-quote selector: a comment can pin to a quoted range within
// its enclosing section instead of the whole heading. `quote` is the exact
// selected text (normalized); `prefix`/`suffix` are a short window of context
// used to disambiguate and re-anchor. `start` is the resolved char offset of
// the quote within the section text — advisory only, recomputed on render.
message TextSelector {
  string quote = 1;
  string prefix = 2;
  string suffix = 3;
  int32 start = 4;
}

// A source-file anchor for a comment on a `file=` code snippet. Because a
// snippet resolves to verbatim git-tracked source, we anchor to the file, not
// the rendered DOM: `path` is repo-relative, `region` is the start=/end= marker
// name (empty if the fence inlined the whole file), `line`/`end_line` are 1-based
// within the source file, `line_hash` is a hash of the anchored line(s) used to
// re-anchor when the line moves, and `file_hash` records the source content at
// comment time for drift detection.
message CodeSelector {
  string path = 1;
  string region = 2;
  int32 line = 3;
  int32 end_line = 4;
  string line_hash = 5;
  string file_hash = 6;
}

// A resolved `file=` code snippet reference within a content version. Registered
// alongside sections so the server can re-anchor code comments (against the
// file/region/line-hash) without repo access at review time. Many refs can share
// one `path`; the full source text is registered once per path as a SourceFile.
message SnippetRef {
  string path = 1;
  string region = 2;
  int32 start_line = 3;
  int32 end_line = 4;
  string file_hash = 5;
}

// The full text of a snippet source file, registered once per unique `file=`
// path in a version. Stored so the server can re-anchor code comments by
// line-hash and serve the "open full source" review pane without repo access.
message SourceFile {
  string path = 1;
  string text = 2;
  string file_hash = 3;
}

// The reviewer-facing review/release state. Distinct from the git authoring
// `status`; RELEASED is a database action, never a frontmatter write.
enum ReviewState {
  REVIEW_STATE_UNSPECIFIED = 0;
  REVIEW_STATE_NONE = 1;
  REVIEW_STATE_IN_REVIEW = 2;
  REVIEW_STATE_CHANGES_REQUESTED = 3;
  REVIEW_STATE_APPROVED = 4;
  REVIEW_STATE_RELEASED = 5;
}

// Access role resolved from the reviewer allowlist.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Not on the allowlist; can see published content only.
  ROLE_ANONYMOUS = 1;
  ROLE_REVIEWER = 2;
  ROLE_MAINTAINER = 3;
}

// Whether a review request must be satisfied before the artifact can be
// released. A REQUIRED open request blocks ReleaseContent; OPTIONAL is advisory
// (a dashboard signal only).
enum Requirement {
  REQUIREMENT_UNSPECIFIED = 0;
  REQUIREMENT_REQUIRED = 1;
  REQUIREMENT_OPTIONAL = 2;
}

// Lifecycle of a single review request. A request is SATISFIED when the artifact
// reaches APPROVED (any allowlisted reviewer's approval satisfies all open
// requests on that artifact — there is no per-reviewer approval record).
enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  REQUEST_STATUS_OPEN = 1;
  REQUEST_STATUS_SATISFIED = 2;
  REQUEST_STATUS_CANCELLED = 3;
}

// A major lifecycle event recorded on an artifact, for the per-artifact review
// timeline. Frontmatter authoring changes are intentionally absent — those run
// through git/CI, not this app.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_REVIEW_REQUESTED = 1;
  EVENT_KIND_REQUEST_SATISFIED = 2;
  EVENT_KIND_REQUEST_CANCELLED = 3;
  EVENT_KIND_STATE_IN_REVIEW = 4;
  EVENT_KIND_STATE_CHANGES_REQUESTED = 5;
  EVENT_KIND_STATE_APPROVED = 6;
  EVENT_KIND_RELEASED = 7;
  EVENT_KIND_UNPUBLISHED = 8;
  EVENT_KIND_REPUBLISHED = 9;
}

// The current viewer, resolved from the auth provider (Neon Auth in prod, the
// mock provider locally).
message Viewer {
  bool authenticated = 1;
  optional string login = 2;
  Role role = 3;
  bool is_allowlisted = 4;
  // Stable Neon Auth user id — survives a GitHub login rename, so authorship
  // and read-state key on it rather than the mutable login. Display name is a
  // convenience for the UI (falls back to the login when absent).
  optional string user_id = 5;
  optional string name = 6;
}

// One comment. Thread roots have no `parent_id`. When the section a comment was
// written against disappears from a later version, `orphaned` is set true and
// the comment is retained (never deleted).
message Comment {
  string id = 1;
  ContentRef ref = 2;
  string anchor_slug = 3;
  string anchor_fingerprint = 4;
  optional string parent_id = 5;
  string author_login = 6;
  string body_md = 7;
  // Cached display-name snapshot at authoring time (see comment.author_name).
  // Absent for a tombstoned/erased author. The UI falls back to author_login,
  // and derives the avatar from the login (github.com/<login>.png).
  optional string author_name = 15;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp edited_at = 9;
  bool orphaned = 10;
  // At most one fine-grained selector. `selector` pins to a quoted prose range
  // within the section; `code_selector` pins to a line/region in a snippet's
  // source file. Absent for a plain heading-level comment (back-compatible).
  optional TextSelector selector = 11;
  optional CodeSelector code_selector = 12;
  // Frozen git provenance: the content_version this comment was written against.
  // `authored_version_id` is the version's opaque id; `authored_git_sha` is the
  // joined commit sha (what the UI shows). Both survive re-anchoring — unlike the
  // section anchor, they never move forward to a later version.
  optional string authored_version_id = 13;
  optional string authored_git_sha = 14;
}

// A thread root plus its replies and resolution state.
message Thread {
  Comment root = 1;
  repeated Comment replies = 2;
  bool resolved = 3;
  optional string resolved_by = 4;
  optional google.protobuf.Timestamp resolved_at = 5;
  // Read state for the current viewer: unread when any comment in the thread
  // was created after the viewer's seen-watermark (or the viewer never opened
  // it). unread_count is how many such comments there are. Both are false/0 for
  // an anonymous viewer (no read-state is kept).
  bool has_unread = 6;
  int32 unread_count = 7;
}

// A summary row for the drafts list.
message DraftSummary {
  ContentRef ref = 1;
  string title = 2;
  string frontmatter_status = 3;
  ReviewState review_state = 4;
  optional ContentVersion latest_version = 5;
  int32 open_comment_count = 6;
  // RevOps pipeline metadata (DB-authoritative, set from the review app — not
  // git frontmatter). `priority` is an ordered rank within the blog pipeline
  // (lower = higher priority; absent = unranked). `target_release_date` is the
  // intended ship date; date-only, carried at UTC midnight in the timestamp.
  optional int32 priority = 7;
  optional google.protobuf.Timestamp target_release_date = 8;
  // Number of open REQUIRED review requests on this content. Non-zero blocks
  // release (ReleaseContent throws) and is surfaced in the reviewer UI.
  int32 open_required_request_count = 9;
  // Whether the content is currently published (publicly visible). This is a
  // sticky latch on content_revops, decoupled from review_state: set true on
  // release, cleared only by an explicit unpublish. Anonymous visibility is
  // `frontmatter_status == "ready" AND published`.
  bool published = 10;
}

// One allowlist entry.
message AllowlistEntry {
  optional string github_login = 1;
  optional string email = 2;
  Role role = 3;
}

// A recent comment for the reviewer dashboard's "latest comments" feed. Carries
// the comment plus enough context to link back to where it lives: its content
// `ref` and `anchor_slug` (the rehype-slug heading id) resolve to a deep link
// (/docs/<project>/<bucket>/<slug>#<anchor_slug>), and `heading_text` gives a
// human-readable section label. `resolved` reflects the thread's current state so
// the feed can de-emphasize handled comments.
message RecentComment {
  Comment comment = 1;
  ContentRef ref = 2;
  string anchor_slug = 3;
  string heading_text = 4;
  bool resolved = 5;
  // The content title (from the latest version), for a friendlier row label than
  // the slug. Falls back to the slug on the client when empty.
  string content_title = 6;
}

// A request for a named reviewer to review one artifact. Reviewers are addressed
// by GitHub login (email fallback) matched against the reviewer allowlist — the
// allowlist has no stable user id, and a requested reviewer may not have logged
// in yet. "Requests to me" matches lower(reviewer_login) == lower(viewer.login).
message ReviewRequest {
  string id = 1;
  ContentRef ref = 2;
  // Whom the review is requested from. At least one of login/email is set.
  optional string reviewer_login = 3;
  optional string reviewer_email = 4;
  Requirement requirement = 5;
  RequestStatus status = 6;
  // Who opened the request (actor identity: user id or login).
  string requested_by = 7;
  string note = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp satisfied_at = 10;
}

// One entry in an artifact's review timeline. `kind` is the event type; `actor`
// is who caused it; state transitions carry from/to; request events carry the
// reviewer login. `note` is an optional human reason (transition/unpublish).
message ContentEvent {
  string id = 1;
  ContentRef ref = 2;
  EventKind kind = 3;
  string actor = 4;
  string note = 5;
  optional ReviewState from_state = 6;
  optional ReviewState to_state = 7;
  optional string reviewer_login = 8;
  google.protobuf.Timestamp created_at = 9;
}
