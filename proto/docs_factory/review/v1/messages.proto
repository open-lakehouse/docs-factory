syntax = "proto3";

// The review & release lifecycle domain for docs-factory content (blog drafts
// and Diátaxis docs). The database is authoritative for everything defined here;
// git frontmatter carries only the orthogonal authoring `status` (`idea` /
// `draft` / `ready`), which is author intent — not review state. Content is
// shown to anonymous viewers only when its frontmatter is `ready` AND its
// review_state is RELEASED; allowlisted reviewers see everything.
package docs_factory.review.v1;

import "google/protobuf/timestamp.proto";

// Which content tree a piece of content lives in.
enum ContentArea {
  CONTENT_AREA_UNSPECIFIED = 0;
  // blogs/<slug>/index.md
  CONTENT_AREA_BLOGS = 1;
  // content/<project>/<bucket>/<slug>.md
  CONTENT_AREA_DOCS = 2;
}

// Stable reference to one piece of content. `project`/`bucket` are set only for
// docs; blogs are keyed by slug alone.
message ContentRef {
  ContentArea area = 1;
  string slug = 2;
  optional string project = 3;
  optional string bucket = 4;
}

// A rendered content version, identified by a content hash of the body. A new
// row is registered on each deploy whose body changed.
message ContentVersion {
  string id = 1;
  ContentRef ref = 2;
  // sha256 of the markdown body (frontmatter excluded).
  string content_hash = 3;
  string git_sha = 4;
  string title = 5;
  // The git frontmatter authoring status, copied for display only.
  string frontmatter_status = 6;
  google.protobuf.Timestamp created_at = 7;
  // Resolved `file=` snippet references in this version, for code re-anchoring.
  repeated SnippetRef snippets = 8;
  // Root hash of the structural Merkle tree (sha256 over the heading/prose/code/
  // snippet node tree). DIFFERENT question than content_hash: "this structure"
  // vs "these bytes". Two bodies that normalize identically share a root_hash but
  // differ in content_hash (whitespace-only edits still register a version).
  string root_hash = 9;
  // Canonical product/topic ids (content/vocab.json `topics`), normalized from
  // blog tags + doc project. Powers the "what changed for Delta / UC / DuckDB"
  // rollup via ProductChanges. Empty for untagged content.
  repeated string topics = 10;
  // The full Merkle tree, INCLUDING non-section leaves (code blocks, snippet
  // sources). Omitted from list responses for bandwidth; returned by
  // GetVersionTree. See MerkleNode.
  optional MerkleNode tree = 11;
}

// A heading-anchored section within a content version. `anchor_slug` is the
// rehype-slug id used in the rendered DOM; `fingerprint` is the normalized
// heading text used to re-anchor comments across versions. `text` is the
// normalized plain-text body of the section (heading excluded), stored so the
// server can re-anchor quote comments without re-fetching source.
message Section {
  string anchor_slug = 1;
  string fingerprint = 2;
  string heading_text = 3;
  int32 level = 4;
  int32 ordinal = 5;
  string text = 6;
  int32 char_len = 7;
  // Merkle: this section's own-content hash (its prose leaf, direct body only).
  string node_hash = 8;
  // Merkle: hash of this section incl. all descendants (subsections + code +
  // snippets). Equal across versions ⇒ nothing under this heading changed
  // (drives the diff view + the re-anchoring fast path).
  string subtree_hash = 9;
  // The enclosing heading's anchor_slug (empty for top-level / preamble) — the
  // tree edge.
  string parent_anchor_slug = 10;
  // Materialized fingerprint path (e.g. "intro/setup/install") — the STABLE diff
  // key that survives reordering so a moved section reads as a move, not add+remove.
  string depth_path = 11;
}

// A node in a content version's structural Merkle tree. Recursive. `kind` is one
// of "doc" | "heading" | "prose" | "code" | "snippet". `node_hash` is the node's
// own content; `subtree_hash` folds in all descendants (equal for leaves).
// `key` is the stable diff key (depth path for headings, synthetic for leaves).
message MerkleNode {
  string key = 1;
  string kind = 2;
  string node_hash = 3;
  string subtree_hash = 4;
  int32 level = 5;
  string label = 6;
  repeated MerkleNode children = 7;
  optional string anchor_slug = 8;
  optional string snippet_path = 9;
  optional string snippet_region = 10;
}

// A W3C-style text-quote selector: a comment can pin to a quoted range within
// its enclosing section instead of the whole heading. `quote` is the exact
// selected text (normalized); `prefix`/`suffix` are a short window of context
// used to disambiguate and re-anchor. `start` is the resolved char offset of
// the quote within the section text — advisory only, recomputed on render.
message TextSelector {
  string quote = 1;
  string prefix = 2;
  string suffix = 3;
  int32 start = 4;
}

// A source-file anchor for a comment on a `file=` code snippet. Because a
// snippet resolves to verbatim git-tracked source, we anchor to the file, not
// the rendered DOM: `path` is repo-relative, `region` is the start=/end= marker
// name (empty if the fence inlined the whole file), `line`/`end_line` are 1-based
// within the source file, `line_hash` is a hash of the anchored line(s) used to
// re-anchor when the line moves, and `file_hash` records the source content at
// comment time for drift detection.
message CodeSelector {
  string path = 1;
  string region = 2;
  int32 line = 3;
  int32 end_line = 4;
  string line_hash = 5;
  string file_hash = 6;
}

// A resolved `file=` code snippet reference within a content version. Registered
// alongside sections so the server can re-anchor code comments (against the
// file/region/line-hash) without repo access at review time. Many refs can share
// one `path`; the full source text is registered once per path as a SourceFile.
message SnippetRef {
  string path = 1;
  string region = 2;
  int32 start_line = 3;
  int32 end_line = 4;
  string file_hash = 5;
}

// The full text of a snippet source file, registered once per unique `file=`
// path in a version. Stored so the server can re-anchor code comments by
// line-hash and serve the "open full source" review pane without repo access.
message SourceFile {
  string path = 1;
  string text = 2;
  string file_hash = 3;
}

// The reviewer-facing review/release state. Distinct from the git authoring
// `status`; RELEASED is a database action, never a frontmatter write.
//
// This is the *effective* state the UI shows, and it is mostly DERIVED, not
// stored (see deriveReviewState on the server):
//   - NEEDS_REVIEW is derived from frontmatter `ready` with no terminal outcome —
//     there is no manual "start review" step, and it is never stored.
//   - APPROVED is normally derived from recorded per-reviewer Approvals meeting
//     the artifact's preconditions (a maintainer may also force it explicitly).
//   - Only CHANGES_REQUESTED, RELEASED, and the maintainer APPROVED override are
//     persisted as explicit outcomes; NONE and NEEDS_REVIEW are never stored.
// Enum numbers are stable across this rename (2 was formerly IN_REVIEW).
enum ReviewState {
  REVIEW_STATE_UNSPECIFIED = 0;
  REVIEW_STATE_NONE = 1;
  // Derived: frontmatter is `ready` and no terminal outcome/approval applies yet.
  REVIEW_STATE_NEEDS_REVIEW = 2;
  REVIEW_STATE_CHANGES_REQUESTED = 3;
  REVIEW_STATE_APPROVED = 4;
  REVIEW_STATE_RELEASED = 5;
}

// Access role resolved from the reviewer allowlist.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Not on the allowlist; can see published content only.
  ROLE_ANONYMOUS = 1;
  ROLE_REVIEWER = 2;
  ROLE_MAINTAINER = 3;
}

// Whether a review request must be satisfied before the artifact can be
// released. A REQUIRED open request blocks ReleaseContent; OPTIONAL is advisory
// (a dashboard signal only).
enum Requirement {
  REQUIREMENT_UNSPECIFIED = 0;
  REQUIREMENT_REQUIRED = 1;
  REQUIREMENT_OPTIONAL = 2;
}

// Lifecycle of a single review request. Satisfaction is per-reviewer: a request
// is SATISFIED when the reviewer it names records an Approval on the artifact.
// (A required, still-OPEN request blocks release and keeps the derived state at
// NEEDS_REVIEW until that specific reviewer approves.)
enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  REQUEST_STATUS_OPEN = 1;
  REQUEST_STATUS_SATISFIED = 2;
  REQUEST_STATUS_CANCELLED = 3;
}

// A major lifecycle event recorded on an artifact, for the per-artifact review
// timeline. Frontmatter authoring changes are intentionally absent — those run
// through git/CI, not this app.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_REVIEW_REQUESTED = 1;
  EVENT_KIND_REQUEST_SATISFIED = 2;
  EVENT_KIND_REQUEST_CANCELLED = 3;
  // Vestigial: the manual "in review" transition no longer exists (NEEDS_REVIEW
  // is derived), so this is never emitted. The number is retained, not reused.
  EVENT_KIND_STATE_IN_REVIEW = 4;
  EVENT_KIND_STATE_CHANGES_REQUESTED = 5;
  // A maintainer forced the explicit APPROVED override (distinct from APPROVED,
  // which records one reviewer's approval).
  EVENT_KIND_STATE_APPROVED = 6;
  EVENT_KIND_RELEASED = 7;
  EVENT_KIND_UNPUBLISHED = 8;
  EVENT_KIND_REPUBLISHED = 9;
  // A specific reviewer recorded an approval (payload carries reviewer_login).
  EVENT_KIND_APPROVED = 10;
  // An approval was dismissed (by its author or a maintainer).
  EVENT_KIND_APPROVAL_DISMISSED = 11;
  // A new content version was registered whose Merkle root differs from the
  // prior one — i.e. the content structurally changed. Payload carries the
  // added/removed/modified/moved node counts.
  EVENT_KIND_CONTENT_REVISED = 12;
}

// The current viewer, resolved from the auth provider (Neon Auth in prod, the
// mock provider locally).
message Viewer {
  bool authenticated = 1;
  optional string login = 2;
  Role role = 3;
  bool is_allowlisted = 4;
  // Stable Neon Auth user id — survives a GitHub login rename, so authorship
  // and read-state key on it rather than the mutable login. Display name is a
  // convenience for the UI (falls back to the login when absent).
  optional string user_id = 5;
  optional string name = 6;
  // Site admin, sourced from Neon Auth (Better Auth admin plugin): the
  // neon_auth."user".role column contains 'admin' (comma-separated membership,
  // not equality). Orthogonal to Role — a site admin is elevated to at least
  // MAINTAINER and is_allowlisted, and this flag additionally gates the admin
  // panel + allowlist management. Persists across app DB drops because
  // neon_auth is Neon-managed, not part of our migrations.
  bool is_site_admin = 7;
  // True when the viewer holds at least one scoped content grant — a
  // non-cancelled review_request addressed to them — despite NOT being on the
  // reviewer allowlist. It lets the site-wide AccessGate admit an external
  // contributor to the specific content shared with them without granting
  // site-wide reviewer access. Orthogonal to is_allowlisted (which stays false
  // for an external): per-item authorization on the server remains the source
  // of truth; this is only the client-side admission signal.
  bool has_scoped_grants = 8;
}

// One comment. Thread roots have no `parent_id`. When the section a comment was
// written against disappears from a later version, `orphaned` is set true and
// the comment is retained (never deleted).
message Comment {
  string id = 1;
  ContentRef ref = 2;
  string anchor_slug = 3;
  string anchor_fingerprint = 4;
  optional string parent_id = 5;
  string author_login = 6;
  string body_md = 7;
  // Cached display-name snapshot at authoring time (see comment.author_name).
  // Absent for a tombstoned/erased author. The UI falls back to author_login,
  // and derives the avatar from the login (github.com/<login>.png).
  optional string author_name = 15;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp edited_at = 9;
  bool orphaned = 10;
  // At most one fine-grained selector. `selector` pins to a quoted prose range
  // within the section; `code_selector` pins to a line/region in a snippet's
  // source file. Absent for a plain heading-level comment (back-compatible).
  optional TextSelector selector = 11;
  optional CodeSelector code_selector = 12;
  // Frozen git provenance: the content_version this comment was written against.
  // `authored_version_id` is the version's opaque id; `authored_git_sha` is the
  // joined commit sha (what the UI shows). Both survive re-anchoring — unlike the
  // section anchor, they never move forward to a later version.
  optional string authored_version_id = 13;
  optional string authored_git_sha = 14;
}

// A thread root plus its replies and resolution state.
message Thread {
  Comment root = 1;
  repeated Comment replies = 2;
  bool resolved = 3;
  optional string resolved_by = 4;
  optional google.protobuf.Timestamp resolved_at = 5;
  // Read state for the current viewer: unread when any comment in the thread
  // was created after the viewer's seen-watermark (or the viewer never opened
  // it). unread_count is how many such comments there are. Both are false/0 for
  // an anonymous viewer (no read-state is kept).
  bool has_unread = 6;
  int32 unread_count = 7;
}

// A summary row for the drafts list.
message DraftSummary {
  ContentRef ref = 1;
  string title = 2;
  string frontmatter_status = 3;
  ReviewState review_state = 4;
  optional ContentVersion latest_version = 5;
  int32 open_comment_count = 6;
  // RevOps pipeline metadata (DB-authoritative, set from the review app — not
  // git frontmatter). `priority` is an ordered rank within the blog pipeline
  // (lower = higher priority; absent = unranked). `target_release_date` is the
  // intended ship date; date-only, carried at UTC midnight in the timestamp.
  optional int32 priority = 7;
  optional google.protobuf.Timestamp target_release_date = 8;
  // Number of open REQUIRED review requests on this content — i.e. required
  // reviewers who have not yet approved (satisfaction is per-reviewer). Non-zero
  // blocks release (ReleaseContent throws) and keeps the derived state at
  // NEEDS_REVIEW; surfaced in the reviewer UI.
  int32 open_required_request_count = 9;
  // Whether the content is currently published (publicly visible). This is a
  // sticky latch on content_revops, decoupled from review_state: set true on
  // release, cleared only by an explicit unpublish. Anonymous visibility is
  // `frontmatter_status == "ready" AND published`.
  bool published = 10;
  // Active (non-dismissed) approvals on this content — the "approved by whom".
  repeated Approval approvals = 11;
  // Resolved display logins of required reviewers whose approval is still
  // pending (the open required requests). Drives the "required: A, B still
  // pending" UI. Keyed internally on user_id; these are the joined display
  // handles (a reviewer with no resolved handle appears by name/user id).
  repeated string pending_required_logins = 12;
  // Convenience mirror of `review_state == NEEDS_REVIEW`, so the client need not
  // re-derive it.
  bool needs_review = 13;
}

// A registered user, keyed by the stable Neon Auth user id, with resolved
// display attributes. The result shape of SearchUsers and the identity carried
// by the reviewer/allowlist pickers. github_login/name/email are display+search
// attributes (may be absent until a login resolves them); `role` is the user's
// current allowlist role (ANONYMOUS = registered but not allowlisted).
message UserSummary {
  string user_id = 1;
  optional string github_login = 2;
  optional string name = 3;
  optional string email = 4;
  optional string avatar_url = 5;
  Role role = 6;
}

// The write shape for ManageAllowlist: grant/adjust a role for a REGISTERED
// user, addressed by their stable user id (they must have a user_identity row).
message AllowlistEntry {
  string user_id = 1;
  Role role = 3;
  reserved 2;  // was `email` (allowlist is no longer email-keyed)
}

// A reviewer_allowlist row with resolved display attributes + audit metadata,
// for the maintainer admin list view. Keyed by user_id (also the row key now
// that the allowlist PK is the user id). github_login/email/name come from the
// user_identity join and are display-only.
message AllowlistEntryDetail {
  string user_id = 1;
  optional string github_login = 2;
  optional string email = 3;
  Role role = 4;
  optional string added_by = 5;
  google.protobuf.Timestamp created_at = 6;
  optional string name = 7;
}

// A person who has logged in (has a user_identity row), joined to their current
// allowlist role — the input to the admin "who has logged in" discovery view.
// `github_login` is the resolved @handle (absent if never resolved). `role` is
// ANONYMOUS for a logged-in user who is not on the allowlist ("no status").
// `last_seen_at` is a best-effort activity signal (user_identity.updated_at).
message RegisteredUser {
  string user_id = 1;
  optional string github_login = 2;
  optional string email = 3;
  Role role = 4;
  optional google.protobuf.Timestamp last_seen_at = 5;
  optional string name = 6;
}

// A recent comment for the reviewer dashboard's "latest comments" feed. Carries
// the comment plus enough context to link back to where it lives: its content
// `ref` and `anchor_slug` (the rehype-slug heading id) resolve to a deep link
// (/docs/<project>/<bucket>/<slug>#<anchor_slug>), and `heading_text` gives a
// human-readable section label. `resolved` reflects the thread's current state so
// the feed can de-emphasize handled comments.
message RecentComment {
  Comment comment = 1;
  ContentRef ref = 2;
  string anchor_slug = 3;
  string heading_text = 4;
  bool resolved = 5;
  // The content title (from the latest version), for a friendlier row label than
  // the slug. Falls back to the slug on the client when empty.
  string content_title = 6;
}

// A request for a registered reviewer to review one artifact. Reviewers are
// addressed by their stable user id (reviewer_user_id), so "requests to me" is
// an exact reviewer_user_id == viewer.user_id and a GitHub rename never breaks
// it. reviewer_login / reviewer_name are resolved display fields from the
// user_identity join.
message ReviewRequest {
  string id = 1;
  ContentRef ref = 2;
  // Whom the review is requested from (stable Neon Auth user id).
  string reviewer_user_id = 3;
  Requirement requirement = 5;
  RequestStatus status = 6;
  // Who opened the request (actor user id).
  string requested_by = 7;
  string note = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp satisfied_at = 10;
  // Resolved display attributes of the reviewer (from user_identity).
  optional string reviewer_login = 11;
  optional string reviewer_name = 12;
  reserved 4;  // was `reviewer_email` (requests are no longer email-addressed)
}

// One reviewer's approval of an artifact. Approvals are per-reviewer and
// artifact-level: they persist across content versions (an edit is normally a
// response to review, not a regression, so a new version does not invalidate a
// prior approval). `version_id` records the version the approval was made
// against for provenance/display only — it is never used to invalidate the
// approval. "Approved by whom" is the set of active (non-dismissed) approvals.
message Approval {
  string id = 1;
  ContentRef ref = 2;
  // Resolved display login of the approver (from user_identity); may be absent
  // if the handle was never resolved.
  optional string approver_login = 3;
  // Stable Neon Auth user id — the approval's key.
  string approver_user_id = 4;
  // The content_version this approval was recorded against — provenance only.
  optional string version_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

// One entry in an artifact's review timeline. `kind` is the event type; `actor`
// is who caused it; state transitions carry from/to; request events carry the
// reviewer login. `note` is an optional human reason (transition/unpublish).
message ContentEvent {
  string id = 1;
  ContentRef ref = 2;
  EventKind kind = 3;
  string actor = 4;
  string note = 5;
  optional ReviewState from_state = 6;
  optional ReviewState to_state = 7;
  optional string reviewer_login = 8;
  google.protobuf.Timestamp created_at = 9;
}
