syntax = "proto3";

package docs_factory.review.v1;

import "docs_factory/review/v1/messages.proto";
import "google/protobuf/timestamp.proto";

// The review & release API, served over Connect from the Neon Function and
// called from the React SPA (connect-web + connect-query).
//
// Authorization (enforced server-side per method):
//   - published-content reads: public
//   - unpublished-content reads + all writes: allowlisted reviewers
//   - release + allowlist management: maintainers
//   - RegisterVersion: build-time only, guarded by a GitHub Actions OIDC token
//     in the Authorization header (repo + environment pinned), not viewer auth
service ReviewService {
  // Resolve the current viewer (identity + role). Drives client UI gating and
  // the local dev impersonation switcher.
  rpc GetViewer(GetViewerRequest) returns (GetViewerResponse);

  // List content with review state + open-comment counts. Unpublished entries
  // are included only for allowlisted viewers.
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);

  // Fetch the rendered body of unpublished content (allowlist-gated). Published
  // content is served statically and does not use this.
  rpc GetDraftContent(GetDraftContentRequest) returns (GetDraftContentResponse);

  // Threads (roots + replies + resolution) for a content ref, plus orphaned
  // threads whose section no longer exists in the latest version.
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);

  // Most-recent comments across all content, for the reviewer dashboard's
  // "latest comments" feed. Allowlist-gated; each entry links back to its
  // content + heading anchor.
  rpc ListRecentComments(ListRecentCommentsRequest) returns (ListRecentCommentsResponse);

  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc ResolveThread(ResolveThreadRequest) returns (ResolveThreadResponse);
  rpc UnresolveThread(UnresolveThreadRequest) returns (UnresolveThreadResponse);

  // Mark a thread read by the current viewer up to `seen_at` (defaults to now).
  // Clears the thread's unread indicator for that viewer.
  rpc MarkThreadSeen(MarkThreadSeenRequest) returns (MarkThreadSeenResponse);

  // Fetch the full source text of a registered `file=` snippet, for the
  // "open full source" code-review pane (allowlist-gated). Returns the whole
  // file plus its resolved snippet regions so reviewers can comment on any line.
  rpc GetSourceFile(GetSourceFileRequest) returns (GetSourceFileResponse);

  // Record an explicit review-state OUTCOME (validated against the state
  // machine). Only the explicit outcomes are accepted: CHANGES_REQUESTED,
  // RELEASED, and the maintainer APPROVED override. NEEDS_REVIEW and NONE are
  // derived and cannot be set here; ordinary approvals go through RecordApproval.
  rpc TransitionReview(TransitionReviewRequest) returns (TransitionReviewResponse);
  // Maintainer-only convenience for the terminal RELEASED transition.
  rpc ReleaseContent(ReleaseContentRequest) returns (ReleaseContentResponse);

  // Record the current viewer's approval of an artifact (allowlist-gated,
  // idempotent). Satisfies any open REQUIRED request addressed to that reviewer.
  // Once the artifact's approval preconditions are met it derives to APPROVED —
  // there is no manual transition. Returns the refreshed summary.
  rpc RecordApproval(RecordApprovalRequest) returns (RecordApprovalResponse);
  // Dismiss an approval. A reviewer may dismiss their own; a maintainer may
  // dismiss anyone's (via `approver_login`). Returns the refreshed summary.
  rpc DismissApproval(DismissApprovalRequest) returns (DismissApprovalResponse);

  // RevOps pipeline: set a content item's ordered priority (allowlist-gated).
  // Absent priority clears the rank. Returns the refreshed summary row.
  rpc SetPriority(SetPriorityRequest) returns (SetPriorityResponse);
  // RevOps pipeline: set (or clear) a content item's target release date
  // (allowlist-gated). Absent date clears it. Returns the refreshed summary row.
  rpc SetTargetReleaseDate(SetTargetReleaseDateRequest) returns (SetTargetReleaseDateResponse);

  // Request a review of one artifact from one or more allowlisted reviewers,
  // each REQUIRED or OPTIONAL. Allowlist-gated. Every reviewer must be on the
  // allowlist (by login or email). Returns the created requests.
  rpc RequestReview(RequestReviewRequest) returns (RequestReviewResponse);
  // Cancel an open review request (requester or maintainer). Returns the
  // updated request.
  rpc CancelReviewRequest(CancelReviewRequestRequest) returns (CancelReviewRequestResponse);
  // List review requests, optionally scoped to one artifact or to the current
  // viewer's inbox (`mine`). Allowlist-gated.
  rpc ListReviewRequests(ListReviewRequestsRequest) returns (ListReviewRequestsResponse);
  // The review timeline for one artifact (most-recent first). Allowlist-gated.
  rpc ListContentEvents(ListContentEventsRequest) returns (ListContentEventsResponse);
  // Reopen a released artifact to request changes (the terminal RELEASED state
  // is otherwise closed). Maintainer-only. Transitions released -> changes-
  // requested and, when `unpublish` is set, also clears the published latch so
  // the artifact drops out of anonymous view (DB-only; no git write).
  rpc RequestChangesOnPublished(RequestChangesOnPublishedRequest)
      returns (RequestChangesOnPublishedResponse);

  // Maintainer-only allowlist management.
  rpc ManageAllowlist(ManageAllowlistRequest) returns (ManageAllowlistResponse);

  // Maintainer-only: read the reviewer allowlist (with audit metadata) without
  // mutating it. Today the only way to see the list is as a side effect of
  // ManageAllowlist; this powers the admin roster view.
  rpc ListAllowlist(ListAllowlistRequest) returns (ListAllowlistResponse);

  // Maintainer-only: everyone who has authenticated via GitHub OAuth (from
  // neon_auth), joined to their resolved allowlist role (ANONYMOUS = "no
  // status"). Lets a maintainer discover people who logged in but never got a
  // status and grant them access. Reads the auth provider's tables directly, so
  // it is only meaningful against a real Neon Auth database.
  rpc ListRegisteredUsers(ListRegisteredUsersRequest) returns (ListRegisteredUsersResponse);

  // Allowlisted-scoped typeahead over registered users (our user_identity
  // table), for the reviewer/allowlist pickers. Unlike ListRegisteredUsers
  // (maintainer-only, reads neon_auth audit data), this is visible to any
  // allowlisted reviewer and returns only lean UserSummary rows matching the
  // query on login/name/email.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);

  // Maintainer-only right-to-erasure. Removes a user's personal footprint —
  // tombstones their authored comments (keeping thread structure), scrubs their
  // identity from review-state and resolution actors, and deletes their
  // read-state. Content-version provenance (git shas) is not personal data and
  // is untouched.
  rpc EraseUser(EraseUserRequest) returns (EraseUserResponse);

  // Build-time upsert of a content version + its sections; re-anchors open
  // threads. Guarded by a GitHub Actions OIDC token in the Authorization header
  // (see server/src/auth/github-oidc.ts), not by viewer auth.
  rpc RegisterVersion(RegisterVersionRequest) returns (RegisterVersionResponse);

  // The version history of one artifact, most-recent first (no trees — cheap
  // list). Allowlist-gated. Powers the version picker in the evolution view.
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  // One version's full Merkle tree, for rendering + client-side diffing.
  // Allowlist-gated.
  rpc GetVersionTree(GetVersionTreeRequest) returns (GetVersionTreeResponse);
  // "What changed for <topic>?" — across every artifact tagged with a product/
  // topic id, diff each artifact's latest version against its baseline at/just
  // before `since`, returning the changed nodes + open-comment counts.
  // Allowlist-gated.
  rpc ProductChanges(ProductChangesRequest) returns (ProductChangesResponse);
}

message GetViewerRequest {}
message GetViewerResponse {
  Viewer viewer = 1;
}

message ListDraftsRequest {
  // When set, restrict to one area.
  optional ContentArea area = 1;
  // When true, order by RevOps priority (ranked first, unranked last) instead
  // of the default area/path ordering. Drives the pipeline view.
  optional bool order_by_priority = 2;
}
message ListDraftsResponse {
  repeated DraftSummary drafts = 1;
}

message GetDraftContentRequest {
  ContentRef ref = 1;
}
message GetDraftContentResponse {
  // Rendered HTML body of the draft.
  string html = 1;
  ContentVersion version = 2;
}

message ListCommentsRequest {
  ContentRef ref = 1;
}
message ListCommentsResponse {
  // Threads anchored to sections present in the latest version.
  repeated Thread threads = 1;
  // Threads whose section no longer exists (shown but not lost).
  repeated Thread orphaned_threads = 2;
}

message ListRecentCommentsRequest {
  // Max comments to return (server clamps; defaults to a modest page).
  optional int32 limit = 1;
  // When set, restrict to one area.
  optional ContentArea area = 2;
}
message ListRecentCommentsResponse {
  // Most-recent first.
  repeated RecentComment comments = 1;
}

message CreateCommentRequest {
  ContentRef ref = 1;
  string anchor_slug = 2;
  string anchor_fingerprint = 3;
  // Set when replying within a thread.
  optional string parent_id = 4;
  string body_md = 5;
  // At most one fine-grained selector. Absent for a heading-level comment.
  optional TextSelector selector = 6;
  optional CodeSelector code_selector = 7;
}
message CreateCommentResponse {
  Comment comment = 1;
}

message GetSourceFileRequest {
  ContentRef ref = 1;
  // Repo-relative source path of a registered snippet in the latest version.
  string path = 2;
}
message GetSourceFileResponse {
  string path = 1;
  // Full source file text.
  string text = 2;
  string file_hash = 3;
  // The resolved snippet regions that reference this file (for highlighting the
  // in-doc window within the full source).
  repeated SnippetRef snippets = 4;
}

message ResolveThreadRequest {
  string thread_root_id = 1;
}
message ResolveThreadResponse {
  Thread thread = 1;
}

message UnresolveThreadRequest {
  string thread_root_id = 1;
}
message UnresolveThreadResponse {
  Thread thread = 1;
}

message MarkThreadSeenRequest {
  string thread_root_id = 1;
  // Watermark; defaults to the server's now() when unset.
  optional google.protobuf.Timestamp seen_at = 2;
}
message MarkThreadSeenResponse {}

message TransitionReviewRequest {
  ContentRef ref = 1;
  ReviewState to_state = 2;
  optional string note = 3;
}
message TransitionReviewResponse {
  ReviewState state = 1;
}

message ReleaseContentRequest {
  ContentRef ref = 1;
  optional string note = 2;
}
message ReleaseContentResponse {
  ReviewState state = 1;
}

message RecordApprovalRequest {
  ContentRef ref = 1;
}
message RecordApprovalResponse {
  DraftSummary draft = 1;
}

message DismissApprovalRequest {
  ContentRef ref = 1;
  // Whose approval to dismiss (by stable user id). Omitted = the current
  // viewer's own approval; set = a maintainer dismissing that reviewer's.
  optional string approver_user_id = 2;
}
message DismissApprovalResponse {
  DraftSummary draft = 1;
}

message SetPriorityRequest {
  ContentRef ref = 1;
  // Ordered rank (lower = higher priority). Absent clears the rank.
  optional int32 priority = 2;
}
message SetPriorityResponse {
  DraftSummary draft = 1;
}

message SetTargetReleaseDateRequest {
  ContentRef ref = 1;
  // Target ship date, date-only at UTC midnight. Absent clears the date.
  optional google.protobuf.Timestamp target_release_date = 2;
}
message SetTargetReleaseDateResponse {
  DraftSummary draft = 1;
}

// One reviewer to request a review from, addressed by their stable user id. The
// user must be REGISTERED (have a user_identity row) and on the allowlist.
message ReviewerTarget {
  string user_id = 1;
  reserved 2;  // was `email`
}

message RequestReviewRequest {
  ContentRef ref = 1;
  repeated ReviewerTarget reviewers = 2;
  Requirement requirement = 3;
  optional string note = 4;
}
message RequestReviewResponse {
  repeated ReviewRequest requests = 1;
}

message CancelReviewRequestRequest {
  string request_id = 1;
}
message CancelReviewRequestResponse {
  ReviewRequest request = 1;
}

message ListReviewRequestsRequest {
  // Scope to one artifact when set.
  optional ContentRef ref = 1;
  // When true, only requests addressed to the current viewer.
  optional bool mine = 2;
  // When true, only requests opened by the current viewer.
  optional bool by_me = 3;
  // When true, only OPEN requests (default returns all statuses).
  optional bool open_only = 4;
}
message ListReviewRequestsResponse {
  repeated ReviewRequest requests = 1;
}

message ListContentEventsRequest {
  ContentRef ref = 1;
  // Max events (server clamps; defaults to a modest page).
  optional int32 limit = 2;
}
message ListContentEventsResponse {
  // Most-recent first.
  repeated ContentEvent events = 1;
}

message RequestChangesOnPublishedRequest {
  ContentRef ref = 1;
  optional string note = 2;
  // When true, also unpublish (hide) the artifact. Default keeps it visible.
  bool unpublish = 3;
}
message RequestChangesOnPublishedResponse {
  ReviewState state = 1;
  bool published = 2;
}

message ManageAllowlistRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_ADD = 1;
    ACTION_REMOVE = 2;
  }
  Action action = 1;
  AllowlistEntry entry = 2;
}
message ManageAllowlistResponse {
  repeated AllowlistEntry entries = 1;
}

message ListAllowlistRequest {}
message ListAllowlistResponse {
  repeated AllowlistEntryDetail entries = 1;
}

message ListRegisteredUsersRequest {}
message ListRegisteredUsersResponse {
  repeated RegisteredUser users = 1;
}

message SearchUsersRequest {
  // Typeahead query, matched (case-insensitive) against github_login, name, and
  // email. Empty returns the first page of registered users.
  string query = 1;
  // Max results (server clamps; defaults to a modest page).
  optional int32 limit = 2;
  // When true, restrict to allowlisted users (role != ANONYMOUS) — used by the
  // reviewer-request picker, which can only target allowlisted reviewers.
  optional bool allowlisted_only = 3;
}
message SearchUsersResponse {
  repeated UserSummary users = 1;
}

message EraseUserRequest {
  // Identify the user by stable user id and/or GitHub login. At least one is
  // required; both are matched so a rename doesn't leave a partial footprint.
  optional string user_id = 1;
  optional string login = 2;
}
message EraseUserResponse {
  // How many rows were tombstoned/scrubbed/deleted, for the audit trail.
  int32 comments_tombstoned = 1;
  int32 review_states_scrubbed = 2;
  int32 resolutions_scrubbed = 3;
  int32 seen_rows_deleted = 4;
  // Open review requests addressed to the erased login, cancelled so they can
  // no longer block release (only the erased reviewer could ever satisfy them).
  int32 requests_cancelled = 5;
}

message RegisterVersionRequest {
  // Field 1 was `build_secret` — the build now authenticates with a GitHub
  // Actions OIDC token in the Authorization header, not a body-carried secret.
  reserved 1;
  reserved "build_secret";
  ContentRef ref = 2;
  string content_hash = 3;
  string git_sha = 4;
  string title = 5;
  string frontmatter_status = 6;
  repeated Section sections = 7;
  // Resolved `file=` snippet references, for code comment re-anchoring.
  repeated SnippetRef snippets = 8;
  // Full source text per unique snippet path (for line-hash re-anchoring and the
  // full-source review pane).
  repeated SourceFile source_files = 9;
  // Merkle root hash of this version's structure (sections already carry their
  // per-node hashes; this is the doc root).
  string root_hash = 10;
  // The full Merkle tree (persisted as the merkle_tree jsonb blob).
  optional MerkleNode tree = 11;
  // Canonical product/topic ids for the "what changed for X" rollup.
  repeated string topics = 12;
}
message RegisterVersionResponse {
  ContentVersion version = 1;
  // Threads that could not be re-anchored to a section in this version.
  int32 orphaned_thread_count = 2;
}

message ListVersionsRequest {
  ContentRef ref = 1;
  // Max versions (server clamps; defaults to a modest page).
  optional int32 limit = 2;
}
message ListVersionsResponse {
  // Most-recent first. Trees omitted (call GetVersionTree for one).
  repeated ContentVersion versions = 1;
}

message GetVersionTreeRequest {
  // The content version id (from ContentVersion.id / ListVersions).
  string version_id = 1;
}
message GetVersionTreeResponse {
  ContentVersion version = 1;
  // The full Merkle tree of that version (also on version.tree).
  optional MerkleNode tree = 2;
}

// The classification of one node when diffing two version trees.
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_REMOVED = 2;
  // This node's OWN content changed.
  CHANGE_KIND_MODIFIED = 3;
  // Only a descendant changed (own content identical).
  CHANGE_KIND_MODIFIED_DESCENDANTS = 4;
  // Same node, different position/parent.
  CHANGE_KIND_MOVED = 5;
}

// One changed node in a document's diff between two versions.
message ChangedNode {
  string key = 1;
  string kind = 2; // MerkleNode.kind: doc|heading|prose|code|snippet
  ChangeKind change = 3;
  string label = 4;
  optional string anchor_slug = 5;
}

// Per-document entry in a product rollup: its latest version, what changed since
// the baseline, and how many open comments sit on changed sections.
message ProductChangeEntry {
  ContentRef ref = 1;
  string title = 2;
  string latest_git_sha = 3;
  string latest_version_id = 4;
  // The baseline version compared against (empty if the artifact is brand new
  // relative to `since`). Brand-new artifacts return a single "Document added"
  // ChangedNode instead of every leaf as added.
  string baseline_version_id = 5;
  repeated ChangedNode changed_nodes = 6;
  int32 open_comment_count = 7;
}

message ProductChangesRequest {
  // Canonical topic id (content/vocab.json `topics`).
  string topic = 1;
  // Baseline: compare each artifact's latest version against the version at/just
  // before this point. Provide at most one; absent ⇒ compare against each
  // artifact's immediately-previous version.
  optional string since_git_sha = 2;
  optional string since_version_id = 3;
  optional google.protobuf.Timestamp since = 4;
}
message ProductChangesResponse {
  string topic = 1;
  int32 doc_count = 2;
  int32 blog_count = 3;
  // Only artifacts with at least one changed node (unchanged ones omitted).
  repeated ProductChangeEntry entries = 4;
}
