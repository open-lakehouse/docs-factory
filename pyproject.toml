[project]
name = "docs-factory"
version = "0.1.0"
description = "Docs-factory Python workspace — examples and tooling for the open lakehouse content pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["examples", "tools/docsnip", "seed/python"]

[tool.uv.sources]
docs-factory-seed = { workspace = true }
docsnip = { workspace = true }

[dependency-groups]
dev = [
    "ty>=0.0.50",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Harness deps for the service-backed tutorial tests (opt-in). Tutorial-script
# deps (e.g. unitycatalog-client) live inline in each script's PEP 723 block, not
# here — but the import-and-assert path needs the client importable in the pytest
# env too, so it's mirrored here as the one deliberate bridge between the two.
test-services = [
    "testcontainers>=4",
    "pytest-asyncio>=0.24",
    "unitycatalog-client>=0.5",
]

[tool.pytest.ini_options]
# Collect the engine-example suite and the colocated tutorial tests under content/.
testpaths = ["examples/tests", "content"]
# examples/tests is on the path so its test module can import the shared
# `_helpers` loader; content/ tutorials get their loader from content/conftest.py.
pythonpath = ["examples/tests"]
# UC client tutorials are async; auto mode means no per-test @mark.asyncio.
asyncio_mode = "auto"
# Service-backed tests are opt-in: excluded by default so a Docker-less `pytest`
# stays green; CI's tutorials-services job selects them with `-m`.
addopts = "-m 'not needs_docker and not needs_uc_server'"
markers = [
    "needs_docker: requires a running Docker daemon (opt-in)",
    "needs_uc_server: requires a Unity Catalog server via docker-compose (opt-in)",
]
