[project]
name = "docs-factory"
version = "0.1.0"
description = "Docs-factory Python workspace — tooling and the deterministic seeder for the open lakehouse content pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unitycatalog-client>=0.5.1",
]

[tool.uv.workspace]
members = ["tools/docsnip", "seed/python"]

[tool.uv.sources]
docs-factory-seed = { workspace = true }
docsnip = { workspace = true }

[dependency-groups]
dev = [
    "ty>=0.0.50",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Harness deps for the service-backed tutorial tests (opt-in). Only the compose
# runner is needed here: each tutorial script is executed via `uv run`, which
# resolves the script's own PEP 723 deps in an ephemeral env — so tutorial-script
# deps (e.g. unitycatalog-client) never need to be installed in the pytest env.
test-services = [
    "testcontainers>=4",
]

[tool.pytest.ini_options]
# Collect the docsnip drift/vocab tests and the colocated tutorial scripts under
# content/ (the content/ plugin turns each # /// script into a test). The former
# engine-example suite (examples/tests) was removed with the examples/ tree; the
# Delta snippets it covered now live colocated under content/ as PEP 723 scripts.
testpaths = ["tools/docsnip/tests", "content"]
# Service-backed tests are opt-in: excluded by default so a Docker-less `pytest`
# stays green; CI's tutorials-services job selects them with `-m`.
addopts = "-m 'not needs_docker and not needs_uc_server'"
markers = [
    "needs_docker: requires a running Docker daemon (opt-in)",
    "needs_uc_server: requires a Unity Catalog server via docker-compose (opt-in)",
]
