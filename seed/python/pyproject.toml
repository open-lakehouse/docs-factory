[project]
name = "docs-factory-seed"
version = "0.1.0"
description = "Deterministic Delta table seeder for docs-factory examples — the same one-liner readers of the published site and CI both use to bootstrap example data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deltalake>=0.20",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.scripts]
docs-factory-seed = "docs_factory_seed.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_factory_seed"]

# The dataset specs + generators live at the repo root under seed/datasets so they
# can be shared with the Rust seeder. They are bundled into the wheel as package data
# by the sdist/wheel build via a symlink-free copy step in CI (see seed/README.md).
