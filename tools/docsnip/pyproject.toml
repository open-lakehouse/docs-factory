[project]
name = "docsnip"
version = "0.1.0"
description = "docs-factory content tooling: frontmatter validation and snippet-marker checking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
docsnip = "docsnip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsnip"]
