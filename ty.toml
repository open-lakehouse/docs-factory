# ty configuration for docs-factory
# https://github.com/astral-sh/ty

[environment]
# Point ty at the uv-managed virtual environment
python = ".venv"

[rules]
# Enable all rules by default; override below as needed
# Uncomment to downgrade specific rules from error to warning:
# possibly-unbound = "warn"

[src]
# Type-check the workspace Python packages; exclude research/ and other non-Python dirs
include = ["examples", "tools", "seed/python"]
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".git",
    "research",
    # Spark examples import optional deps (pyspark, delta-spark) that are not in the
    # default env; they are exercised only in the gated Spark CI job.
    "examples/spark",
]
